<body>

<div class="container" id="main-content" style="display: none;">
    <!-- v202: the theme control lives INSIDE .board-headline now - it was its own
         34px band with 12px under it. It keeps id="theme-toggle-btn" because
         toggleTheme() writes its label there. -->
    <!-- Top Navigation Bar -->
    <div class="app-nav-wrap">
    <div class="top-nav-bar" id="app-nav-bar">
        <a href="index.html" class="top-nav-item nav-link">📝 Card</a>
        <a href="leaderboard.html" class="top-nav-item active nav-link">🏆 Board</a>
        <a href="skins.html" class="top-nav-item nav-link">💰 Bets</a>
        <a href="settlement.html" class="top-nav-item nav-link">🤝 Results</a>
        <a href="sidematches.html" class="top-nav-item nav-link matches-nav-link">⚔️ Matches</a>
        <a href="game.html" class="top-nav-item nav-link">📖 Game</a>
        <a href="trip.html" class="top-nav-item">🚐 Trip</a>
        <a href="admin.html" class="top-nav-item nav-link">🏠 Home</a>
    </div>
    </div>

    <!-- ONE HEADER LINE (v202). The three stacked bands above the board - the
         theme button, "← Back" and the event title - were 34 + 44 + 30 px of
         separate rows with 34px of margin between them, and on a 23-golfer round
         the first golfer sat 614px down with four of them on screen. All three are
         the same line now: Back on the left (the control people reach for - Home in
         the nav is a different thing), the event name in the middle, the theme
         control on the right. Nothing was removed. -->
    <div class="board-headline">
        <a class="back-btn" onclick="goBack()">← Back</a>
        <h2 class="event-title" id="main-title">🏆 Live Leaderboard</h2>
        <button class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
    </div>

    <div class="toggle-row" id="format-toggle">
        <span class="toggle-label active" id="label-individual" onclick="switchView('individual')">Stroke (Individual)</span>
        <label class="toggle-switch">
            <input type="checkbox" id="view-toggle-input" onchange="switchView(this.checked ? 'team' : 'individual')">
            <span class="toggle-slider"></span>
        </label>
        <span class="toggle-label" id="label-team" onclick="switchView('team')">Match (Team/Cart)</span>
    </div>

    <!-- ONE CONTROL ROW (v202). Ranking on the left, the view on the right, one
         line, 44px tall. Three stacked rows became one: the Net/Gross switch, the
         two-position By Group / All Players toggle and the three-pill flight row
         (which WRAPPED to 86px at 390 and pushed a flighted round's first golfer to
         683). The view control is one segmented control with every option the round
         can show - By Group appears only on a multi-group round, By Flight only on a
         flighted one - so switchGroupView keeps its three modes and every view keeps
         working. The old ids stay as aliases (see syncViewControl) because three
         suites drive this page through them. -->
    <div class="board-controls" id="board-controls">
        <div class="bc-rank" id="scoring-toggle">
            <span class="toggle-rank-label">Ranking</span>
            <button type="button" class="bc-seg active" id="label-net" onclick="switchScoring('net')">Net</button>
            <button type="button" class="bc-seg" id="label-gross" onclick="switchScoring('gross')">Gross</button>
            <input type="checkbox" id="scoring-toggle-input" class="bc-hidden-input" onchange="switchScoring(this.checked ? 'gross' : 'net')">
        </div>
        <div class="bc-view" id="view-pills">
            <button type="button" class="bc-seg" id="pill-all-view" onclick="switchGroupView('all')">All</button>
            <button type="button" class="bc-seg" id="pill-group-view" onclick="switchGroupView('group')">Groups</button>
            <button type="button" class="bc-seg" id="pill-flight-view" onclick="switchGroupView('flight')">Flights</button>
            <input type="checkbox" id="group-view-toggle-input" class="bc-hidden-input" onchange="switchGroupView(this.checked ? 'all' : 'group')">
            <!-- The two ids the old two-position toggle carried. Kept, hidden, and
                 kept in step by syncViewControl: three suites (and anyone's muscle
                 memory in devtools) drive the view through label-group-view /
                 label-all-view, and silently dropping them would be a dead wire. -->
            <span class="bc-hidden-input" id="label-group-view" onclick="switchGroupView('group')">By Group</span>
            <span class="bc-hidden-input" id="label-all-view" onclick="switchGroupView('all')">All Players</span>
        </div>
    </div>

    <div id="handicap-basis-note" style="display:none; white-space:pre-line; font-size:0.78rem; color:var(--text-muted); line-height:1.4; margin:0 0 10px 0;"></div>
    <div id="board-content">
        <div style="text-align:center; padding:40px; color:var(--text-muted);">Loading Leaderboard...</div>
    </div>
    <!-- NET TO PAR above answers "who is leading the round". This answers "what is
         happening in the bets" - a different question, deliberately separated so the
         general leaderboard can never masquerade as the Nassau result. -->
    <div id="live-matches-mount"></div>
    <!-- NET TO PAR above is stroke-play standings. This is the actual game being
         played - points or dots - and the two are deliberately separate boxes. -->
    <div id="live-points-mount"></div>
    <!-- Hi-Lo: two contests per hole, shown as its own game state rather than
         letting NET TO PAR stand in for a result it does not describe. -->
    <div id="live-hilo-mount"></div>
    <!-- Stroke side matches: $/hole and $/overall, shown as the wager rather than
         letting the round's NET TO PAR stand in for a bet it does not describe. -->
    <div id="live-strokebet-mount"></div>
    <!-- Live Skins sits BELOW the standings: who is leading, then who has won what. -->
    <div id="live-skins-mount"></div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyB5sBBd-pdnrdp-nu60lHTMBUUd5Kwjfyk",
      authDomain: "golfapp-9fb21.firebaseapp.com",
      databaseURL: "https://golfapp-9fb21-default-rtdb.firebaseio.com",
      projectId: "golfapp-9fb21",
      storageBucket: "golfapp-9fb21.firebasestorage.app",
      messagingSenderId: "761739328763",
      appId: "1:761739328763:web:08ac41351578565c94045e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- DARK MODE ---
    (function initTheme() {
        const saved = localStorage.getItem('golfapp-theme');
        if (saved === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    })();


    // Back to wherever this page was opened from. history.back() alone is a dead
    // end on a cold link or a bookmark - there is nothing behind it, or what is
    // behind it is outside the app - so the referrer decides, exactly as
    // instructions.html has always done it.
    function goBack() {
        if (document.referrer && document.referrer.includes(window.location.host)) {
            history.back();
        } else {
            window.location.href = 'admin.html';
        }
    }

    function toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark-mode');
        localStorage.setItem('golfapp-theme', isDark ? 'dark' : 'light');
        const btn = document.getElementById('theme-toggle-btn');
        if (btn) btn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
    }

    document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('theme-toggle-btn');
        if (btn && document.documentElement.classList.contains('dark-mode')) {
            btn.textContent = '☀️ Light Mode';
        }
    });
    // ------------------

    // --- CALENDAR-DATE SAFETY ---
    // There is deliberately NO date gate on this page.
    //
    // A beta "time bomb" used to live here: past a hardcoded date it replaced
    // document.body wholesale and threw, so the page went blank and stayed blank.
    // On the course that means a live round, a leaderboard or a settlement simply
    // vanishing mid-match. index.html was fixed in an earlier batch; this page and
    // four others were missed because the regression test only read index.html.
    //
    // ARCHITECTURAL RULE: a calendar date must never take a working round,
    // scorecard, leaderboard, settlement page, admin page or any other core app
    // page offline. Do not reintroduce a date gate here in any form.
    // ---------------------------

    const urlParams = new URLSearchParams(window.location.search);
    let currentMode = urlParams.get('game');
    let currentBoardData = {};
    // WHICH GROUP HOLDS THIS LINK (v140). The same reading index.html, the Matches
    // tab and the Bets tab make of ?group=N. It scopes WAGERS only: the standings,
    // the skins ledger and the flight cards are the whole field by design and
    // never read it.
    const lockedGroup = urlParams.get('group') ? parseInt(urlParams.get('group'), 10) : null;

    // THE v135 RULE, on the Board's two wager cards. A group link sees a side
    // match only if one of its golfers is in it; a cross-group match shows for
    // both groups in it; the bare link sees everything. grouping.js's
    // canLinkSeeWager is the one definition (Matches and Bets call the same
    // function), applied to the wager's own participants - never ownerGroup.
    // The round's own format (no wagerId) is everybody's.
    function boardLinkMaySee(wagerId) {
        if (!wagerId) return true;
        const sm = ((currentBoardData || {}).sideMatches || {})[wagerId];
        if (!sm) return true;
        const groupOf = playerGroupMap((currentBoardData && currentBoardData.players) || [], (currentBoardData && currentBoardData.groupSizeOverrides) || {});
        return canLinkSeeWager((sm.teamAIds || []).concat(sm.teamBIds || []), lockedGroup, groupOf);
    }
    
    let activeView = "individual"; 
    let activeScoring = "net";
    let groupViewMode = "group"; // "all" | "group" — which mode the Individual view renders in

    if (!currentMode) {
        window.location.href = "admin.html";
    } else {
        currentMode = currentMode.toUpperCase();
        document.getElementById("main-content").style.display = "block";

        document.querySelectorAll('.nav-link').forEach(link => {
            const base = link.getAttribute('href').split('?')[0];
            let navHref = base + '?game=' + currentMode;
            const groupParam = urlParams.get('group');
            if (groupParam) navHref += '&group=' + groupParam;
            link.href = navHref;
        });

        db.ref(`events/${currentMode}`).on('value', (snapshot) => {
            currentBoardData = snapshot.val() || {};
            document.getElementById("main-title").textContent = `🏆 ${currentBoardData.eventName || "Live Leaderboard"}`;
            renderBoard();
        });
    }

    // parseHcp and getStrokes now come from money-engine.js. They were duplicated
    // here verbatim; two copies of a handicap rule is one copy too many.

    function formatToPar(val) {
        if (val === 0) return '<span class="to-par-even">E</span>';
        if (val > 0) return `<span class="to-par-over">+${val}</span>`;
        return `<span class="to-par-under">${val}</span>`;
    }

    // getSmartDisplayName(player, allPlayers) lives in text-safe.js since v190 -
    // lifted verbatim so the Game tab shows the same name the Board does.

    function switchView(view) {
        activeView = view;
        document.getElementById('view-toggle-input').checked = (view === 'team');
        document.getElementById('label-individual').classList.toggle('active', view === 'individual');
        document.getElementById('label-team').classList.toggle('active', view === 'team');

        if (view === 'individual') {
            document.getElementById('scoring-toggle').style.display = 'flex';
        } else {
            document.getElementById('scoring-toggle').style.display = 'none';
            document.getElementById('group-view-toggle').style.display = 'none';
        }

        renderBoard();
    }

    function switchScoring(scoring) {
        activeScoring = scoring;
        document.getElementById('scoring-toggle-input').checked = (scoring === 'gross');
        document.getElementById('label-net').classList.toggle('active', scoring === 'net');
        document.getElementById('label-gross').classList.toggle('active', scoring === 'gross');
        renderBoard();
    }

    let groupViewChosen = false;   // did the golfer pick a mode, or is this the default?
    function switchGroupView(mode) {
        groupViewMode = mode;
        groupViewChosen = true;
        document.getElementById('group-view-toggle-input').checked = (mode === 'all');
        document.getElementById('label-group-view').classList.toggle('active', mode === 'group');
        document.getElementById('label-all-view').classList.toggle('active', mode === 'all');
        ['group', 'flight', 'all'].forEach(m => {
            const el = document.getElementById('pill-' + m + '-view');
            if (el) el.classList.toggle('active', mode === m);
        });
        renderBoard();
    }
    // FLIGHTS ON THE BOARD: enabled is enough - standings are not a game, so no
    // scope decides them. Absent or off: false, and every branch below is today's.
    function boardFlightsOn() {
        const f = currentBoardData && currentBoardData.flights;
        return !!(f && f.enabled === true) && typeof playerFlight === 'function';
    }

    // ---- THE VIEW CONTROL, AND WHAT A BIG ROUND OPENS ON (v202) --------------
    //
    // PART 1. A round with MORE THAN TWELVE golfers opens on ALL PLAYERS. By Group
    // was the default for every multi-group round, so a 23-golfer board arrived as
    // six bordered cards with six header rows - the first golfer 614px down with
    // four on screen, and 1899px of list. The same round flat: 482px and seven, at
    // 1219px. Nothing is removed and no control moves; a golfer who wants groups
    // taps Groups, and groupViewChosen means their choice wins and sticks for the
    // session (it already did - this only changes what "not chosen yet" means).
    // TWELVE because three foursomes still fit a card each without scrolling; the
    // fourth is where a grouped board stops being readable on arrival.
    const BIG_FIELD_ABOVE = 12;
    function bigFieldDefault(players) { return ((players || []).length > BIG_FIELD_ABOVE) ? 'all' : 'group'; }

    // The segmented control: which options the round can show, and which is on.
    // The retired two-position toggle's ids (label-group-view / label-all-view) and
    // its checkbox are kept hidden and in step - three suites drive the page through
    // them, and a dead wire is worse than a visible one.
    function syncViewControl(opts) {
        const o = opts || {};
        const set = (id, show, active) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.style.display = show ? '' : 'none';
            el.classList.toggle('active', !!active);
        };
        set('pill-all-view', true, o.mode === 'all');
        set('pill-group-view', !!o.multiGroup, o.mode === 'group');
        set('pill-flight-view', !!o.flights, o.mode === 'flight');
        const box = document.getElementById('group-view-toggle-input');
        if (box) box.checked = (o.mode === 'all');
        ['label-group-view', 'label-all-view'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('active', id === (o.mode === 'all' ? 'label-all-view' : 'label-group-view'));
        });
        const ctl = document.getElementById('board-controls');
        if (ctl) ctl.style.display = 'flex';
        // The view control itself is always shown - it always has All to offer. Set
        // explicitly because three suites read #view-pills' own display.
        const view = document.getElementById('view-pills');
        if (view) view.style.display = 'flex';
        syncRankControl();
    }
    // THE RANKING SEGMENTS, IN STEP ON EVERY RENDER (v202). Their "on" state used to
    // live only in the static markup and in switchScoring - so it was right on
    // arrival and right after a tap, but nothing re-asserted it, and any future path
    // that set activeScoring without going through the tap would leave the control
    // lying about the ranking it shows.
    function syncRankControl() {
        const net = document.getElementById('label-net');
        const gross = document.getElementById('label-gross');
        if (net) net.classList.toggle('active', activeScoring !== 'gross');
        if (gross) gross.classList.toggle('active', activeScoring === 'gross');
        const box = document.getElementById('scoring-toggle-input');
        if (box) box.checked = (activeScoring === 'gross');
    }
    // THE FORMAT TOGGLE ONLY WHERE IT MEANS SOMETHING (v202): Match (Team/Cart)
    // needs a round that actually plays a match - the format, or a side match.
    // Every stroke round paid 34px for a switch that had nothing to switch to.
    function boardHasMatches(data) {
        const d = data || {};
        if (d.gameFormat === 'match' || d.gameFormat === 'bestball' || d.gameFormat === 'nassau') return true;
        return Object.keys(d.sideMatches || {}).length > 0;
    }

    function shareResults() {
        const sharedUrl = shareBaseUrl() + `shared.html?game=${currentMode}`;
        
        const courseName = currentBoardData.courseName || "Live Round";
        const dateObj = new Date();
        const dateString = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        
        const textMsg = `${courseName} Scorecard - ${dateString}`;
        
        if (navigator.share) {
            navigator.share({
                title: `${courseName} Scorecard`,
                text: textMsg,
                url: sharedUrl
            }).catch(console.error);
        } else {
            const smsUrl = `sms:?&body=${encodeURIComponent(textMsg + '\n\n' + sharedUrl)}`;
            window.location.href = smsUrl;
        }
    }

    // Sorts a copy of results and renders the classic single flat table — used when there's
    // only one group, or the person has toggled to "All Players".
    // ---- THE SCORE CELL -----------------------------------------------------
    //
    // GROSS AND NET TOGETHER, ALWAYS. The board computed both for every golfer and
    // then displayed neither - it showed "To Par" for whichever basis the toggle
    // happened to be on. So checking the app against a paper card meant flipping the
    // toggle back and forth and holding one number in your head.
    //
    // Gross is primary because that is what is written on the card in front of you;
    // net sits under it because that is the number the money is decided on. Stacked
    // rather than columned: six columns at 390px squeezes the player name, and the
    // Receipt scorecard already establishes this gross-over-net pattern, so the two
    // screens now agree.
    //
    // NO ARITHMETIC HERE. r.gross and r.net are computed once in renderBoard() using
    // the canonical getStrokes/parseHcp pair. This function formats them.
    // NO NET LINE WITHOUT A HANDICAP (v201). With no handicap the net IS the gross,
    // and printing it twice invites "why are these the same?" - the question the
    // blank "HCP:" line was already provoking above it.
    function scoreCellHtml(r) {
        const hasHcp = String(r.hcp === undefined || r.hcp === null ? '' : r.hcp).trim() !== '';
        return '<td class="score-cell">'
             + '<span class="score-gross">' + r.gross + '</span>'
             + (hasHcp ? '<span class="score-net">Net ' + r.net + '</span>' : '')
             + '</td>';
    }

    // LIVE MATCHES & PRESSES - reads buildLiveMatchState() in money-engine.js, the
    // shared presenter the Leaderboard also uses, so the two surfaces cannot tell
    // different stories about the same match. It formats; it decides nothing.
    //
    // NO SETTLEMENT ARITHMETIC HERE. During play a golfer needs to know who is up and
    // which presses are running - not what it pays. That belongs in Results.
    // The leaderboard has no group lock of its own - it shows the whole field - so
    // the link carries only the game and the wager to focus.
    function sideMatchPressHref(wagerId) {
        const loc = window.location;
        const dir = loc.pathname.replace(/\/[^\/]*$/, '/');
        const game = (typeof currentMode !== 'undefined' && currentMode) ? currentMode
                   : (new URLSearchParams(loc.search).get('game') || '');
        return loc.origin + dir + 'sidematches.html?game=' + encodeURIComponent(game)
             + '&press=' + encodeURIComponent(wagerId);
    }

    // LIVE GAME — Stableford / Wolf / Dots.
    //
    // These games showed only "NET TO PAR", which is not the game being played.
    // Reads buildLivePointsState() in money-engine.js - the same shared presenter
    // the Leaderboard uses - so the two surfaces cannot disagree. It formats;
    // every number comes from the canonical engine.
    //
    // Points and dots only. No projected payout: what a game is worth is settled
    // in Results, and a running dollar figure mid-round is not final.
    function buildLivePointsHtml(data, courseData, savedScores) {
        if (typeof buildLivePointsState !== 'function') return '';
        const st = buildLivePointsState(data, courseData, savedScores);
        if (!st) return '';
        const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
        const fmtVal = v => (st.signed && v > 0 ? '+' : '') + v + (st.unit ? ' ' + st.unit : '');

        let html = '<div class="lg-card"><div class="lg-head">'
            + '<span class="lg-title">' + st.icon + ' LIVE GAME \u00B7 ' + esc(st.label) + '</span>'
            + '<span class="lg-sub">' + (st.thru ? 'thru ' + st.thru : '')
            + (st.extra ? ' \u00B7 ' + esc(st.extra) : '') + '</span></div>';

        if (!st.started) {
            // Zeros for everyone would read as a genuine four-way tie.
            html += '<div class="lg-quiet">No scoring yet.</div>';
            return html + '</div>';
        }
        st.rows.forEach(r => {
            html += '<div class="lg-row">'
                 + '<span class="lg-rank">' + (r.tied ? 'T' : '') + r.rank + '</span>'
                 + '<span class="lg-name">' + esc(r.name) + '</span>'
                 + '<span class="lg-val">' + fmtVal(r.value) + '</span></div>';
        });
        return html + '</div>';
    }

    // LIVE HI-LO. Reads buildLiveHiLoState() in money-engine.js - the same shared
    // presenter the Leaderboard uses. Hi-Lo is two contests per hole, low ball and
    // high ball, so the card shows the point standing and how each contest got
    // there. No match-play UP/DOWN language: Hi-Lo does not work that way.
    //
    // NO MONEY. Settlement is (t1Points - t2Points) x holeBetStake and belongs in
    // Results; a running figure mid-round is not final.
    function buildLiveHiLoHtml(data, courseData, savedScores) {
        if (typeof buildLiveHiLoState !== 'function') return '';
        const st = buildLiveHiLoState(data, courseData, savedScores);
        if (!st) return '';
        const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

        let html = '<div class="lg-card"><div class="lg-head">'
            + '<span class="lg-title">' + st.icon + ' LIVE GAME \u00B7 ' + esc(st.label) + '</span>'
            + '<span class="lg-sub">' + (st.thru ? 'thru ' + st.thru : '') + '</span></div>';

        if (!st.started) {
            html += '<div class="lg-quiet">No scoring yet.</div>';
            return html + '</div>';
        }
        html += '<div class="lg-row"><span class="lg-name">' + esc(st.t1Name) + '</span>'
             + '<span class="lg-val">' + st.t1Points + '</span></div>'
             + '<div class="lg-row"><span class="lg-name">' + esc(st.t2Name) + '</span>'
             + '<span class="lg-val">' + st.t2Points + '</span></div>'
             + '<div class="lg-row"><span class="hl-lead">' + esc(st.leadText) + '</span></div>';

        // How each contest got there - the part net-to-par can never show.
        const col = (title, t) => '<div><div class="hl-col-title">' + title + '</div>'
            + '<div class="hl-line"><span>' + esc(st.t1Name) + '</span><span>' + t.t1 + '</span></div>'
            + '<div class="hl-line"><span>' + esc(st.t2Name) + '</span><span>' + t.t2 + '</span></div>'
            + (t.tied ? '<div class="hl-line lg-quiet"><span>halved</span><span>' + t.tied + '</span></div>' : '')
            + '</div>';
        html += '<div class="hl-split">' + col('LOW', st.low) + col('HIGH', st.high) + '</div>';
        return html + '</div>';
    }

    // LIVE STROKE BET. Reads buildLiveStrokeBetStates() in money-engine.js - the
    // shared presenter the Leaderboard also uses. A stroke side match is TWO bets,
    // $/hole and $/overall, so the card shows them side by side rather than as one
    // number that would hide which wager is which.
    //
    // Compact by design: this is the first live card that genuinely stacks with
    // the leaderboard and Skins, so it stays two short columns, not a table.
    //
    // NO MONEY TOTALS. What the next hole is worth is game state - a running
    // payout is settlement's, and is not final mid-round.
    function buildLiveStrokeBetHtml(data, courseData, savedScores, visibleIds) {
        if (typeof buildLiveStrokeBetStates !== 'function') return '';
        // Scoped to the link's group AFTER the engine builds every state over the
        // whole field (visibleIds), so a group link sees only the bets its golfers
        // are in and the bare link sees them all.
        // (Every stroke-bet state IS a side match - the engine keys each by its
        // sideMatches id - so the wagerId alone decides.)
        const states = (buildLiveStrokeBetStates(data, courseData, savedScores, visibleIds) || [])
            .filter(st => boardLinkMaySee(st.wagerId));
        if (!states || states.length === 0) return '';
        const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

        let html = '';
        states.forEach(st => {
            html += '<div class="lg-card"><div class="lg-head">'
                 + '<span class="lg-title">' + st.icon + ' LIVE GAME \u00B7 ' + esc(st.label) + '</span>'
                 + '<span class="lg-sub">' + esc(st.p1Name) + ' v ' + esc(st.p2Name)
                 + (st.thru ? ' \u00B7 thru ' + st.thru : '') + '</span></div>';

            if (!st.started) {
                html += '<div class="lg-quiet">No scoring yet.</div></div>';
                return;
            }
            html += '<div class="sb-split">';
            if (st.hole) {
                html += '<div><div class="sb-col-title">$/HOLE \u00B7 $' + st.hole.stake + '</div>'
                     + '<div class="sb-line"><span>' + esc(st.p1Name) + '</span><span>' + st.hole.p1Holes + '</span></div>'
                     + '<div class="sb-line"><span>' + esc(st.p2Name) + '</span><span>' + st.hole.p2Holes + '</span></div>'
                     // A halved hole raises what the NEXT one is worth - the golfer
                     // standing on the tee needs that, not a total.
                     + (st.hole.carry > 0
                        ? '<div class="sb-note">next hole $' + st.hole.currentStake + '</div>' : '')
                     + '</div>';
            }
            if (st.overall) {
                html += '<div><div class="sb-col-title">OVERALL \u00B7 $' + st.overall.stake + '</div>'
                     + '<div class="sb-line"><span>' + esc(st.p1Name) + '</span><span>' + st.overall.p1Total + '</span></div>'
                     + '<div class="sb-line"><span>' + esc(st.p2Name) + '</span><span>' + st.overall.p2Total + '</span></div>'
                     + '<div class="sb-lead">' + esc(st.overall.leadText)
                     + (st.overall.closed ? ' \u00B7 FINAL' : '') + '</div>'
                     + '</div>';
            }
            html += '</div></div>';
        });
        return html;
    }

    function buildLiveMatchHtml(data, courseData, savedScores, visibleIds) {
        if (typeof buildLiveMatchStates !== 'function') return '';
        // EVERY wager visible to this viewer, not just the round format. A real
        // Nassau is created from Action and lives in sideMatches, so reading only
        // the round format left the supported path invisible on the scorecard.
        // Scoped to the link's group AFTER the engine builds every state over the
        // whole field (visibleIds). A match this link may not see is not a card,
        // so its press link - which lands on a Matches tab where the card is
        // hidden - is never offered either.
        const states = (buildLiveMatchStates(data, courseData, savedScores, visibleIds) || [])
            .filter(st => !st.isSideMatch || boardLinkMaySee(st.wagerId));
        if (!states || states.length === 0) return '';
        const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
        // The stake is what DEFINES the bet, so it belongs on screen. Amounts only -
        // never a running total, which is settlement's job and is not final mid-round.
        const money = v => (v === undefined || v === null || isNaN(Number(v))) ? '' : '$' + Number(v);

        let html = '<div class="lm-card"><div class="lm-head">'
            + '<span class="lm-title">\u2694\uFE0F LIVE MATCHES &amp; PRESSES</span>'
            + '<span class="lm-sub">' + states.length + ' wager' + (states.length === 1 ? '' : 's')
            + '</span></div>';

        states.forEach((st, i) => {
            if (i > 0) html += '<div class="lm-divider"></div>';
            html += '<div class="lm-wager-head">' + esc(st.formatLabel) + ' \u00B7 '
                 + esc(st.t1Name) + ' v ' + esc(st.t2Name)
                 + (st.thru ? ' \u00B7 thru ' + st.thru : '');
            // PRESS, WITHOUT A SECOND WRITE PATH.
            //
            // The writer for a side-match press lives in sidematches.html with its
            // amount prompt, permission gate and offline guard. Porting it here would
            // mean two implementations of a money write, and a write-side divergence
            // corrupts data rather than merely displaying it wrong.
            //
            // So this is a LINK, not a button: it carries the golfer to the wager on
            // the Matches tab with the card highlighted, and they press there with the
            // amount in front of them. One tap more, one write path.
            if (st.isSideMatch && st.canPress && st.wagerId) {
                html += '<a class="lm-press-link" href="' + esc(sideMatchPressHref(st.wagerId))
                     + '">\uD83D\uDD25 Press \u00B7 H' + st.nextPressHole + ' \u203A</a>';
            }
            html += '</div>';

            st.segments.forEach(seg => {
                html += '<div class="lm-seg' + (seg.closed ? ' lm-closed' : '') + '">'
                     + '<div class="lm-seg-row"><span class="lm-seg-name">' + esc(seg.label.toUpperCase()) + '</span>'
                     + '<span class="lm-seg-status' + (seg.started ? '' : ' lm-quiet') + '">'
                     + esc(seg.statusText) + (seg.closed ? ' \u00B7 FINAL' : '') + '</span>'
                     + '<span class="lm-stake">' + money(seg.stake) + '</span></div>';
                seg.presses.forEach(p => {
                    html += '<div class="lm-press' + (p.closed ? ' lm-closed' : '') + '">'
                         + '<span class="lm-press-tag">' + (p.auto ? 'AUTO' : 'MANUAL')
                         + ' PRESS \u00B7 H' + p.startHole + '</span>'
                         + '<span class="lm-press-status">' + esc(p.statusText)
                         + (p.closed ? ' \u00B7 FINAL' : '') + '</span>'
                         + '<span class="lm-stake">' + money(p.stake) + '</span></div>';
                });
                html += '</div>';
            });
        });
        return html + '</div>';
    }

    // ---- LIVE SKINS ---------------------------------------------------------
    //
    // WHO WON WHAT HOLE - never how much it is worth. Until the round finishes the
    // number of winning skins can still change, so any dollar figure shown now is a
    // guess that will be contradicted later. Results answers "how much"; this
    // answers "who", which is the question people ask on the course.
    //
    // EVERY FIGURE IS CANONICAL. computeSkinsHoleLedger() in settlement-engine.js is
    // the same resolver the scorecard uses - it decides low scores, ties, carries and
    // crucially whether a hole is OFFICIAL, meaning every participant has posted it.
    // This function reads its rows and writes sentences. It resolves nothing.
    function lbSkinsGroupOf(playerId) {
        const players = (currentBoardData.players || []);
        const idx = players.findIndex(p => String(p.id) === String(playerId));
        if (idx < 0) return null;
        // computeGroupBoundaries returns { group, startIdx, size } - not start/end.
        // Reading the wrong field returned null for everyone, so the waiting line fell
        // back to listing eight names instead of saying "Group 3".
        const boundaries = computeGroupBoundaries(players.length, currentBoardData.groupSizeOverrides || {});
        for (let i = 0; i < boundaries.length; i++) {
            const b = boundaries[i];
            if (idx >= b.startIdx && idx < b.startIdx + b.size) return b.group;
        }
        return null;
    }

    function renderLiveStrokeBetBoard() {
        const mount = document.getElementById('live-strokebet-mount');
        if (!mount) return;
        mount.innerHTML = buildLiveStrokeBetHtml(currentBoardData || {},
            (currentBoardData && currentBoardData.courseData) || [],
            (currentBoardData && currentBoardData.scores) || {},
            ((currentBoardData && currentBoardData.players) || []).map(p => String(p.id)));
    }

    function renderLiveHiLoBoard() {
        const mount = document.getElementById('live-hilo-mount');
        if (!mount) return;
        mount.innerHTML = buildLiveHiLoHtml(currentBoardData || {},
            (currentBoardData && currentBoardData.courseData) || [],
            (currentBoardData && currentBoardData.scores) || {});
    }

    function renderLivePointsBoard() {
        const mount = document.getElementById('live-points-mount');
        if (!mount) return;
        mount.innerHTML = buildLivePointsHtml(currentBoardData || {},
            (currentBoardData && currentBoardData.courseData) || [],
            (currentBoardData && currentBoardData.scores) || {});
    }

    function renderLiveMatchesBoard() {
        const mount = document.getElementById('live-matches-mount');
        if (!mount) return;
        // The engine is handed the whole field; buildLiveMatchHtml then keeps the
        // wagers this link may see (boardLinkMaySee) - the v135 rule, since v140.
        mount.innerHTML = buildLiveMatchHtml(currentBoardData || {},
            (currentBoardData && currentBoardData.courseData) || [],
            (currentBoardData && currentBoardData.scores) || {},
            ((currentBoardData && currentBoardData.players) || []).map(p => String(p.id)));
    }

    function renderLiveSkinsBoard() {
        const mount = document.getElementById('live-skins-mount');
        if (!mount) return;
        mount.innerHTML = '';
        if (typeof computeSkinsHoleLedger !== 'function') return;

        const data = currentBoardData || {};
        const courseData = data.courseData || [];
        const savedScores = data.scores || {};
        if (courseData.length === 0) return;

        // A round with no skins money must not grow a skins card.
        // ONE PREDICATE FOR THE WHOLE APP. This asked only about legacy shapes, so a
        // round created through the real setup flow - Money Pool with Net Skins -
        // answered "no skins" and this surface silently rendered nothing.
        if (!roundHasSkinsGame(data)) return;

        // FROM THE RIGHT CONFIG (live-skins.js): one section per skins wager, built
        // from that wager's own config, plus the Main Pool bucket's own section
        // (gross or net as the bucket says, never flighted). This used to hand the
        // ROUND to the ledger builder, so a pool-only round drew NET cards per
        // flight for a gross, field-wide pot. Per flight within a flighted section
        // (Wave 2): one card per flight, the hole rows carrying the flight.
        if (typeof liveSkinsLedgerEntries !== 'function') return;
        let entries;
        try {
            entries = liveSkinsLedgerEntries(data, courseData, savedScores, { groupOf: lbSkinsGroupOf });
        } catch (e) {
            return;   // a presenter must never take the leaderboard down with it
        }
        if (entries.length === 0) return;
        const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
        const many = entries[0].section.count > 1;
        mount.innerHTML = entries.map(e => renderLiveSkinsCard(e, e.flighted, esc, many ? e.section.label : '')).join('');
    }

    function renderLiveSkinsCard(entry, flighted, esc, sectionLabel) {
        const bundle = entry.bundle;
        const L = entry.L;
        // BASIS COMES FROM THE SKINS GAME, not the leaderboard's ranking toggle.
        // Those are different questions and must not be allowed to drift together.
        const basis = bundle.net ? 'Net' : 'Gross';

        // The section label names WHICH skins money this card is, only when the
        // round has more than one (a wager and the pool bucket, or two wagers).
        let html = '<div class="ls-card"><div class="ls-head">\uD83E\uDD69 LIVE SKINS' + (sectionLabel ? ' \u2014 ' + esc(sectionLabel).toUpperCase() : '')
            + (flighted ? ' \u2014 FLIGHT ' + entry.flight : '') + '</div>';
        if (flighted && L.participants.length === 0) {
            return html + '<div class="ls-summary ls-quiet">Nobody in this flight.</div></div>';
        }

        const standings = Object.keys(L.countsByPlayerId)
            .map(id => ({ id, n: L.countsByPlayerId[id] }))
            .filter(r => r.n > 0)
            .sort((a, b) => b.n - a.n)
            .map(r => {
                const pl = L.participants.find(p => String(p.id) === String(r.id));
                return (pl ? pl.name : '?') + ' ' + r.n;
            });
        html += standings.length > 0
            ? '<div class="ls-summary">' + esc(standings.join(' \u00B7 ')) + '</div>'
            : '<div class="ls-summary ls-quiet">No skins won yet.</div>';

        // FULL HOLE NAMES. This is read next to a paper card, and the card says
        // "Hole 14", not "H14".
        // THE SAME ROWS AS THE RECEIPT AND THE CARD, from the one builder in
        // live-skins.js (buildSkinsLedgerRows): only the holes that paid, a carry
        // round's tied holes as one run in the same words. This board adds what
        // is its own: COMPACT ON A PHONE - only the FIRST waiting hole is shown,
        // because fourteen identical "Waiting for Groups 1, 2, 3" rows push the
        // results off the screen and tell nobody anything the one above did not
        // - and its own row markup.
        const firstWaitingHole = (L.firstWaiting && L.firstWaiting.hole) || null;
        const rows = [];
        buildSkinsLedgerRows(L, basis).forEach(row => {
            if (row.kind === 'waiting') {
                if (row.hole !== firstWaitingHole) return;
                const gs = row.missingGroups || [];
                const who = gs.length === 1 ? 'Group ' + gs[0]
                    : gs.length > 1 ? 'Groups ' + gs.join(', ')
                    : (row.missing || []).map(m => m.name).join(', ');
                rows.push('<div class="ls-r ls-w">' + row.label + ' — Waiting for ' + esc(who || 'the field') + '</div>');
                return;
            }
            if (row.kind === 'carry') { rows.push('<div class="ls-r ls-c">' + row.text + '</div>'); return; }
            rows.push('<div class="ls-r ls-s">' + row.label + ' — ' + esc(row.winner.name)
                 + ' · ' + row.score + row.collected + '</div>');
        });
        if (rows.length === 0) rows.push('<div class="ls-r ls-w">No skins won yet.</div>');
        html += '<div class="ls-rows">' + rows.join('') + '</div></div>';

        return html;
    }

    // ONE ROW BUILDER for every standings table on this page - the flat board, the
    // group cards and the flight cards. Two entry points means one builder
    // (CLAUDE.md); the Wave 1 team-card regression is what happens otherwise.
    // `posStyle` is the group cards' narrow position cell; `badge` is the A/B
    // tag, shown ONLY where the section does not already say it (All Players).
    function boardSort(results) {
        return results.slice().sort((a, b) => {
            if (a.thru === 0 && b.thru > 0) return 1;
            if (b.thru === 0 && a.thru > 0) return -1;
            return a.sortVal - b.sortVal;
        });
    }
    // THE POSITION LABEL COMES FROM THE ENGINE. computeNetToParStandings() ranks
    // with the tie rule - 1, T2, T2, T4 - and hands every row a positionLabel;
    // this page used to print its own index over its own sort and read 1, 2, 3,
    // 4 straight down a tie. A card ranks WITHIN the card, so it asks the same
    // engine for the card's golfers: one rule, one implementation, and the same
    // answer settlement.html's LIVE RESULTS and the Receipt already give.
    // Returns { id -> label }; a golfer not started is '-' (as the row draws it).
    function boardPositionLabels(sectionResults) {
        const map = {};
        const ids = new Set(sectionResults.map(r => String(r.id)));
        const players = ((currentBoardData && currentBoardData.players) || []).filter(p => ids.has(String(p.id)));
        const rows = computeNetToParStandings(players, currentBoardData.courseData || [], currentBoardData.scores || {},
            { basis: activeScoring === 'net' ? 'net' : 'gross' });
        rows.forEach(r => { map[String(r.id)] = r.started ? r.positionLabel : '-'; });
        return map;
    }
    // v192: gap counts by golfer id for the board being drawn (score-gaps.js, per
    // group with the round's boundaries), refreshed at every renderBoard. The
    // flag is drawn beside the name; the total, the position and thru are the
    // engine's numbers, untouched.
    let gapCountById = {};
    function refreshGapCounts() {
        gapCountById = {};
        if (typeof findScoreGapsByGroup !== 'function' || !currentBoardData) return;
        const players = currentBoardData.players || [];
        const boundaries = (typeof computeGroupBoundaries === 'function') ? computeGroupBoundaries(players.length, currentBoardData.groupSizeOverrides || {}) : null;
        findScoreGapsByGroup(players, currentBoardData.courseData || [], currentBoardData.scores || {}, boundaries)
            .forEach(g => { gapCountById[String(g.id)] = g.holes.length; });
    }
    const gapFlagHtml = id => gapCountById[String(id)] ? `<span class="gap-flag">\u26A0 missing ${gapCountById[String(id)]}</span>` : '';
    // v195: a golfer marked Out on the Players sheet - greyed, tagged, still listed
    // with his scores (the engine has already left him out of every pot).
    const outById = () => { const m = {}; ((currentBoardData && currentBoardData.players) || []).forEach(p => { if (p.out === true) m[String(p.id)] = true; }); return m; };
    const outTagHtml = id => outById()[String(id)] ? '<span class="gap-flag">OUT</span>' : '';

    // ---- THE SKINS BADGE (v201) ---------------------------------------------
    // "🥩 2" beside a winner's name, from L.countsByPlayerId - the SAME ledger the
    // LIVE SKINS card below and the Receipt read (live-skins.js
    // liveSkinsLedgerEntries). NO NEW MATH: this sums nothing and decides nothing,
    // it reads the engine's own count per golfer. Per flight when the round's skins
    // are flighted, because then a golfer's skins are the ones won inside their own
    // pot; a golfer in two sections (a wager AND the pool bucket) shows the total of
    // both, which is what "how many skins do I have" means to them.
    // Refreshed at every renderBoard, like the gap counts.
    let skinsCountById = {};
    function refreshSkinsCounts() {
        skinsCountById = {};
        const data = currentBoardData;
        if (!data || typeof liveSkinsLedgerEntries !== 'function' || typeof roundHasSkinsGame !== 'function') return;
        if (!roundHasSkinsGame(data)) return;
        let entries;
        try { entries = liveSkinsLedgerEntries(data, data.courseData || [], data.scores || {}, { groupOf: lbSkinsGroupOf }); }
        catch (e) { return; }   // a badge must never take the board down
        entries.forEach(e => {
            const counts = (e.L && e.L.countsByPlayerId) || {};
            Object.keys(counts).forEach(id => {
                const n = Number(counts[id]) || 0;
                if (n > 0) skinsCountById[String(id)] = (skinsCountById[String(id)] || 0) + n;
            });
        });
    }
    const skinsBadgeHtml = id => skinsCountById[String(id)]
        ? '<span class="skins-badge">\uD83E\uDD69 ' + skinsCountById[String(id)] + '</span>' : '';

    // A FINISHED GOLFER READS "F" (v201). The hole count answers "how far are they";
    // once the card is complete the answer is "done", and 18 beside 18 beside 18
    // tells nobody anything. The round's own hole count, never a hard 18 - a nine
    // is a finished round at 9.
    function thruCellText(r) {
        const holes = ((currentBoardData && currentBoardData.courseData) || []).length;
        return (holes > 0 && r.thru >= holes) ? 'F' : String(r.thru);
    }
    function boardRowHtml(r, idx, opts) {
        const posStyle = (opts && opts.posStyle) ? ` style="${opts.posStyle}"` : '';
        const badge = ((opts && opts.badge) ? `<span class="player-flight">${opts.badge}</span>` : '') + gapFlagHtml(r.id) + outTagHtml(r.id);
        const outCls = outById()[String(r.id)] ? ' golfer-out' : '';
        // The two tables were written with different source indentation and the
        // rendered-board golden pins each byte for byte; the indent is a parameter
        // so ONE builder can still produce both.
        const ind = (opts && opts.indent) || '                    ';
        // data-player-id (2026-09-16): the tap-a-name card finds the golfer by
        // THIS, never by row index - a row's position moves with every score.
        // The rendered-board goldens compare with the attribute stripped: only
        // the attribute moved, the text is identical.
        const pid = ` data-player-id="${escapeHtml(String(r.id))}"`;
        if (r.thru === 0) {
            return `<tr${pid}${outCls ? ' class="golfer-out"' : ''}><td${posStyle}>-</td><td class="player-name">${escapeHtml(r.name)}${badge}${skinsBadgeHtml(r.id)}</td><td>-</td><td>-</td><td>0</td></tr>`;
        }
        let posClass = (idx === 0 ? 'row-leader' : '') + outCls;
        // A BLANK HANDICAP SAYS NOTHING (v201). "HCP: " with nothing after it read as
        // a bug, and so did "Net 41" on a golfer the app has no handicap for - the net
        // is the gross, dressed as a second number. With a handicap: "HCP 6" on the
        // same line as the name (v201: one line, left-aligned, half the height) and
        // the net line under the gross.
        const hcpText = String(r.hcp === undefined || r.hcp === null ? '' : r.hcp).trim();
        const boardPlayer = (currentBoardData && currentBoardData.players || []).find(p => String(p.id) === String(r.id));
        // v212: the row is the COMPACT label - "Index 18 · Course 17". It used to
        // carry handicap.js's full three-part form, which is the right sentence in
        // the wrong place: on a 390px phone "Index 18 · Course 17.2 · Playing 17"
        // is most of the line the golfer's NAME has to share. The full form, with
        // the decimals and the Playing Handicap, is on the expanded card below.
        const compact = (boardPlayer && typeof handicapCompactLabel === 'function') ? handicapCompactLabel(boardPlayer) : null;
        const hcpHtml = compact
            ? `<span class="player-hcp">${escapeHtml(compact)}</span>`
            : (hcpText === '' ? '' : `<span class="player-hcp">HCP ${escapeHtml(hcpText)}</span>`);
        return `<tr class="${posClass}"${pid}>
${ind}<td${posStyle}>${opts && opts.label !== undefined ? opts.label : idx + 1}</td>
${ind}<td class="player-name">${escapeHtml(r.name)}${badge}${skinsBadgeHtml(r.id)}${hcpHtml}</td>
${ind}${scoreCellHtml(r)}
${ind}<td style="font-size: 1.1rem;">${formatToPar(r.toPar)}</td>
${ind}<td>${thruCellText(r)}</td>
${ind.slice(4)}</tr>`;
    }
    // ---- TAP A NAME, SEE THEIR CARD (wave 2, 2026-09-16) --------------------
    //
    // openCards holds the ids whose card is open. The board re-renders on every
    // snapshot and every toggle, so the card is RE-EMITTED at render from this
    // set rather than inserted once - a card that was inserted into the DOM
    // would vanish the moment the next score landed. Several may be open at
    // once: comparing two golfers' cards is the thing a board is for, and a
    // Set is what holds that; closing one never closes another.
    //
    // The card is a SECOND <tr>, emitted BESIDE boardRowHtml by the two table
    // loops (flat, and the section cards) - never inside the row builder, and
    // with no player-name cell in it, so flights_leaderboard_test's one-builder
    // rule stands. The rows themselves come from scorecard-rows.js, laid out as
    // two stacked nines; this page draws no cell.
    //
    // Net rows on the Receipt's terms: ScorecardRows.netMattersOn(round) - a
    // handicap AND money decided on net. The board's own Net/Gross toggle is
    // about how the STANDINGS are shown and does not add a net row: the card is
    // the round's record, the same card the Receipt prints.
    //
    // A score is not a wager: the card renders on every link, no group check.
    const openCards = new Set();
    function toggleBoardCard(id) {
        const key = String(id);
        if (openCards.has(key)) openCards.delete(key); else openCards.add(key);
        renderBoard();
    }
    function boardCardRowHtml(id) {
        const key = String(id);
        if (!openCards.has(key)) return '';
        const data = currentBoardData || {};
        const player = (data.players || []).find(p => String(p.id) === key);
        if (!player || typeof ScorecardRows === 'undefined') return '';
        const ringOf = (typeof scoreMarkClass === 'function') ? (s, par) => scoreMarkClass(s, par).trim() : () => '';
        const card = ScorecardRows.scorecardStackedHtml({
            courseData: data.courseData || [], scores: data.scores || {}, players: [player],
            showNet: ScorecardRows.netMattersOn(data), ringOf: ringOf
        });
        // v212: THE FULL HANDICAP FORM, and this is the only place it is said in
        // full on this page - the row above carries the compact one. Nothing is
        // drawn for a golfer with no Index: an empty line would read as a bug,
        // the same reason a blank handicap says nothing in the row.
        const full = (typeof handicapFullLabel === 'function') ? handicapFullLabel(player) : null;
        const hcpLine = full ? `<div class="board-card-hcp">${escapeHtml(full)}</div>` : '';
        return `<tr class="board-card-row" data-card-for="${escapeHtml(key)}"><td colspan="5">${hcpLine}${card}</td></tr>`;
    }
    // ONE delegated listener: a tap ANYWHERE ON THE ROW toggles that golfer's card
    // (v201 - it used to need the name cell, so a tap on the score, the to-par or
    // the little ▾ did nothing and the row looked broken). The row is found by
    // data-player-id, which only a golfer's row carries: the match-play table's
    // rows have none and nothing happens there. A tap inside an OPEN card
    // (.board-card-row) is not a row tap - reading the card must not close it.
    (function wireBoardCards() {
        const mount = document.getElementById('board-content');
        if (!mount || typeof mount.addEventListener !== 'function') return;
        mount.addEventListener('click', (e) => {
            let el = e.target;
            while (el && el !== mount) {
                if (el.tagName === 'TR') {
                    if (/\bboard-card-row\b/.test(el.className || '')) return;   // inside the open card
                    const id = el.getAttribute && el.getAttribute('data-player-id');
                    if (id) toggleBoardCard(id);
                    return;
                }
                el = el.parentNode;
            }
        });
    })();

    // A SECTION CARD: one group, or one flight. Ranked within the section.
    function boardSectionHtml(title, sectionResults, emptyText) {
        const maxThru = Math.max(0, ...sectionResults.map(r => r.thru));
        const sortedGroup = boardSort(sectionResults);
        let html = `<div style="margin-top:18px; border:1px solid var(--border-mid); border-radius:10px; overflow:hidden;">
                <div style="background:var(--nav-bg); padding:10px 14px; display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:bold; color:var(--brand-green);">${title}</span>
                    <span style="font-size:0.8rem; color:var(--text-muted);">${maxThru > 0 ? `Thru ${maxThru}` : 'Not started'}</span>
                </div>
                <table class="board-table" style="margin-bottom:0;">
                    <thead><tr><th>Pos</th><th style="text-align:left;">Golfer</th><th>Score</th><th>To par</th><th>Thru</th></tr></thead>
                    <tbody>`;
        if (sectionResults.length === 0 && emptyText) {
            html += `<tr><td style="padding:14px; color:var(--text-muted); text-align:center;">${emptyText}</td></tr>`;
        }
        const labels = boardPositionLabels(sectionResults);
        sortedGroup.forEach((r, idx) => {
            html += boardRowHtml(r, idx, { posStyle: 'width:30px;', indent: '                        ', label: labels[String(r.id)] });
            html += boardCardRowHtml(r.id);   // beside the row, never inside it; '' unless open
        });
        html += `</tbody></table></div>`;
        return html;
    }
    function fieldLeaderBannerHtml(results) {
        const fieldSorted = boardSort(results);
        const fieldLeader = fieldSorted.find(r => r.thru > 0);
        if (!fieldLeader) return '';
        const toParPlain = fieldLeader.toPar === 0 ? 'E' : (fieldLeader.toPar > 0 ? `+${fieldLeader.toPar}` : `${fieldLeader.toPar}`);
        // ONE LINE (v202, .h2h-fold): the same two sentences, 82px -> ~28px. It is
        // kept rather than folded away because it names the FIELD leader, which the
        // first row stops answering the moment the list is scrolled or shown by
        // group or by flight.
        return `<div class="h2h-banner h2h-fold">
                <div class="h2h-status">🏆 Leading the Field: ${escapeHtml(fieldLeader.name)}</div>
                <div class="h2h-sub">${toParPlain} thru ${fieldLeader.thru}</div>
            </div>`;
    }

    // THE BANNER IS ON EVERY VIEW (v202), this one included. On a flat board the
    // first row IS the field leader - until the list is scrolled, which on a
    // 23-golfer round happens immediately. One line, so it costs ~33px, not 82.
    function renderFlatBoard(results, container, opts) {
        const badges = !!(opts && opts.badges);
        const players = (currentBoardData && currentBoardData.players) || [];
        const flightOf = (r) => { const p = players.find(x => String(x.id) === String(r.id)); return p ? playerFlight(p) : 'A'; };
        let sorted = boardSort(results);

        let html = fieldLeaderBannerHtml(results) + `
            <table class="board-table">
                <thead><tr><th>Pos</th><th style="text-align:left;">Golfer</th><th>Score</th><th>To par</th><th>Thru</th></tr></thead>
                <tbody>
        `;
        // Field-wide labels: the rows already carry them, and asking again keeps one
        // path for every table.
        const labels = boardPositionLabels(results);
        sorted.forEach((r, idx) => {
            html += boardRowHtml(r, idx, Object.assign({ label: labels[String(r.id)] }, badges ? { badge: flightOf(r) } : {}));
            html += boardCardRowHtml(r.id);   // beside the row, never inside it; '' unless open
        });
        html += `</tbody></table>`;
        html += `<button class="btn-primary" onclick="shareResults()">📲 Text Live Link</button>`;
        container.innerHTML = html;
    }

    // BY FLIGHT: the same cards and banner as By Group, sliced by TAG, never by
    // roster position. Both flights always render - an empty flight is an empty
    // card, not a vanished one - and the card header carries the flight, so the
    // rows do not repeat it.
    function renderFlightedBoard(results, container) {
        const players = (currentBoardData && currentBoardData.players) || [];
        const tagOf = (r) => { const p = players.find(x => String(x.id) === String(r.id)); return p ? playerFlight(p) : 'A'; };
        let html = fieldLeaderBannerHtml(results);
        ['A', 'B'].forEach(f => {
            const section = results.filter(r => tagOf(r) === f);
            html += boardSectionHtml(`${f === 'A' ? '🅰' : '🅱'} Flight ${f}`, section, 'Nobody in this flight.');
        });
        html += `<button class="btn-primary" onclick="shareResults()">📲 Text Live Link</button>`;
        container.innerHTML = html;
    }
    // Club Day headline view: one card per foursome (by tee-sheet order, same grouping the
    // scorekeeper links already use) so nobody has to scroll a 28-name list to find their group.
    // Each card shows that group's own mini-leaderboard plus how far they've gotten, and a small
    // banner up top still answers "who's actually winning" across the whole field.
    function renderGroupedBoard(results, boundaries, container) {
        let html = fieldLeaderBannerHtml(results);
        boundaries.forEach(b => {
            const groupResults = results.slice(b.startIdx, b.startIdx + b.size);
            html += boardSectionHtml(`👥 Group ${b.group}`, groupResults, null);
        });
        html += `<button class="btn-primary" onclick="shareResults()">📲 Text Live Link</button>`;
        container.innerHTML = html;
    }

    function renderBoard() {
        refreshGapCounts();
        refreshSkinsCounts();   // v201: the badge's counts, from the same ledger the card below reads
        const players = currentBoardData.players || [];
        const courseData = currentBoardData.courseData || [];
        const savedScores = currentBoardData.scores || {};
        const gameFormat = currentBoardData.gameFormat || "stroke";
        const container = document.getElementById("board-content");
        // v202: the Stroke / Match switch only on a round that plays a match.
        const fmt = document.getElementById('format-toggle');
        if (fmt) fmt.style.display = boardHasMatches(currentBoardData) ? 'flex' : 'none';
        
        let matchScoringType = "net";
        if (gameFormat === 'nassau') matchScoringType = currentBoardData.nassauScoring || "net";
        if (gameFormat === 'match' || gameFormat === 'bestball') matchScoringType = currentBoardData.matchScoring || "net";

        const basisNote = document.getElementById('handicap-basis-note');
        if (basisNote) {
            const indexed = players.filter(p => p && p.handicapIndex != null && String(p.handicapIndex).trim() !== '');
            if (indexed.length && typeof handicapFacingLabel === 'function') {
                const lines = [];
                if (indexed.some(p => p.handicapUnconverted) && typeof handicapUnconvertedNote === 'function') {
                    lines.push(handicapUnconvertedNote());
                }
                indexed.forEach(p => lines.push((p.name || 'Golfer') + ' \u2014 ' + handicapFacingLabel(p)));
                basisNote.style.display = 'block';
                basisNote.textContent = lines.join('\n');
            } else {
                basisNote.style.display = 'none';
                basisNote.textContent = '';
            }
        }

        if (players.length === 0) {
            container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding: 20px;">No players active. Admin needs to set up this game.</div>`;
            return;
        }

        renderLiveMatchesBoard();
        renderLivePointsBoard();
        renderLiveHiLoBoard();
        renderLiveStrokeBetBoard();
        renderLiveSkinsBoard();

        if (activeView === "individual") {
            // LIFTED, NOT COPIED. This accumulation now lives in money-engine.js as
            // computeNetToParStandings() so the scorecard's live ticker can call the
            // very same function. Two surfaces showing the same round must not be able
            // to disagree about who is leading, and the only way to guarantee that is
            // for there to be one implementation.
            let results = computeNetToParStandings(players, courseData, savedScores,
                { basis: activeScoring === 'net' ? 'net' : 'gross' });

            const boundaries = computeGroupBoundaries(players.length, currentBoardData.groupSizeOverrides || {});
            const flightsOn = boardFlightsOn();
            const multiGroup = boundaries.length > 1;

            if (!flightsOn) {
                if (groupViewMode === 'flight') groupViewMode = 'group';
                // PART 1 (v202): a big field opens flat. Only when the golfer has
                // not chosen - groupViewChosen still wins, and still sticks for the
                // session. A single-group round has nothing to group by either way.
                if (!groupViewChosen) groupViewMode = multiGroup ? bigFieldDefault(players) : 'all';
                syncViewControl({ mode: groupViewMode, multiGroup: multiGroup, flights: false });
                if (multiGroup && groupViewMode === 'group') {
                    renderGroupedBoard(results, boundaries, container);
                } else {
                    renderFlatBoard(results, container);
                }
                return;
            }

            // FLIGHTED. By Group / By Flight / All Players - By Group only when the
            // round has more than one. A mode the round cannot show resolves to By
            // Flight; the default is By Flight until the golfer picks, EXCEPT on a
            // big field, which opens flat like any other (Part 1).
            if (!groupViewChosen || (groupViewMode === 'group' && !multiGroup)) {
                groupViewMode = (bigFieldDefault(players) === 'all' && !groupViewChosen) ? 'all' : 'flight';
            }
            syncViewControl({ mode: groupViewMode, multiGroup: multiGroup, flights: true });
            if (groupViewMode === 'group') renderGroupedBoard(results, boundaries, container);
            else if (groupViewMode === 'flight') renderFlightedBoard(results, container);
            else renderFlatBoard(results, container, { badges: true });
            return;
        }

        if (activeView === "team") {
            let teams = {};
            players.forEach(p => {
                if(!teams[p.team]) teams[p.team] = [];
                teams[p.team].push(p);
            });
            const teamKeys = Object.keys(teams);

            if (teamKeys.length < 2) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding: 20px;">Not enough teams assigned for Match Play. Assign players to Team 1, Team 2, etc. in Admin.</div>`;
                return;
            }

            let html = "";

            for (let i = 0; i < teamKeys.length; i += 2) {
                if (i + 1 >= teamKeys.length) break; 
                
                const t1Name = teamKeys[i];
                const t2Name = teamKeys[i+1];
                let totalMatch = 0;
                let thruCount = 0;
                let matchClosed = false;
                let finalResult = "";

                const t1Display = teams[t1Name].map(p => getSmartDisplayName(p, players)).join(" / ");
                const t2Display = teams[t2Name].map(p => getSmartDisplayName(p, players)).join(" / ");

                courseData.forEach((hole) => {
                    let team1BestNet = 999, team1BestGross = 999;
                    let team2BestNet = 999, team2BestGross = 999;
                    let t1Valid = false, t2Valid = false;

                    teams[t1Name].forEach(p => {
                        let v = savedScores[`p${p.id}_h${hole.hole}`];
                        if (v && v > 0) {
                            let gross = parseInt(v, 10);
                            let net = gross - getStrokes(hole.hcpIndex, parseHcp(p.hcp));
                            if (net < team1BestNet) team1BestNet = net;
                            if (gross < team1BestGross) team1BestGross = gross;
                            t1Valid = true;
                        }
                    });

                    teams[t2Name].forEach(p => {
                        let v = savedScores[`p${p.id}_h${hole.hole}`];
                        if (v && v > 0) {
                            let gross = parseInt(v, 10);
                            let net = gross - getStrokes(hole.hcpIndex, parseHcp(p.hcp));
                            if (net < team2BestNet) team2BestNet = net;
                            if (gross < team2BestGross) team2BestGross = gross;
                            t2Valid = true;
                        }
                    });

                    if (t1Valid && t2Valid) {
                        thruCount++;
                        let compare1 = matchScoringType === 'net' ? team1BestNet : team1BestGross;
                        let compare2 = matchScoringType === 'net' ? team2BestNet : team2BestGross;
                        
                        if (!matchClosed) {
                            if (compare1 < compare2) totalMatch += 1;
                            else if (compare2 < compare1) totalMatch -= 1;
                        }

                        let holesLeft = 18 - hole.hole;
                        if (!matchClosed && Math.abs(totalMatch) > holesLeft) {
                            matchClosed = true;
                            let winner = totalMatch > 0 ? t1Display : t2Display;
                            finalResult = `${winner} ${Math.abs(totalMatch)} & ${holesLeft}`;
                        }
                    }
                });

                let statusText = "";
                let t1Badge = `<span class="status-badge badge-even">AS</span>`;
                let t2Badge = `<span class="status-badge badge-even">AS</span>`;

                if (thruCount === 0) {
                    statusText = "ALL SQUARE";
                    t1Badge = `<span style="color:var(--text-muted);">-</span>`;
                    t2Badge = `<span style="color:var(--text-muted);">-</span>`;
                } else if (matchClosed) {
                    statusText = `🏁 FINAL: ${finalResult}`;
                    if (totalMatch > 0) {
                        t1Badge = `<span class="status-badge badge-up">WIN</span>`;
                        t2Badge = `<span class="status-badge badge-down">LOSS</span>`;
                    } else {
                        t1Badge = `<span class="status-badge badge-down">LOSS</span>`;
                        t2Badge = `<span class="status-badge badge-up">WIN</span>`;
                    }
                } else if (totalMatch === 0) {
                    statusText = "ALL SQUARE";
                } else if (totalMatch > 0) {
                    statusText = `🟢 ${t1Display} IS ${totalMatch} UP`;
                    t1Badge = `<span class="status-badge badge-up">${totalMatch}UP</span>`;
                    t2Badge = `<span class="status-badge badge-down">${totalMatch}DN</span>`;
                } else {
                    statusText = `🟢 ${t2Display} IS ${Math.abs(totalMatch)} UP`;
                    t1Badge = `<span class="status-badge badge-down">${Math.abs(totalMatch)}DN</span>`;
                    t2Badge = `<span class="status-badge badge-up">${Math.abs(totalMatch)}UP</span>`;
                }

                html += `
                    <div class="h2h-banner" style="margin-top: 20px;">
                        <div class="h2h-status">${statusText}</div>
                        <div class="h2h-sub">Thru ${thruCount}</div>
                    </div>
                    <table class="board-table">
                        <thead><tr><th style="text-align:left;">Matchup</th><th>Status</th><th>Thru</th></tr></thead>
                        <tbody>
                            <tr>
                                <td class="player-name">${t1Display}</td>
                                <td>${t1Badge}</td><td>${thruCount}</td>
                            </tr>
                            <tr>
                                <td class="player-name">${t2Display}</td>
                                <td>${t2Badge}</td><td>${thruCount}</td>
                            </tr>
                        </tbody>
                    </table>
                `;
            }
            html += `<button class="btn-primary" onclick="shareResults()">📲 Text Live Link</button>`;
            container.innerHTML = html;
        }
    }

</script>

</body>
</html>
