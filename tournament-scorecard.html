<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tournament Scorecard</title>
    <!-- THE HOME-SCREEN ICON WHEN A GOLFER ADDS THIS TO THEIR HOME SCREEN.
         iOS does not read the web manifest for the icon; without this tag it
         takes a SCREENSHOT OF THE PAGE and uses that. Every page in this repo
         was in that state until wave 19. 180x180 is the size iOS asks for at
         @3x, and the file is the one the manifest icons are derived from, so
         the home screen and the installed PWA cannot show two different marks. -->
    <link rel="apple-touch-icon" href="tournament-icon-180.png">
    <!-- THE INSTALL IDENTITY OF THIS PRODUCT, and deliberately NOT manifest.json.
         The live deployment is still the combined repo root, where manifest.json
         is the OTHER product - a different name and a start_url pointing at its
         home screen, measured on the deployed site. Linking that name here would
         offer the wrong app to anyone who installed from a tournament page. This
         file resolves to the Tournament identity in BOTH the combined root and
         dist/tournament.
         The other product is not named in this comment on purpose:
         rattle_identity_test.js asserts these pages carry none of its branding,
         and that guard is worth more absolute than a comment is worth precise. -->
    <link rel="manifest" href="tournament-manifest.json">
    <script src="./firebase-app-compat.js"></script>
    <script src="./firebase-database-compat.js"></script>
    <!-- Place and tie payout allocation, shared with Trip Mode. -->
    <!-- Handicap. Individual Net stroke play allocates strokes by the hole's stroke
         index through the shared primitives; tournament-engine.js calls them as
         globals, so this must load first. Already in SHARED_SHELL, so it was already
         shipping to this deployment - only the tag was missing. -->
    <script src="handicap.js"></script>
    <script src="payouts.js"></script>
    <script src="tournament-engine.js"></script>
    <style>
        :root {
            --bg-page: #f4f6f8;
            --bg-card: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666;
            --brand-green: #0f4c3a;
            --brand-navy: #1d3557;
            --accent-teal: #2a9d8f;
            --accent-red: #e63946;
            --border-light: #e0e0e0;
            --border-mid: #d0e1db;
            --border-faint: #eee;
            --nav-bg: #f0f4f2;
            --shadow-color: rgba(0,0,0,0.08);
            --nassau-box-bg: #eef6f2;
        }
        html.dark-mode {
            --bg-page: #14181a;
            --bg-card: #1e2426;
            --text-main: #e8ecec;
            --text-muted: #9aa8a7;
            --brand-green: #2f9e78;
            --brand-navy: #4a7bb5;
            --accent-teal: #3dbfae;
            --accent-red: #ff6b76;
            --border-light: #333c3e;
            --border-mid: #3a4a45;
            --border-faint: #2c3436;
            --nav-bg: #223028;
            --shadow-color: rgba(0,0,0,0.4);
            --nassau-box-bg: #1a2b24;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-page); margin: 0; padding: 12px 12px 40px 12px; color: var(--text-main); -webkit-text-size-adjust: 100%; transition: background-color 0.2s ease, color 0.2s ease; }
        .container { max-width: 700px; margin: 0 auto; background: var(--bg-card); border-radius: 12px; box-shadow: 0 4px 12px var(--shadow-color); padding: 20px; }
        h2 { color: var(--brand-green); margin-top: 0; }
        .theme-toggle-btn { background: var(--nav-bg); color: var(--brand-green); border: 1px solid var(--border-mid); border-radius: 16px; font-size: 0.75rem; font-weight: bold; padding: 6px 12px; cursor: pointer; white-space: nowrap; display: block; margin: 0 auto 16px auto; }
        .top-nav-bar { display: flex; gap: 6px; margin-bottom: 14px; }
        .top-nav-item { flex: 1; padding: 10px; text-align: center; background: var(--nav-bg); color: var(--brand-green); border: 1px solid var(--border-mid); border-radius: 20px; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
        .top-nav-item.active { background: var(--brand-green); color: #ffffff; border-color: var(--brand-green); }

        .event-title { text-align: center; font-size: 1.3rem; font-weight: bold; color: var(--brand-green); margin-bottom: 2px; }
        .event-sub { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 4px; }
        .scoring-for-label { text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
        .scoring-for-label strong { color: var(--brand-green); }
        .save-state { min-height: 18px; text-align: center; font-size: 0.78rem; color: var(--text-muted); margin: 6px 0 10px 0; transition: opacity 0.2s; }
        .save-state.saving { color: var(--text-muted); }
        .save-state.saved { color: var(--brand-green); font-weight: bold; }
        .save-state.error { color: var(--accent-red); font-weight: bold; }
        .team-roster-box { background: var(--nassau-box-bg); border-radius: 8px; padding: 10px 14px; text-align: center; margin-bottom: 14px; font-size: 0.9rem; font-weight: bold; color: var(--brand-navy); }

        .status-bar { background: var(--brand-navy); color: white; border-radius: 10px; padding: 12px; text-align: center; margin-bottom: 16px; }
        .status-bar .status-main { font-size: 1.1rem; font-weight: bold; }
        .status-bar .status-sub { font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }

        .hole-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid var(--border-faint); }
        .hole-info { display: flex; flex-direction: column; }
        .hole-num { font-weight: bold; font-size: 1.1rem; }
        .hole-par { font-size: 0.75rem; color: var(--text-muted); }
        .hole-score-input { width: 64px; height: 48px; text-align: center; font-size: 1.3rem; font-weight: bold; border: 2px solid var(--border-mid); border-radius: 8px; background: var(--bg-card); color: var(--text-main); }
        /* Reserved width, never conditional: an empty slot keeps the score boxes
           in a row lined up whether or not that golfer strokes on the hole. */
        .stroke-dots { color: var(--accent-teal); font-weight: bold; font-size: 1rem;
            letter-spacing: 1px; min-width: 14px; line-height: 1; }
        .hole-score-input:focus { border-color: var(--brand-green); outline: none; }

        .hole-row-multi { padding: 12px 4px; border-bottom: 1px solid var(--border-faint); }
        .hole-row-multi .hole-info-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
        .hole-row-multi .hole-num { font-weight: bold; font-size: 1.05rem; }
        .hole-row-multi .hole-par { font-size: 0.75rem; color: var(--text-muted); }
        .hole-row-multi .team-hole-result { font-size: 0.78rem; font-weight: bold; color: var(--brand-green); }
        .player-score-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .player-score-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .player-score-cell .player-score-label { font-size: 0.68rem; color: var(--text-muted); font-weight: bold; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .hole-score-input-sm { width: 48px; height: 40px; text-align: center; font-size: 1.05rem; font-weight: bold; border: 2px solid var(--border-mid); border-radius: 6px; background: var(--bg-card); color: var(--text-main); }
        .hole-score-input-sm:focus { border-color: var(--brand-green); outline: none; }

        .lb-row { display: flex; align-items: center; padding: 10px 6px; border-bottom: 1px solid var(--border-faint); font-size: 0.9rem; }
        .lb-pos { width: 28px; font-weight: bold; color: var(--text-muted); }
        .lb-team { flex: 1; font-weight: bold; }
        .lb-thru { width: 56px; text-align: center; color: var(--text-muted); font-size: 0.78rem; }
        .lb-score { width: 60px; text-align: right; font-weight: bold; }
        .lb-row.leader { background: #fff8e1; }
        html.dark-mode .lb-row.leader { background: #2b2712; }
        .lb-row.me { border: 2px solid var(--brand-green); border-radius: 6px; }
    </style>
</head>
<body>

<div class="container" id="main-content" style="display:none;">
    <button class="theme-toggle-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
    <div class="top-nav-bar">
        <span class="top-nav-item active" id="tab-btn-scorecard" onclick="showTab('scorecard')">📝 Scorecard</span>
        <span class="top-nav-item" id="tab-btn-leaderboard" onclick="showTab('leaderboard')">🏆 Leaderboard</span>
    </div>

    <div class="event-title" id="event-title"></div>
    <div class="event-sub" id="event-sub"></div>
    <div id="starting-hole-banner" style="display:none; text-align:center; background:var(--nassau-box-bg); border:2px solid var(--accent-teal); border-radius:10px; padding:10px; margin-bottom:14px; font-weight:bold; color:var(--brand-green); font-size:1.05rem;"></div>

    <div id="tab-scorecard">
        <!-- WHO AM I SCORING FOR. A golfer arrives here from a text message with no
             app installed and no context beyond the link, so the page has to answer
             that before anything else. The wording says "scoring group" alongside the
             stored team name because on a shamble or best-ball the four names are a
             group of individuals, not a side - but the STORAGE is untouched: every key
             is still team{n}_… and every field still comes from teams.team{n}. -->
        <div class="scoring-for-label" id="scoring-for"></div>
        <div class="team-roster-box" id="team-roster"></div>
        <div class="status-bar">
            <div class="status-main" id="status-main">Thru 0</div>
            <div class="status-sub" id="status-sub"></div>
        </div>
        <!-- SAVE STATE. Scores were written fire-and-forget with no confirmation, so a
             golfer on a thin signal had no way to tell a saved hole from a lost one.
             One quiet line that settles back to idle, rather than a toast per keystroke -
             rapid entry must stay uninterrupted. -->
        <div class="save-state" id="save-state" aria-live="polite"></div>
        <div id="holes-list"></div>
    </div>

    <div id="tab-leaderboard" style="display:none;">
        <div id="leaderboard-list"></div>
    </div>
</div>

<div class="container" id="error-content" style="display:none; text-align:center;">
    <h2>⚠️ Link Not Found</h2>
    <!-- A GOLFER CANNOT FIX THIS THEMSELVES. The only useful action is going back to
         whoever sent the link, so the message says which half of it did not work
         rather than offering a retry that cannot succeed. Deliberately no route into
         the organizer screens from here - this surface is for scoring, nothing else. -->
    <p style="color:var(--text-muted);" id="error-detail">This tournament scorecard link looks invalid or the tournament code doesn't match. Double check the link your organizer sent you.</p>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyB5sBBd-pdnrdp-nu60lHTMBUUd5Kwjfyk",
      authDomain: "golfapp-9fb21.firebaseapp.com",
      databaseURL: "https://golfapp-9fb21-default-rtdb.firebaseio.com",
      projectId: "golfapp-9fb21",
      storageBucket: "golfapp-9fb21.firebasestorage.app",
      messagingSenderId: "761739328763",
      appId: "1:761739328763:web:08ac41351578565c94045e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark-mode');
        localStorage.setItem('golfapp-theme', isDark ? 'dark' : 'light');
        document.querySelectorAll('.theme-toggle-btn').forEach(btn => {
            btn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
        });
    }
    if (localStorage.getItem('golfapp-theme') === 'dark') {
        document.documentElement.classList.add('dark-mode');
    }
    document.addEventListener('DOMContentLoaded', () => {
        if (document.documentElement.classList.contains('dark-mode')) {
            document.querySelectorAll('.theme-toggle-btn').forEach(btn => { btn.textContent = '☀️ Light Mode'; });
        }
    });

    function showTab(tab) {
        document.getElementById('tab-scorecard').style.display = tab === 'scorecard' ? 'block' : 'none';
        document.getElementById('tab-leaderboard').style.display = tab === 'leaderboard' ? 'block' : 'none';
        document.getElementById('tab-btn-scorecard').classList.toggle('active', tab === 'scorecard');
        document.getElementById('tab-btn-leaderboard').classList.toggle('active', tab === 'leaderboard');
        if (tab === 'leaderboard') renderLeaderboard();
    }

    // ONE SCORING SURFACE, TWO SCOPES.
    //
    // ?team=N   a legacy team event. Untouched, forever - organizers have already
    //           texted these links out and they must keep working exactly as they do.
    // ?group=G  an individual event. The link identifies a SCORING GROUP - who is
    //           physically playing together - and the golfer enters a gross score for
    //           each person in it. Net is never entered; it is derived.
    //
    // Forking a second scorecard page would have meant two surfaces drifting apart on
    // offline behaviour, theming and error states, so the page branches instead.
    const urlParams = new URLSearchParams(window.location.search);
    let currentCode = urlParams.get('tourney') ? urlParams.get('tourney').toUpperCase() : null;
    let myTeamNum = urlParams.get('team') ? parseInt(urlParams.get('team'), 10) : null;
    let myGroupId = urlParams.get('group') || null;
    // ?round=R identifies WHICH round a group link is for. Saturday's link and
    // Sunday's link carry the same group id, so without this a golfer who scrolled
    // back to yesterday's message would post today's scores into yesterday's round -
    // silently, because everything else about the two links is identical.
    let myRoundId = urlParams.get('round') || null;
    let currentData = {};
    let hasAutoScrolled = false; // guards the shotgun starting-hole auto-scroll to fire once per page load

    if (!currentCode || (!myTeamNum && !myGroupId)) {
        document.getElementById('error-detail').textContent = !currentCode
            ? "This link is missing its tournament code. Ask your organizer to send the scoring link again."
            : "This link is missing its group, so we don't know which scorecard to open. Ask your organizer to send the scoring link again.";
        document.getElementById('error-content').style.display = 'block';
    } else {
        db.ref(`tournaments/${currentCode}`).on('value', (snap) => {
            currentData = snap.val();
            // ONE SEAM, THE SAME ONE THE ENGINE USES. roundView() hands back something
            // shaped like a single-round record, so everything below is unchanged and
            // there is no `if (rounds)` in the rendering.
            const multi = isMultiRound(currentData);
            if (multi && !myRoundId) {
                document.getElementById('error-detail').textContent =
                    "This event has more than one round, and this link doesn't say which one. Ask your organizer for the link for today's round.";
                document.getElementById('error-content').style.display = 'block';
                document.getElementById('main-content').style.display = 'none';
                return;
            }
            const view = multi ? roundView(currentData, myRoundId) : currentData;
            if (multi && !view) {
                document.getElementById('error-detail').textContent =
                    "That round is no longer part of this event. Ask your organizer for the current scoring link.";
                document.getElementById('error-content').style.display = 'block';
                document.getElementById('main-content').style.display = 'none';
                return;
            }
            // A ROUND THAT IS NOT OPEN DOES NOT TAKE SCORES. Setup means the organizer
            // is still building it; closed means the result is final. Either way a
            // golfer typing into it would be entering strokes nobody will count, so
            // the card is shown read-only rather than pretending to save.
            const status = multi ? view.roundStatus : 'open';
            const group = myGroupId ? (view && view.scoringGroups || {})[myGroupId] : null;
            const teamOk = myTeamNum && view && view.teams && view.teams[`team${myTeamNum}`];
            if (!currentData || (!teamOk && !group)) {
                document.getElementById('error-detail').textContent = !currentData
                    ? `No tournament found with the code ${currentCode}. Ask your organizer to check the link.`
                    : (myGroupId
                        ? `That tournament exists, but it has no group matching this link. Ask your organizer for your own scoring link.`
                        : `That tournament exists, but it has no group ${myTeamNum}. Ask your organizer for your own scoring link.`);
                document.getElementById('error-content').style.display = 'block';
                document.getElementById('main-content').style.display = 'none';
                return;
            }
            document.getElementById('main-content').style.display = 'block';
            roundScope = view;   // for a single-round record this IS currentData
            roundLocked = (status !== 'open');
            if (group) renderGroup(group); else renderAll();
        });
    }

    // computeTeamHoleScore and computeTournamentLeaderboard now live in tournament-engine.js
    // so this page and the organizer's tournament.html always agree on totals and standings.

    function renderLeaderboard() {
        const container = document.getElementById('leaderboard-list');
        // THE ROUND THIS LINK IS FOR. Reading the event root showed this golfer
        // a full field with every score blank - including the fifty-four they
        // had just entered on the card one tab away. Same resolution the
        // organizer's board and printed sheet use.
        const view = resolveLeaderboardView(currentData, myRoundId);
        const rows = view.rows;
        if (!view.available) {
            container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:20px;">${view.reason}</div>`;
            return;
        }

        const rankCounts = {};
        rows.forEach(r => { if (r.rank) rankCounts[r.rank] = (rankCounts[r.rank] || 0) + 1; });

        let html = `<div class="lb-row" style="font-weight:bold; color:var(--text-muted); font-size:0.75rem; text-transform:uppercase;">
            <span class="lb-pos">Pos</span><span class="lb-team">${entryColumnLabel(currentData)}</span><span class="lb-thru">Thru</span><span class="lb-score">To Par</span>
        </div>`;
        rows.forEach(r => {
            const toParStr = !r.hasScores ? '—' : (r.toPar === 0 ? 'E' : (r.toPar > 0 ? `+${r.toPar}` : r.toPar));
            const isMe = r.num === myTeamNum;
            const tieTag = (r.rank && rankCounts[r.rank] > 1) ? '<span style="font-size:0.68rem; color:var(--text-muted); font-weight:normal;"> (tied)</span>' : '';
            html += `<div class="lb-row ${r.rank === 1 ? 'leader' : ''} ${isMe ? 'me' : ''}">
                <span class="lb-pos">${r.rank || '-'}</span>
                <span class="lb-team">${r.teamName}${tieTag} ${isMe ? '<span style="font-weight:normal; color:var(--brand-green); font-size:0.78rem;">(You)</span>' : ''}</span>
                <span class="lb-thru">${r.hasScores ? r.thru : '-'}</span>
                <span class="lb-score">${toParStr}</span>
            </div>`;
        });
        container.innerHTML = html;
    }

    // ONE LINE, NOT A TOAST PER KEYSTROKE.
    //
    // A golfer entering four holes in a row should not be fighting notifications, so
    // "Saved" fades back to nothing and a newer write always supersedes an older
    // message. An ERROR does not fade - a score that did not reach the database is
    // the one thing worth leaving on screen until the next successful write.
    let saveStateToken = 0;
    function setSaveState(state, text) {
        const el = document.getElementById('save-state');
        if (!el) return;
        const token = ++saveStateToken;
        el.className = 'save-state ' + state;
        el.textContent = text;
        if (state === 'saved') {
            setTimeout(() => {
                if (token === saveStateToken && el.className === 'save-state saved') {
                    el.textContent = '';
                }
            }, 2000);
        }
    }

    // The Firebase paths below are UNCHANGED - team{n}_h{h} and team{n}_p{i}_h{h},
    // scoped to the team number this link carries. The promise is only observed so the
    // golfer learns whether the write landed.
    function trackWrite(promise) {
        setSaveState('saving', 'Saving…');
        return promise
            .then(() => setSaveState('saved', '✓ Saved'))
            .catch(() => setSaveState('error', '⚠️ Could not save — check your signal and re-enter that hole'));
    }

    // THE TWO TEAM WRITERS ASK THE SAME TWO QUESTIONS THE INDIVIDUAL ONE DOES:
    // which round am I in, and is it open. They did neither until now, and the
    // pair of them is one defect wearing two hats - renderAll picks which by
    // format, scramble getting the team box and every other team format getting
    // a box per player, so a fix to one alone repairs half of it.
    //
    // Measured before: a SETUP round accepted a team score and wrote it, so did a
    // CLOSED one, and Day 1 and Day 2 of the same event both wrote
    // tournaments/<code>/scores/team1_h1 - the second day overwriting the first
    // in storage as it was played.
    function saveHoleScore(holeNum, val) {
        if (roundLocked) return;
        const ref = db.ref(scorePath(`team${myTeamNum}_h${holeNum}`));
        trackWrite((val === '' || val === null) ? ref.remove() : ref.set(parseInt(val, 10)));
    }

    function savePlayerHoleScore(holeNum, playerIdx, val) {
        if (roundLocked) return;
        const path = scorePath(`team${myTeamNum}_p${playerIdx}_h${holeNum}`);
        const ref = db.ref(path);
        trackWrite((val === '' || val === null) ? ref.remove() : ref.set(parseInt(val, 10)));
    }

    // A GOLFER'S SCORE IS WRITTEN UNDER THEIR ID. Not their position in the group,
    // not their name - so moving somebody to another group, or fixing the spelling of
    // their name, cannot move a single stroke. Scoped to this group's own players:
    // the id is checked against the group before anything is written.
    // The round view this card is scoring, and whether it accepts writes.
    let roundScope = null;
    let roundLocked = false;

    function scorePath(suffix) {
        // Round identity lives in the PATH, not in the key - so the score key shape is
        // the one already in production and a cross-round write is structurally
        // impossible rather than merely validated against.
        return myRoundId
            ? `tournaments/${currentCode}/rounds/${myRoundId}/scores/${suffix}`
            : `tournaments/${currentCode}/scores/${suffix}`;
    }

    function saveIndividualScore(playerId, holeNum, val) {
        if (roundLocked) return;
        const scope = roundScope || currentData;
        const group = (scope.scoringGroups || {})[myGroupId] || {};
        if ((group.playerIds || []).indexOf(playerId) === -1) return;   // not this group's golfer
        const ref = db.ref(scorePath(`${playerId}_h${holeNum}`));
        trackWrite((val === '' || val === null) ? ref.remove() : ref.set(parseInt(val, 10)));
    }

    // THE HOLE YOU ARE TYPING IS NEVER TOUCHED.
    //
    // One listener sits on tournaments/<CODE>, so every score any group posts
    // re-fires this page's callback. Rebuilding #holes-list from a string on
    // every one of those threw away the digit under the golfer's thumb - it is
    // not saved until onchange fires on blur - dropped focus, and closed the
    // keyboard. Measured: 72 of 72 inputs replaced by one unrelated write, 360
    // times a minute at 25 groups. tools/tournament-focus-check.js is that
    // measurement and Test 8 is what holds this in place.
    //
    // A SCORE CHANGE IS NOT A SHAPE CHANGE. Almost every snapshot differs from
    // the last one only in numbers, and numbers can be written into the inputs
    // that are already on screen. The card is rebuilt only when the card is
    // genuinely different - a golfer joined the group, the round opened or
    // closed, the format or the course changed - which is the list in the
    // audit's R3.
    //
    // THE SHAPE IS DERIVED FROM THE HTML THE RENDERER JUST BUILT, not from a
    // hand-kept list of fields to watch. A field nobody remembered to add to
    // such a list is a card that silently stops updating; here, anything that
    // changes the markup changes the key. Only the two genuinely volatile
    // parts are stripped out of it, and the same two are what the in-place
    // path writes - one definition, so they cannot drift apart.
    //
    // shapeSalt carries what affects the inputs WITHOUT appearing in the html.
    // roundLocked is the only one: it is applied by the caller as a disabled
    // sweep after this returns, so a round reopening has to force a rebuild or
    // the inputs would stay disabled for good.
    const HOLE_VALUE_ATTR = /value="[^"]*"/g;
    const HOLE_TEAM_RESULT = /(<span class="team-hole-result">)[^<]*(<\/span>)/g;
    let lastHolesShape = null;

    function holesShapeKey(html, shapeSalt) {
        return String(shapeSalt || '') + '|'
            + html.replace(HOLE_VALUE_ATTR, 'value=""')
                  .replace(HOLE_TEAM_RESULT, '$1$2');
    }

    function setHolesListPreservingFocus(html, shapeSalt) {
        const list = document.getElementById('holes-list');
        if (!list) return;
        const keyOf = el => el.getAttribute('onchange') || '';
        const shape = holesShapeKey(html, shapeSalt);

        // The browser's own parser on the same string, so the new values are
        // read exactly as they would have rendered - no regex over markup.
        const tpl = document.createElement('template');
        tpl.innerHTML = html;
        const freshInputs = tpl.content.querySelectorAll('input');
        const liveInputs = list.querySelectorAll('input');

        if (shape === lastHolesShape && liveInputs.length === freshInputs.length) {
            const values = new Map();
            freshInputs.forEach(el => values.set(keyOf(el), el.getAttribute('value') || ''));
            const results = new Map();
            tpl.content.querySelectorAll('[id^="hole-row-"]').forEach(row => {
                const r = row.querySelector('.team-hole-result');
                if (r) results.set(row.id, r.textContent);
            });
            const active = document.activeElement;
            liveInputs.forEach(el => {
                // THE ONE THE GOLFER IS IN IS LEFT ALONE. Their half-typed
                // stroke outranks a stored number they are in the middle of
                // replacing.
                if (el === active) return;
                const v = values.get(keyOf(el));
                if (v !== undefined && el.value !== v) el.value = v;
            });
            results.forEach((text, rowId) => {
                const r = list.querySelector('#' + rowId + ' .team-hole-result');
                if (r && r.textContent !== text) r.textContent = text;
            });
            return;
        }

        // THE CARD IS GENUINELY DIFFERENT. Rebuild it - and still put the
        // golfer's own node back, because a roster change three groups away
        // should not cost them the hole they are writing down.
        const active = document.activeElement;
        const keep = (active && active.tagName === 'INPUT' && list.contains(active))
            ? active : null;
        const keepKey = keep ? keyOf(keep) : null;

        list.innerHTML = html;
        lastHolesShape = shape;

        if (!keep || !keepKey) return;
        const fresh = Array.from(list.querySelectorAll('input'))
            .find(el => keyOf(el) === keepKey);
        if (!fresh || !fresh.parentNode) return;   // that cell is gone - leave it
        fresh.parentNode.replaceChild(keep, fresh);
        keep.focus();
    }

    function renderGroup(group) {
        // THE ROUND VIEW, NOT THE EVENT. Shadowing the outer currentData here is
        // deliberate: everything below reads course, format, scoring mode, groups and
        // scores, and in a multi-round event every one of those belongs to the round.
        // A single-round record passes itself through roundScope, so this reads the
        // same object it always did.
        const currentData = roundScope || window.currentData;
        const players = currentData.players || {};
        const ids = (group.playerIds || []).filter(pid => players[pid]);
        const courseData = (currentData.courseData || []).slice().sort((a, b) => a.hole - b.hole);
        const scores = currentData.scores || {};
        // THE SAME QUESTION THE SCORING ASKS. Reading scoringMode alone made
        // this card say "Net" over a gross board on a course whose stroke index
        // is fabricated - the engine refuses net there and is right to.
        // netIsInPlay/netWasRefused live in tournament-engine.js beside the
        // refusal itself, so the word and the arithmetic cannot disagree.
        const netMode = netIsInPlay(currentData);
        const netRefused = netWasRefused(currentData);

        document.getElementById('event-title').textContent = `🏆 ${currentData.name}`;
        document.getElementById('event-sub').textContent =
            `${currentData.courseName} • Individual Stroke Play • ${netMode ? 'Net' : 'Gross'}`;
        document.getElementById('scoring-for').innerHTML =
            `You're scoring for <strong>${group.name || 'your group'}</strong>`;
        // Handicaps are shown because net is derived from them - a golfer needs to see
        // WHY their net differs from their gross without the page explaining allocation.
        //
        // `handicap || 0` PRINTED "(0)" FOR A SLOT NOBODY HAS NUMBERED. Wave 17
        // took that lie off the organizer's board and left it here, on the one
        // surface a golfer actually holds during the round. handicapDisplay is
        // the same rule the board uses and says the same words - the phrase is a
        // constant in the engine, not a sentence re-typed on this page - and a
        // genuine scratch golfer still reads "(0)".
        //
        // competitorDisplayName for the same reason the board uses it: an
        // unnamed slot's name is an empty string, and printing it left a bare
        // "(handicap pending)" floating in the roster with nobody attached to it.
        document.getElementById('team-roster').innerHTML = ids.map(pid =>
            `${competitorDisplayName(players[pid])}${netMode ? ` <span style="font-weight:normal; color:var(--text-muted);">(${handicapDisplay(players[pid])})</span>` : ''}`
        ).join(' &nbsp;•&nbsp; ') || 'No golfers assigned yet';

        if (group.startingHole) {
            const banner = document.getElementById('starting-hole-banner');
            banner.style.display = 'block';
            banner.textContent = `🚀 Start on hole ${group.startingHole}`;
        }

        let html = '';
        const thruCount = {};
        courseData.forEach(h => {
            html += `<div class="hole-row" id="hole-row-${h.hole}" style="flex-wrap:wrap;">
                <div class="hole-info">
                    <span class="hole-num">Hole ${h.hole}</span>
                    <span class="hole-par">Par ${h.par}</span>
                </div>
                <div style="flex-basis:100%; display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;">` +
                ids.map(pid => {
                    const v = scores[`${pid}_h${h.hole}`];
                    if (v && v > 0) thruCount[pid] = (thruCount[pid] || 0) + 1;
                    const first = (players[pid].name || '').split(' ')[0];
                    // WHERE THIS GOLFER GETS A SHOT. The card showed a handicap in
                    // the roster and never said which holes it fell on, which is
                    // the one thing a number like 18 does not tell you.
                    //
                    // The allocation is NOT recomputed here: playerStrokesOnHole
                    // is the accessor the scoring itself uses, so the dots and the
                    // net total cannot disagree. And netMode is netIsInPlay(),
                    // already resolved above - so a gross round draws nothing, and
                    // so does a net round on a fabricated stroke index, where the
                    // engine refuses net and this card already says Gross.
                    //
                    // The span is emitted EVEN WHEN EMPTY. A slot that appears
                    // only for golfers who stroke would move every other score box
                    // in the row the moment somebody's handicap changed.
                    const strokes = netMode ? playerStrokesOnHole(players[pid], h) : 0;
                    const dots = strokes > 0 ? '\u2022'.repeat(strokes)
                        : (strokes < 0 ? '+' : '');
                    return `<label style="display:flex; align-items:center; gap:4px; font-size:0.8rem;">
                        <span style="color:var(--text-muted);">${first}</span>
                        <span class="stroke-dots" aria-hidden="true">${dots}</span>
                        <input type="number" class="hole-score-input" inputmode="numeric" min="1" style="width:52px;"
                            value="${v || ''}" onchange="saveIndividualScore('${pid}', ${h.hole}, this.value)">
                    </label>`;
                }).join('') + `</div></div>`;
        });
        setHolesListPreservingFocus(html, 'locked:' + roundLocked);

        const played = Math.max(0, ...ids.map(pid => thruCount[pid] || 0));
        document.getElementById('status-main').textContent = `Thru ${played}`;
        document.getElementById('status-sub').textContent = roundLocked
            ? (currentData.roundStatus === 'closed'
                ? 'This round is closed — scores are final'
                : 'This round is not open for scoring yet')
            : (netMode ? 'Enter gross scores — net is worked out for you'
                : netRefused
                    // The same sentence the organizer's round editor shows, so a
                    // golfer asking why their net vanished gets the same answer.
                    ? 'Enter gross scores — this course has no real stroke index, so net '
                      + "can't be allocated and this round is scored Gross"
                    : 'Enter gross scores');
        if (roundLocked) {
            document.querySelectorAll('#holes-list input').forEach(i => { i.disabled = true; });
        }
        if (currentData.roundName) {
            document.getElementById('event-sub').textContent =
                `${currentData.courseName} • ${currentData.roundName} • Individual Stroke Play • ${netMode ? 'Net' : 'Gross'}`;
        }
    }

    function renderAll() {
        // THE READ MOVES WITH THE WRITE, NOT AFTER IT.
        // Without this line the team writers above now save into
        // rounds/<rid>/scores while this renderer keeps reading the event root,
        // so every box would blank the instant a score saved. Measured on a
        // multi-round card: 18 team scores at rounds/r1/scores rendered 0 of 18
        // filled boxes, and the same scores at the root rendered 18 of 18.
        //
        // renderGroup:485 has resolved its data this way for a while, and
        // renderLeaderboard resolves through resolveLeaderboardView. renderAll
        // was the one site left reading the root on both sides - which is exactly
        // why the team path looked correct: root in, root out. :283 records this
        // same failure biting once already on the leaderboard tab.
        //
        // A single-round record passes itself through roundScope, so this reads
        // the event exactly as it did before.
        const currentData = roundScope || window.currentData;
        const team = currentData.teams[`team${myTeamNum}`];
        const courseData = (currentData.courseData || []).slice().sort((a, b) => a.hole - b.hole);
        const scores = currentData.scores || {};
        const format = currentData.format || 'scramble';
        const shambleCountBest = currentData.shambleCountBest || 1;

        document.getElementById('event-title').textContent = `🏆 ${currentData.name}`;
        document.getElementById('event-sub').textContent = `${currentData.courseName} • ${formatLabelFor(currentData.format)}`;
        const teamName = team.name || `Team ${team.num}`;
        document.getElementById('scoring-for').innerHTML =
            `You're scoring for <strong>${teamName}</strong>`;
        document.getElementById('team-roster').innerHTML = `${teamName}<br><span style="font-weight:normal; font-size:0.78rem; color:var(--text-muted);">${team.players.join(', ')}</span>`;

        let thru = 0, total = 0, parPlayed = 0;
        let html = '';

        if (format === 'scramble') {
            courseData.forEach(h => {
                const key = `team${myTeamNum}_h${h.hole}`;
                const v = scores[key];
                if (v && v > 0) { thru++; total += parseInt(v, 10); parPlayed += h.par; }
                html += `<div class="hole-row" id="hole-row-${h.hole}">
                    <div class="hole-info">
                        <span class="hole-num">Hole ${h.hole}</span>
                        <span class="hole-par">Par ${h.par}</span>
                    </div>
                    <input type="number" class="hole-score-input" inputmode="numeric" min="1"
                        value="${v || ''}"
                        onchange="saveHoleScore(${h.hole}, this.value)">
                </div>`;
            });
        } else {
            courseData.forEach(h => {
                const holeScores = [];
                let playerCellsHtml = '';
                team.players.forEach((p, pIdx) => {
                    const key = `team${myTeamNum}_p${pIdx}_h${h.hole}`;
                    const v = scores[key];
                    if (v && v > 0) holeScores.push(parseInt(v, 10));
                    playerCellsHtml += `<div class="player-score-cell">
                        <span class="player-score-label">${p.split(' ')[0]}</span>
                        <input type="number" class="hole-score-input-sm" inputmode="numeric" min="1"
                            value="${v || ''}"
                            onchange="savePlayerHoleScore(${h.hole}, ${pIdx}, this.value)">
                    </div>`;
                });

                const teamHoleScore = computeTeamHoleScore(format, holeScores, shambleCountBest);
                if (teamHoleScore !== null) { thru++; total += teamHoleScore; parPlayed += h.par; }
                const resultText = teamHoleScore === null ? '' : `Team: ${teamHoleScore}`;

                html += `<div class="hole-row-multi" id="hole-row-${h.hole}">
                    <div class="hole-info-row">
                        <span><span class="hole-num">Hole ${h.hole}</span> <span class="hole-par">Par ${h.par}</span></span>
                        <span class="team-hole-result">${resultText}</span>
                    </div>
                    <div class="player-score-grid">${playerCellsHtml}</div>
                </div>`;
            });
        }

        // THE SALT IS NOT DECORATION. setHolesListPreservingFocus patches values
        // in place when the shape key matches, and `disabled` is applied
        // imperatively below rather than in the markup - so without roundLocked
        // in the key, a round the organizer REOPENS would keep its boxes disabled
        // with nothing to re-enable them. renderGroup:564 salts it for the same
        // reason.
        setHolesListPreservingFocus(html, 'locked:' + roundLocked);

        // Starting hole is purely a display/navigation aid — the scored hole is always the
        // real golf hole (hole 8 is still hole 8, stored the same way regardless of when it
        // was entered). Auto-scroll only fires once per page load, not on every score-driven
        // re-render, so a teammate entering a score elsewhere doesn't yank the view back.
        const startBanner = document.getElementById('starting-hole-banner');
        if (team.startingHole) {
            startBanner.style.display = 'block';
            startBanner.textContent = `🚀 Starting Hole: ${team.startingHole}`;
            if (!hasAutoScrolled) {
                hasAutoScrolled = true;
                const startHoleNum = parseInt(team.startingHole, 10);
                const targetRow = document.getElementById(`hole-row-${startHoleNum}`);
                if (targetRow) setTimeout(() => targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' }), 150);
            }
        } else {
            startBanner.style.display = 'none';
        }

        const toPar = thru > 0 ? total - parPlayed : null;
        const toParStr = toPar === null ? '' : (toPar === 0 ? 'E' : (toPar > 0 ? `+${toPar}` : toPar));
        document.getElementById('status-main').textContent = thru > 0 ? `Thru ${thru} — ${total} strokes` : `Enter Hole 1`;
        // A GUARD THAT SILENTLY DROPS THE WRITE IS WORSE THAN NO GUARD.
        // Refusing the save while leaving eighteen live boxes on screen lets a
        // team enter a full round, watch the numbers sit there, and save none of
        // them with nothing to say so. Before this, a Setup round told the team
        // "Enter your team's score below to get started" while the organizer's
        // screen said nobody could enter scores yet.
        //
        // Same two sentences renderGroup:568 uses, so a golfer on a team card and
        // a golfer on an individual card asking why they cannot score get the
        // same answer.
        document.getElementById('status-sub').textContent = roundLocked
            ? (currentData.roundStatus === 'closed'
                ? 'This round is closed — scores are final'
                : 'This round is not open for scoring yet')
            : (toPar === null ? 'Enter your team\'s score below to get started' : `${toParStr} to par`);
        if (roundLocked) {
            document.querySelectorAll('#holes-list input').forEach(i => { i.disabled = true; });
        }
    }
</script>
</body>
</html>
