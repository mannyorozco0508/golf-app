<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HardPan GPS Beta</title>
<!--
  HARDPAN GPS BETA (Myrtle trip, Oct 12-16 2026) - a separate TestFlight app,
  com.rattlegolf.gpsbeta. YARDAGES ONLY.

  TRIP SAFETY, BY CONSTRUCTION: this page never loads Firebase - there is no
  database client in the app at all, so nothing can be written to a round, a
  score, a green or a pin. The GPS screen is mounted with no round and no
  database; a green set by GPS is kept on this phone only (localStorage).
  No Enter Score, no Card. Online: Esri satellite; no signal: the USGS imagery
  this app saved for the trip courses (Esri's terms forbid storing Esri tiles).
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0b0f0c; color: #f4f4ef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #beta-home { padding: calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 24px); max-width: 520px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0; color: #d9f99d; }
  .sub { margin: 6px 0 20px; color: #a7b3aa; font-size: 14px; line-height: 1.4; }
  .course { display: block; width: 100%; text-align: left; margin: 0 0 12px; padding: 16px; border-radius: 16px; border: 1px solid rgba(217,249,157,.18);
            background: rgba(12,18,14,.9); color: inherit; font: inherit; cursor: pointer; }
  .course b { display: block; font-size: 18px; }
  .course span { display: block; margin-top: 4px; font-size: 13px; color: #a7b3aa; }
  .course em { display: block; margin-top: 6px; font-size: 12px; font-style: normal; color: #fbbf24; }
  #offline { margin-top: 18px; font-size: 13px; color: #a7b3aa; line-height: 1.4; }
  /* The GPS screen in the beta: no Card, no Enter Score, no GPS | Bets toggle.
     The › button becomes "Next hole". */
  #gps-side-toggle, #gps-overlay .gps-side-bets { display: none !important; }
  #gps-overlay .gps-scorebox .gps-score-next { flex: 1 1 auto; width: auto; border-left: 0; font-size: 18px; }
</style>
<script src="course-data.js"></script>
<script src="trip-cards.js"></script>
<script src="gps-geo.js"></script>
<script src="gps-config.js"></script>
<script src="gps-view.js"></script>
</head>
<body>
<div id="beta-home">
  <h1>HardPan GPS Beta</h1>
  <p class="sub">Yardages only, for the Myrtle trip. Nothing here is saved to your round or sent anywhere - keep scoring in HardPan.</p>
  <div id="courses"></div>
  <div id="offline"></div>
</div>
<script>
(function () {
  'use strict';
  // THE TRIP: seven rounds, Oct 13-16, from the live trip record (trip-cards.js,
  // read read-only 2026-10-08). Each opens with its own card (par, stroke index)
  // and its bundled GPS record. Thistle also offers its three official pairings.
  var TRIP = (window.TRIP_CARDS || []).slice();
  var NOTES = {
    pinelakes: 'Holes 1-9 have no mapped green: stand on each green and use Tools → Set the green (kept on this phone).',
    manofwar: 'Hole 18: the map says par 4, the card 5 - check the green on the course.',
    trueblue: 'Hole 10: the map says par 4, the card 5 - check the green on the course.'
  };
  // Thistle's 27 holes: the three official pairings. Two are trip rounds (their
  // cards come from the trip); Stewart / MacKay takes its pars from the bundled
  // nines and shows no stroke index rather than an invented one.
  var THISTLE = [
    { id: 'th_cs', gpsKey: 'thistle_27_cameron_stewart', name: 'Thistle - Cameron / Stewart' },
    { id: 'th_sm', gpsKey: 'thistle_27_stewart_mackay', name: 'Thistle - Stewart / MacKay' },
    { id: 'th_mc', gpsKey: 'thistle_27_mackay_cameron', name: 'Thistle - MacKay / Cameron' }
  ];
  function thistleCard(t) {
    var trip = TRIP.filter(function (r) { return r.gpsKey === t.gpsKey; })[0];
    if (trip) return { id: t.id, label: 'Thistle pairing', name: t.name, gpsKey: t.gpsKey, holes: trip.holes };
    var L = (typeof nineHoleLoops !== 'undefined' && nineHoleLoops.thistle_27) || {};
    var nines = t.gpsKey.replace('thistle_27_', '').split('_');
    var holes = [];
    nines.forEach(function (n, k) { ((L[n] && L[n].data) || []).forEach(function (h, i) { holes.push([k * 9 + i + 1, h.par, null]); }); });
    return { id: t.id, label: 'Thistle pairing', name: t.name, gpsKey: t.gpsKey, holes: holes };
  }
  function cardById(id) {
    var r = TRIP.filter(function (c) { return c.id === id; })[0];
    if (r) return r;
    var t = THISTLE.filter(function (c) { return c.id === id; })[0];
    return t ? thistleCard(t) : null;
  }
  var LAST = 'hpbeta_last_v2';
  var cur = null;   // { id, hole }
  var card = null;

  function meta(n) { var h = card && card.holes.filter(function (x) { return x[0] === Number(n); })[0]; return h ? { par: h[1], si: h[2] } : null; }
  function save() { try { localStorage.setItem(LAST, JSON.stringify(cur)); } catch (e) {} }

  function setHole(n) {
    var count = card.holes.length;
    if (n < 1) n = count;
    if (n > count) n = 1;
    cur.hole = n; save();
    var m = meta(n);
    window.HardPanGps.setHole(n, m ? m.par : null);
  }

  function open(id, hole) {
    var c = cardById(id);
    if (!c) return;
    var g = window.HardPanGps;
    if (g.isMounted()) g.unmount();
    card = c;
    cur = { id: id, hole: hole || 1 }; save();
    var m = meta(cur.hole);
    g.mount({
      courseKey: c.gpsKey, eventCode: 'BETA', hole: cur.hole, par: m ? m.par : null,
      // NO ROUND, NO DATABASE: the GPS screen has nothing to write to.
      round: null, db: null, writeRoundPin: null, openScore: null,
      // Set / fix a green by GPS is allowed - it stays on this phone.
      canFix: true,
      holeMeta: function (n) { var h = meta(n); return h ? { par: h.par, si: h.si, yards: null } : null; },
      holeList: function () { return card.holes.map(function (h) { return h[0]; }); },
      gotoHole: setHole,
      stepHole: function (d) { setHole(cur.hole + d); }
    });
    var next = document.querySelector('#gps-overlay .gps-score-next');
    if (next) next.textContent = 'Next hole ›';
    g.showSide('gps');
  }

  // Back (top-left on the map) shows this page again: the GPS side hides.
  function base(key) { return /^thistle_27/.test(key) ? 'thistle' : key; }
  function renderHome() {
    var box = document.getElementById('courses');
    var html = TRIP.map(function (c) {
      var note = NOTES[base(c.gpsKey)] || '';
      return '<button class="course" data-id="' + c.id + '"><b>' + c.name + '</b><span>' + c.label + ' · ' + c.holes.length + ' holes</span>'
        + (note ? '<em>' + note + '</em>' : '') + '</button>';
    }).join('');
    html += '<div class="sub" id="thistle-pick" style="margin-top:22px">Thistle: pick the nines you are playing</div>'
      + THISTLE.map(function (t) { return '<button class="course" data-id="' + t.id + '"><b>' + t.name + '</b><span>Thistle pairing · 18 holes</span></button>'; }).join('');
    box.innerHTML = html;
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button.course');
      if (b) open(b.getAttribute('data-id'), 1);
    });
  }

  // OFFLINE MAPS: with signal, save the USGS imagery (public domain) for every
  // trip course, once - two Thistle pairings cover all 27 holes. Esri's tiles
  // are never stored (its terms forbid it).
  var VENUES = ['caledonia', 'trueblue', 'pinelakes', 'pinehills', 'thistle_27_cameron_stewart', 'thistle_27_mackay_cameron', 'manofwar'];
  function precacheAll() {
    var el = document.getElementById('offline');
    if (navigator.onLine === false) { el.textContent = 'No signal: offline maps will be saved next time you have signal.'; return; }
    var ok = 0;
    el.textContent = 'Saving offline maps for the trip courses…';
    var next = function (i) {
      if (i >= VENUES.length) { el.textContent = 'Offline maps saved: ' + ok + ' of 6 courses (USGS imagery).'; return; }
      Promise.resolve(window.HardPanGps.precacheCourse(VENUES[i])).then(function (r) {
        if (r && (r.ok || r.reason === 'fresh')) ok++;
        // The two Thistle saves are one course.
        if (VENUES[i] === 'thistle_27_cameron_stewart' && r && (r.ok || r.reason === 'fresh')) ok--;
        next(i + 1);
      }, function () { next(i + 1); });
    };
    next(0);
  }

  // AT A TRIP COURSE: open it (Thistle: show its three pairings). The position
  // is compared ON THE PHONE with the bundled course data and goes nowhere else.
  function nearestVenue(pt) {
    var best = null;
    VENUES.forEach(function (key) {
      var o = window.HardPanGeo.osmCourse(window.HardPanGpsCourses || {}, key);
      var b = window.HardPanGeo.courseBounds(o, [], 0);
      if (!b) return;
      var d = window.HardPanGeo.haversineMeters(pt, [(b.south + b.north) / 2, (b.west + b.east) / 2]);
      if (d < 3000 && (!best || d < best.d)) best = { key: key, d: d };
    });
    return best;
  }
  function getPosition(ok) {
    var C = window.Capacitor, P = C && C.isNativePlatform && C.isNativePlatform() && C.Plugins && C.Plugins.Geolocation;
    if (P && typeof P.getCurrentPosition === 'function') { P.getCurrentPosition({ enableHighAccuracy: true, timeout: 15000 }).then(ok, function () {}); return; }
    if (navigator.geolocation) navigator.geolocation.getCurrentPosition(ok, function () {}, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  }
  function openNearby() {
    getPosition(function (pos) {
      if (cur) return;
      var s = document.createElement('script');
      s.src = 'gps-courses.js';
      s.onload = function () {
        var n = nearestVenue([pos.coords.latitude, pos.coords.longitude]);
        if (!n || cur) return;
        if (base(n.key) === 'thistle') { var t = document.getElementById('thistle-pick'); if (t) t.scrollIntoView({ block: 'start' }); return; }
        var r = TRIP.filter(function (c) { return c.gpsKey === n.key; })[0];
        if (r) open(r.id, 1);
      };
      document.head.appendChild(s);
    });
  }

  renderHome();
  precacheAll();
  var last = null;
  try { last = JSON.parse(localStorage.getItem(LAST) || 'null'); } catch (e) {}
  if (last && last.id && cardById(last.id)) open(last.id, last.hole || 1);
  else openNearby();
})();
</script>
</body>
</html>
