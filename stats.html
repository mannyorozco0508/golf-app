         duplicated here and in four other places; this page now consumes the one
         shared definition. Loaded ahead of the money and settlement engines,

         can shadow it. (Deliberately no engine filenames in this comment:
         stack_action_test.js checks script order with a raw indexOf, and a comment

         This page used to carry its own calculateHoleBetEngine / calculateOverallBetEngine,
         and those copies read p1/p2 only - they ignored config.sideA/sideB entirely. So a
         2v2 Stroke Play side match paid out on the Receipt and printed $0.00 on the Final
         Scorecard, which is the card the group keeps. The copies are gone; there is one
         implementation. calculateBirdieGameTotalsForSettle went with them: it was

        /* Top Navigation Bar */

           The "More" popover used to be position:absolute INSIDE .top-nav-bar,

           scroll inside .top-nav-bar, but the <details> now lives OUTSIDE that

<script>
    // --- CALENDAR-DATE SAFETY ---
    // There is deliberately NO date gate on this page.
    //
    // A beta "time bomb" used to live here: past a hardcoded date it replaced
    // document.body wholesale and threw, so the page went blank and stayed blank.
    // On the course that means a live round, a leaderboard or a settlement simply
    // vanishing mid-match. index.html was fixed in an earlier batch; this page and
    // four others were missed because the regression test only read index.html.
    //
    // ARCHITECTURAL RULE: a calendar date must never take a working round,
    // scorecard, leaderboard, settlement page, admin page or any other core app
    // page offline. Do not reintroduce a date gate here in any form.
    // ---------------------------

    const firebaseConfig = {
      apiKey: "AIzaSyB5sBBd-pdnrdp-nu60lHTMBUUd5Kwjfyk",
      authDomain: "golfapp-9fb21.firebaseapp.com",
      databaseURL: "https://golfapp-9fb21-default-rtdb.firebaseio.com",
      projectId: "golfapp-9fb21",
      storageBucket: "golfapp-9fb21.firebasestorage.app",
      messagingSenderId: "761739328763",
      appId: "1:761739328763:web:08ac41351578565c94045e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- DARK MODE ---
    (function initTheme() {
        const saved = localStorage.getItem('golfapp-theme');
        if (saved === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    })();

    function toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark-mode');
        localStorage.setItem('golfapp-theme', isDark ? 'dark' : 'light');
        const btn = document.getElementById('theme-toggle-btn');
        if (btn) btn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
    }

    document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('theme-toggle-btn');
        if (btn && document.documentElement.classList.contains('dark-mode')) {
            btn.textContent = '☀️ Light Mode';
        }
    });
    // ------------------

    const urlParams = new URLSearchParams(window.location.search);
    let currentMode = urlParams.get('game');
    let currentData = {};

    if (!currentMode) {
        window.location.href = "admin.html";
    } else {
        currentMode = currentMode.toUpperCase();
        document.getElementById("main-content").style.display = "block";

        document.querySelectorAll('.nav-link').forEach(link => {
            const base = link.getAttribute('href').split('?')[0];
            let navHref = base + '?game=' + currentMode;
            const groupParam = urlParams.get('group');
            if (groupParam) navHref += '&group=' + groupParam;
            link.href = navHref;
        });

        db.ref(`events/${currentMode}`).on('value', (snapshot) => {
            currentData = snapshot.val() || {};
            renderCleanCard(currentData);
        });
    }

    // --- WOLF GAME ENGINE (mirrors index.html) ---
    // --- DOT GAME ENGINE ---
    // Verbatim copy of money-engine.js's calcDotsEngine. This page loads no engine of
    // its own, so the body lives here too and the parity test keeps the copies honest.
    //
    // Snake is -1, eagle is 2, everything else is 1. A legacy birdie+eagle pair pays 2.
    // Greenie carryover is opt in per round; a missing flag means OFF, so rounds played
    // before the rule existed settle exactly as they did on the day.
    function dotUnitValue(dotType) {
        if (dotType === 'snake') return -1;
        if (dotType === 'eagle') return 2;
        return 1;
    }

    function normalizeDotList(list) {
        const arr = Array.isArray(list) ? list.slice() : [];
        if (arr.indexOf('eagle') > -1 && arr.indexOf('birdie') > -1) {
            return arr.filter(d => d !== 'birdie');
        }
        return arr;
    }

    function greeniePar3Holes(courseData, startHole) {
        const start = parseInt(startHole, 10) || 1;
        return (courseData || [])
            .filter(h => parseInt(h.par, 10) === 3 && parseInt(h.hole, 10) >= start)
            .map(h => parseInt(h.hole, 10))
            .sort((a, b) => a - b);
    }

    function greenieCarryMap(data, courseData, savedScores, players) {
        const byHole = {};
        const holes = greeniePar3Holes(courseData, data.startHole);
        const dots = data.dots || {};
        // PENDING, NOT PREDICTED. An eligible par 3 that nobody has won and that is not
        // yet complete does not advance the pot - and must not be shown as if it had.
        // Recording it lets the UI say "previous KP pending" from canonical state rather
        // than running a second guess at the same completeness rule.
        let riding = 1;
        const pending = [];

        holes.forEach(hole => {
            const holeDots = dots[`h${hole}`] || {};
            const claimed = Object.keys(holeDots).some(pKey => {
                const list = holeDots[pKey] || [];
                return list.indexOf('greenie') > -1;
            });

            byHole[hole] = riding;

            if (claimed) { riding = 1; return; }

            const complete = (players || []).every(p => {
                const v = savedScores[`p${p.id}_h${hole}`];
                return v !== undefined && v !== null && v !== '' && parseInt(v, 10) > 0;
            });
            if (complete) riding += 1;
            else pending.push(hole);
        });

        return { byHole, riding, pending };
    }

    function calcDotsEngine(data, courseData, savedScores) {
        const players = data.players || [];
        const scores = savedScores || data.scores || {};
        const carryOn = data.greenieCarryover === true;
        const carry = carryOn
            ? greenieCarryMap(data, courseData, scores, players)
            : { byHole: {}, riding: 1 };

        let totals = {};
        players.forEach(p => totals[p.id] = 0);

        const dots = data.dots || {};
        Object.keys(dots).forEach(hKey => {
            const hole = parseInt(String(hKey).replace('h', ''), 10);
            const holeDots = dots[hKey] || {};
            Object.keys(holeDots).forEach(pKey => {
                let pid = pKey.replace('p', '');
                if (totals[pid] === undefined) return;
                normalizeDotList(holeDots[pKey]).forEach(dotType => {
                    if (dotType === 'greenie' && carryOn && carry.byHole[hole] !== undefined) {
                        totals[pid] += carry.byHole[hole];
                    } else {
                        totals[pid] += dotUnitValue(dotType);
                    }
                });
            });
        });

        return { totals, greenieCarry: carry };
    }

    function calcWolfEngine(data, courseData, savedScores) {
        const players = data.players || [];
        const result = { totals: {}, holeLog: {}, carryPending: 0 };
        players.forEach(p => result.totals[p.id] = 0);
        if (players.length !== 4) return result;

        const loneMult = parseFloat(data.wolfLoneMult) || 2;
        const blindMult = parseFloat(data.wolfBlindMult) || 4;
        const tieRule = data.wolfTieRule || 'carry';
        const lastPlaceRule = data.wolfLastPlaceRule === 'on';
        const calls = data.wolfCalls || {};

        let carry = 0;
        const sortedHoles = (courseData || []).slice().sort((a, b) => a.hole - b.hole);

        sortedHoles.forEach(h => {
            const hole = h.hole;
            let wolfPlayer;
            if (lastPlaceRule && (hole === 17 || hole === 18)) {
                let sorted = players.slice().sort((a, b) => (result.totals[a.id] || 0) - (result.totals[b.id] || 0));
                wolfPlayer = sorted[0];
            } else {
                wolfPlayer = players[(hole - 1) % 4];
            }

            const callData = calls[`h${hole}`];
            const allScored = players.every(p => savedScores[`p${p.id}_h${hole}`]);

            let log = { hole, wolfId: wolfPlayer.id, wolfName: wolfPlayer.name, call: callData ? callData.call : null, partnerId: callData ? callData.partnerId : null, resolved: false, winner: null, pts: {} };

            if (!callData || !allScored) {
                result.holeLog[hole] = log;
                return;
            }

            let nets = {};
            players.forEach(p => {
                const gross = parseInt(savedScores[`p${p.id}_h${hole}`], 10);
                const strokes = getStrokes(h.hcpIndex, parseHcp(p.hcp));
                nets[p.id] = gross - strokes;
            });

            const others = players.filter(p => String(p.id) !== String(wolfPlayer.id));
            let winnerSide = null;
            let basePot = 0;

            if (callData.call === 'partner' && callData.partnerId) {
                const partner = others.find(p => String(p.id) === String(callData.partnerId));
                const rest = others.filter(p => String(p.id) !== String(callData.partnerId));
                if (partner && rest.length === 2) {
                    basePot = 2;
                    const teamScore = Math.min(nets[wolfPlayer.id], nets[partner.id]);
                    const oppScore = Math.min(nets[rest[0].id], nets[rest[1].id]);
                    if (teamScore < oppScore) {
                        winnerSide = 'wolf';
                        const pot = basePot + carry;
                        log.pts[wolfPlayer.id] = pot / 2;
                        log.pts[partner.id] = pot / 2;
                    } else if (oppScore < teamScore) {
                        winnerSide = 'other';
                        const pot = basePot + carry;
                        log.pts[rest[0].id] = pot / 2;
                        log.pts[rest[1].id] = pot / 2;
                    } else {
                        winnerSide = 'tie';
                    }
                }
            } else if (callData.call === 'lone' || callData.call === 'blind') {
                const mult = callData.call === 'blind' ? blindMult : loneMult;
                basePot = mult;
                const wolfScore = nets[wolfPlayer.id];
                const bestOther = Math.min(...others.map(p => nets[p.id]));
                if (wolfScore < bestOther) {
                    winnerSide = 'wolf';
                    log.pts[wolfPlayer.id] = basePot + carry;
                } else if (bestOther < wolfScore) {
                    winnerSide = 'other';
                    basePot = 3;
                    const pot = basePot + carry;
                    others.forEach(p => log.pts[p.id] = pot / 3);
                } else {
                    winnerSide = 'tie';
                }
            }

            if (winnerSide === 'tie') {
                log.winner = 'tie';
                if (tieRule === 'carry') carry += basePot;
            } else if (winnerSide) {
                log.winner = winnerSide;
                carry = 0;
                Object.keys(log.pts).forEach(pid => {
                    result.totals[pid] = (result.totals[pid] || 0) + log.pts[pid];
                });
            }

            log.resolved = !!winnerSide;
            result.holeLog[hole] = log;
        });

        result.carryPending = carry;
        return result;
    }

    // --- STABLEFORD ENGINE (mirrors index.html) ---
    function calcStablefordEngine(data, courseData, savedScores) {
        const players = data.players || [];
        const pts = data.stablefordPoints || { other: 0, bogey: 1, par: 2, birdie: 3, eagle: 5, albatross: 10 };
        const scoringType = data.stablefordScoring || 'net';
        let totals = {}, holeLog = {};
        players.forEach(p => totals[p.id] = 0);
        (courseData || []).forEach(h => {
            let log = {};
            players.forEach(p => {
                const v = savedScores[`p${p.id}_h${h.hole}`];
                if (!v) return;
                const gross = parseInt(v, 10);
                const strokes = getStrokes(h.hcpIndex, parseHcp(p.hcp));
                const scoreToUse = scoringType === 'gross' ? gross : (gross - strokes);
                const diff = scoreToUse - parseInt(h.par, 10);
                let awarded, label;
                if (diff <= -3) { awarded = pts.albatross; label = 'Alb'; }
                else if (diff === -2) { awarded = pts.eagle; label = 'Eagle'; }
                else if (diff === -1) { awarded = pts.birdie; label = 'Birdie'; }
                else if (diff === 0) { awarded = pts.par; label = 'Par'; }
                else if (diff === 1) { awarded = pts.bogey; label = 'Bogey'; }
                else { awarded = pts.other; label = 'Dbl+'; }
                totals[p.id] += awarded;
                log[p.id] = { pts: awarded, label };
            });
            holeLog[h.hole] = log;
        });
        return { totals, holeLog };
    }

    // Zero-sum $ settlement shared by Wolf and Stableford point totals
    function calcPointSettlement(players, totals, dollarPerPoint) {
        let money = {};
        const n = players.length;
        if (n === 0) return money;
        let sumPts = 0;
        players.forEach(p => sumPts += (totals[p.id] || 0));
        players.forEach(p => {
            const myPts = totals[p.id] || 0;
            money[p.id] = dollarPerPoint * (n * myPts - sumPts);
        });
        return money;
    }

    // Same rule as Dots/Junk, verified consistent — a stroke-under-par unit is worth its
    // dollar value paid by every other player, not an isolated credit with no payer.
    // KP already correctly credited the winner (buyIn * (n-1)) — it just never debited anyone.

    // Cross-group Side Matches (from the ⚔️ Matches tab) — always shown regardless of primary format
    function buildSideMatchesHtml(data, courseData, savedScores) {
        const sideMatches = data.sideMatches || {};
        const matchIds = Object.keys(sideMatches);
        if (matchIds.length === 0) return "";

        const players = data.players || [];
        function fmtSideM(amt) {
            if (amt > 0) return `<span class="val-pos">+$${amt.toFixed(2)}</span>`;
            if (amt < 0) return `<span class="val-neg">-$${Math.abs(amt).toFixed(2)}</span>`;
            return `<span>$0.00</span>`;
        }

        let rows = "";
        matchIds.sort((a, b) => (sideMatches[a].createdAt || 0) - (sideMatches[b].createdAt || 0)).forEach(matchId => {
            const sm = sideMatches[matchId];
            const teamAPlayers = players.filter(p => (sm.teamAIds || []).includes(String(p.id)) || (sm.teamAIds || []).includes(p.id)).map(p => ({ ...p, team: "Team 1" }));
            const teamBPlayers = players.filter(p => (sm.teamBIds || []).includes(String(p.id)) || (sm.teamBIds || []).includes(p.id)).map(p => ({ ...p, team: "Team 2" }));
            const virtualPlayers = teamAPlayers.concat(teamBPlayers);
            if (virtualPlayers.length < 2) return;

            // Only holes from this match's own start hole forward. A match with no
            // startHole covers the whole round, exactly as before. Declared ABOVE the
            // format branch because both branches settle over the same range.
            const smCourse = (typeof sideMatchHoles === 'function')
                ? sideMatchHoles(sm, courseData)
                : ((sm.startHole || 1) > 1 ? courseData.filter(h => h.hole >= sm.startHole) : courseData);

            if (sm.format === 'stroke') {
                const p1 = teamAPlayers[0], p2 = teamBPlayers[0];
                if (!p1 || !p2) return;

                // THE WHOLE SIDE, NOT ITS FIRST GOLFER.
                //
                // sideA/sideB is the contract settlement-engine.js already uses for this
                // exact match, and the Matches tab has passed it since Batch 2. Without it
                // a 2v2 Stroke Play match was scored as Ann v Ben and printed $0.00 on the
                // card the group keeps, while the Receipt paid the side. A 1v1 carries one
                // golfer per side, which is exactly the engine's own [p1]/[p2] fallback -
                // so every existing single card renders byte-for-byte as it always has.
                const sides = { sideA: teamAPlayers, sideB: teamBPlayers };

                const holeConfig = Object.assign({ holeEnabled: (sm.holeStake || 0) > 0, holeStake: sm.holeStake || 0, segment: sm.segment || 'full', tieRule: sm.tieRule || 'carry', scoringType: sm.scoring || 'net' }, sides);
                const overallConfig = Object.assign({ overallEnabled: (sm.overallStake || 0) > 0, overallStake: sm.overallStake || 0, overallMode: sm.overallMode || 'stroke', scoringType: sm.scoring || 'net' }, sides);
                const holePresses = sm.holePresses ? Object.values(sm.holePresses) : [];
                const overallPresses = sm.overallPresses ? Object.values(sm.overallPresses) : [];
                const holeCalc = holeConfig.holeEnabled ? calculateHoleBetEngine([p1, p2], smCourse, savedScores, holeConfig, holePresses) : null;
                const overallCalc = overallConfig.overallEnabled ? calculateOverallBetEngine([p1, p2], smCourse, savedScores, overallConfig, overallPresses) : null;
                const p1Total = (holeCalc ? holeCalc.p1Money : 0) + (overallCalc ? overallCalc.p1Money : 0);

                // SIDE-LEVEL, THE SAME WAY MATCH PLAY AND NASSAU ALREADY REPORT BELOW.
                //
                // Those rows have always read calc.t1Name / t2Name - joined first names for
                // a pair - and shown the SIDE's money. Stroke was the odd one out, printing
                // one golfer's stored name against an amount the whole side had won. On a
                // 1v1 the joined name of a one-golfer side is that golfer's own first name,
                // so nothing about an existing card moves. Stats does not break any format
                // down per golfer; the Receipt and the Matches tab do that.
                // JOINED WITH "/" AND NO SPACES, because that is what the Match Play and
                // Nassau rows on this very card already print - calculateMatchEngine builds
                // t1Name that way. settlement-engine.js joins a side with " / " instead, and
                // the Matches tab follows it; matching the ENGINE here would have put
                // "Ann / Abe" one row above "Ann/Abe" for the same pair on the same
                // scorecard, which reads as a bug. Same golfers, same money, one spelling
                // per surface.
                const sideName = (side) => side.map(pl => pl.name.split(' ')[0]).join('/');
                const nameA = sideName(teamAPlayers);
                const nameB = sideName(teamBPlayers);
                const ledgerA = teamAPlayers.length > 1 ? nameA : p1.name;
                const ledgerB = teamBPlayers.length > 1 ? nameB : p2.name;

                rows += `<div class="ledger-row" style="font-size:0.72rem; color:var(--text-muted); padding-top:8px; border-top:1px dashed var(--border-faint);"><span>${nameA} vs ${nameB} — Stroke Play</span><span></span></div>`;
                rows += `<div class="ledger-row"><span>${ledgerA}</span><span>${fmtSideM(p1Total)}</span></div>`;
                rows += `<div class="ledger-row"><span>${ledgerB}</span><span>${fmtSideM(-p1Total)}</span></div>`;
            } else {
                const manualPresses = sm.presses ? Object.values(sm.presses) : [];
                const calc = calculateMatchEngine(virtualPlayers, smCourse, savedScores, sm.scoring || 'net', sm.format, sm.pressRule || 'none', sm.stake || 0, 0, manualPresses, nassauStakeConfig(sm));
                if (!calc) return;
                const formatLabel = sm.format === 'nassau' ? 'Nassau' : 'Match Play';

                rows += `<div class="ledger-row" style="font-size:0.72rem; color:var(--text-muted); padding-top:8px; border-top:1px dashed var(--border-faint);"><span>${calc.t1Name} vs ${calc.t2Name} — ${formatLabel}</span><span></span></div>`;
                rows += `<div class="ledger-row"><span>${calc.t1Name}</span><span>${fmtSideM(calc.t1TotalMoney)}</span></div>`;
                rows += `<div class="ledger-row"><span>${calc.t2Name}</span><span>${fmtSideM(-calc.t1TotalMoney)}</span></div>`;
            }
        });

        if (!rows) return "";
        return `<div class="settle-card"><div class="settle-header">⚔️ Side Matches</div>${rows}</div>`;
    }

    function buildSideGamesHtml(data, courseData, savedScores) {
        let html = "";

        if (data.birdieGameEnabled === true) {
            const totals = calculateBirdieGameTotalsForSettle(data, courseData, savedScores);
            const players = (data.players || []).filter(p => p.playingForMoney !== false);
            if (players.length > 0) {
                html += `<div class="settle-card"><div class="settle-header">🐦 Birdie Game (amount won)</div>`;
                players.forEach(p => {
                    html += `<div class="ledger-row"><span>${p.name}</span><span>$${(totals[p.id] || 0).toFixed(2)}</span></div>`;
                });
                html += `</div>`;
            }
        }


        html += buildSideMatchesHtml(data, courseData, savedScores);

        return html;
    }

    // --- Ported from settlement.html: handles Nassau / Match / Best Ball / Scramble / Ryder ---
    // ============================================================================
    // NASSAU STAKE CONFIG — read the persisted fields into the runtime shape
    //
    // Flat fields, matching every other Nassau setting:
    //   nassauFrontStake / nassauBackStake / nassauOverallStake / nassauAutoPressStake
    //
    // LEGACY IS THE ABSENCE OF THESE FIELDS. A round carrying only nassauStake gets
    // undefined for each segment, calculateMatchEngine falls back to the single
    // wager, and it settles to the cent exactly as it always has. Nothing is
    // migrated; old rounds are simply never asked the new question.
    //
    // nassauAutoPressStake null/absent means "same as segment" - the default most
    // groups play. A number applies to every automatic press. Manual presses are
    // untouched either way: whatever the golfer typed at the moment of pressing.
    function nassauStakeConfig(data) {
        const d = data || {};
        // TWO SHAPES, ONE CONTRACT.
        //
        //   SIDE MATCH (the supported path): frontStake / backStake / overallStake
        //   ROUND FORMAT (legacy, hidden):   nassauFrontStake / nassauBackStake / ...
        //
        // Nassau is a WAGER created from Action, not a round type; the round format
        // survives only so existing rounds stay readable. Both normalize here so no
        // consumer needs to know which it is holding.
        const isSideMatch = d.format === 'nassau';
        if (isSideMatch) {
            const pickS = v => (v === undefined || v === null || v === '') ? undefined : Number(v);
            const c = {
                F9: pickS(d.frontStake),
                B9: pickS(d.backStake),
                '18': pickS(d.overallStake),
                autoPress: pickS(d.autoPressStake),
            };
            if (c.F9 === undefined && c.B9 === undefined && c['18'] === undefined
                && c.autoPress === undefined) return undefined;   // legacy: single `stake`
            return c;
        }
        if (d.gameFormat !== 'nassau') return undefined;
        const pick = v => (v === undefined || v === null || v === '') ? undefined : Number(v);
        const cfg = {
            F9: pick(d.nassauFrontStake),
            B9: pick(d.nassauBackStake),
            '18': pick(d.nassauOverallStake),
            autoPress: pick(d.nassauAutoPressStake),
        };
        // Nothing configured at all -> behave exactly like a legacy round.
        if (cfg.F9 === undefined && cfg.B9 === undefined && cfg['18'] === undefined
            && cfg.autoPress === undefined) return undefined;
        return cfg;
    }

    // SINGLES NET MATCH PLAY: STROKES ARE RELATIVE TO THE OPPONENT.
    //
    // In a singles net match the lower Playing Handicap plays off zero and the other
    // player receives the arithmetic difference, allocated from stroke index 1 upward
    // (USGA/WHS). Applying each player's FULL handicap against the course instead -
    // which is what this engine used to do - is stroke-play net scoring, and it lands
    // the strokes on the wrong holes. For 7 vs 12 it put them on SI 6-10 rather than
    // SI 1-5, so the receiving player got nothing on the stroke index 1 hole.
    //
    // parseHcp stores a plus handicap as a negative (+2 -> -2), so the differential is
    // plain arithmetic and plus handicaps need no special case. The ordinary
    // course-based behaviour, where a plus player gives a stroke back starting at
    // SI 18, remains correct for stroke-play net and is untouched in getStrokes().
    //
    // GATED TO 1v1. The same loop serves team formats, taking min() for best ball, and
    // team handicap allowances are a separate rules question. Anything with more than
    // one player a side keeps its existing behaviour exactly.

    // ============================================================================
    // RELATIVE MATCH-PLAY HANDICAPS - ONE BASELINE FOR THE WHOLE MATCH
    // ============================================================================
    // The lowest Playing Handicap among EVERY golfer in the match plays off zero, and
    // every other golfer - INCLUDING THE LOWEST GOLFER'S OWN PARTNER - receives the
    // arithmetic difference from that single baseline, allocated from stroke index 1
    // upward. There is exactly ONE baseline per match. It is never recomputed per
    // team, per Nassau segment, or per press.
    //
    // 2v2 worked example, 5 and 12 against 8 and 17:
    //   baseline = 5  ->  5 plays off 0, 12 receives 7, 8 receives 3, 17 receives 12
    // The 12 is the 5's own partner and still receives 7. That is the intended rule:
    // team membership does not decide the baseline, the field of the match does.
    //
    // parseHcp stores a plus handicap as a negative (+2 -> -2), so the differential is
    // plain arithmetic and needs no special case: +2, 3, 7, 10 gives a baseline of -2
    // and relative handicaps of 0, 5, 9, 12. The ordinary course-based plus-handicap
    // giveback that starts at SI 18 belongs to stroke-play net scoring and is
    // deliberately NOT used here; getStrokes() keeps it, untouched.

    // Allocate a RELATIVE handicap across stroke indexes. Generalises past 18: every
    // hole gets one stroke per full 18, and the remainder falls on the lowest indexes.
    // rel 20 -> one everywhere plus a second on SI 1-2. rel 36 -> two everywhere.
    // rel 40 -> two everywhere plus a third on SI 1-4.
    // The one baseline for a match: the lowest parsed Playing Handicap among ALL
    // participants, both sides counted together. Which team a golfer is on is
    // irrelevant to this calculation, and player/team ORDER cannot change it because
    // a minimum is order-independent.
    // playerId -> relative match handicap, SCOPED TO THIS MATCH ONLY. Never written
    // back onto the player record: the same golfer legitimately carries a different
    // relative handicap in a simultaneous match against different opponents.
    // Which formats are genuinely HOLE-BY-HOLE MATCH PLAY played with individual
    // balls. Scramble is excluded ON PURPOSE: it is a single-ball team format, so
    // there is no individual ball for an individual relative stroke to attach to. It
    // keeps its existing behaviour exactly. A 1v1 is always treated as a match
    // regardless of the format label, which preserves the committed singles contract.
    function calculateMatchEngine(players, courseData, savedScores, scoringType, gameFormat, pressRule, stake, holeBet, manualPresses, stakeConfig) {
    // THREE-STAKE NASSAU (authorized change).
    //
    // A real Nassau is three independent wagers - "$5 front, $5 back, $10 overall" -
    // and the app could only express one number for all three. stakeConfig carries
    // them; when it is absent EVERY segment falls back to `stake`, so a legacy round
    // settles to the cent exactly as before. No historical data is migrated.
    //
    //   stakeConfig = { F9: 5, B9: 5, '18': 10, autoPress: <amount>|null }
    //
    // AUTO-PRESS AMOUNT is its own setting, defaulting to the segment's own stake.
    // A press on the $5 front must never settle at the $10 overall stake - and a
    // manually enlarged press never cascades into later automatic ones, because the
    // golfers agreed to the house auto-press amount, not that one-off escalation.
    const segCfg = stakeConfig || {};
    const baseStakeFor = id => {
        const v = segCfg[id];
        return (v === undefined || v === null || v === '') ? stake : Number(v);
    };
    // AUTO-PRESS AMOUNT, most specific wins:
    //   autoPress.F9 / .B9 / .18   a per-segment amount, if the players set one
    //   autoPress                  a single amount for every segment
    //   (neither)                  that segment's own stake - the default
    // Manual presses never reach here; they keep the amount the golfer typed.
    const autoPressStakeFor = id => {
        const ap = segCfg.autoPress;
        const blank = v => v === undefined || v === null || v === '';
        if (ap !== null && typeof ap === 'object') {
            if (!blank(ap[id])) return Number(ap[id]);
            return baseStakeFor(id);
        }
        return blank(ap) ? baseStakeFor(id) : Number(ap);
    };
        let teams = {};
        players.forEach(p => {
            let key = p.team || "Team 1";
            if (!teams[key]) teams[key] = [];
            teams[key].push(p);
        });

        const teamKeys = Object.keys(teams);
        if (teamKeys.length < 2) return null;

        let t1Key = teamKeys[0];
        let t2Key = teamKeys[1];
        let t1Players = teams[t1Key];
        let t2Players = teams[t2Key];

        let t1Name = t1Players.map(p => p.name.split(" ")[0]).join("/");
        let t2Name = t2Players.map(p => p.name.split(" ")[0]).join("/");

        let hasFront = courseData.some(h => h.hole <= 9);
        let hasBack = courseData.some(h => h.hole > 9);

        let activeMatches = [];
        if (gameFormat === 'nassau') {
            if (hasFront && hasBack) {
                activeMatches = [
                    { id: 'F9', baseId: 'F9', startHole: 1, endHole: 9, status: 0, label: 'Front 9', triggers: 0, closed: false, pressNum: 0, stake: baseStakeFor('F9') },
                    { id: 'B9', baseId: 'B9', startHole: 10, endHole: 18, status: 0, label: 'Back 9', triggers: 0, closed: false, pressNum: 0, stake: baseStakeFor('B9') },
                    { id: '18', baseId: '18', startHole: 1, endHole: 18, status: 0, label: 'Total', triggers: 0, closed: false, pressNum: 0, stake: baseStakeFor('18') }
                ];
            } else if (hasFront) {
                activeMatches = [
                    { id: 'F9', baseId: 'F9', startHole: 1, endHole: 9, status: 0, label: '9-Hole Match', triggers: 0, closed: false, pressNum: 0, stake: baseStakeFor('F9') }
                ];
            } else if (hasBack) {
                activeMatches = [
                    { id: 'B9', baseId: 'B9', startHole: 10, endHole: 18, status: 0, label: '9-Hole Match', triggers: 0, closed: false, pressNum: 0, stake: baseStakeFor('B9') }
                ];
            }
        } else {
            let startH = hasFront ? 1 : 10;
            let endH = hasBack ? 18 : 9;
            activeMatches = [
                { id: '18', baseId: '18', startHole: startH, endHole: endH, status: 0, label: 'Overall Match', triggers: 0, closed: false, pressNum: 0 }
            ];
        }

        // ONE relative handicap table for the ENTIRE match, computed once here rather
        // than per hole. Presses reuse this table by construction - a press is another
        // wager over the SAME hole decisions, so it cannot find a new lowest golfer,
        // create a new baseline, or renumber stroke indexes from the press hole.
        const allMatchPlayers = t1Players.concat(t2Players);
        // A one-per-side match is always relative, whatever the format is labelled,
        // which preserves the already-committed singles contract byte for byte.
        const isSinglesMatch = t1Players.length === 1 && t2Players.length === 1;
        const useRelativeHcp = scoringType === 'net'
            && (isSinglesMatch || isRelativeMatchFormat(gameFormat));
        const matchBaseline = useRelativeHcp ? matchHandicapBaseline(allMatchPlayers) : 0;
        const relHcpById = useRelativeHcp ? matchRelativeHandicaps(allMatchPlayers) : {};
        // Gross play and non-match team formats keep exactly what they had before.
        const matchStrokesFor = (p, hcpIndex) => useRelativeHcp
            ? allocateMatchStrokes(relHcpById[String(p.id)] || 0, hcpIndex)
            : (scoringType === 'net' ? getStrokes(hcpIndex, parseHcp(p.hcp)) : 0);

        let pressCount = 0;
        let maxThru = 0;
        let holeLog = {};

        courseData.forEach(hole => {
            let hNum = hole.hole;
            let t1Best = 999, t2Best = 999;
            let t1Valid = false, t2Valid = false;

            // Strokes come from the ONE match-wide relative table built before this
            // loop. Every golfer in the match, on either side, is measured against the
            // same lowest handicap - see matchHandicapBaseline().
            t1Players.forEach(p => {
                let v = savedScores[`p${p.id}_h${hNum}`];
                if (v && v > 0) {
                    let str = matchStrokesFor(p, hole.hcpIndex);
                    let s = parseInt(v, 10) - str;
                    if (s < t1Best) t1Best = s;
                    t1Valid = true;
                }
            });

            t2Players.forEach(p => {
                let v = savedScores[`p${p.id}_h${hNum}`];
                if (v && v > 0) {
                    let str = matchStrokesFor(p, hole.hcpIndex);
                    let s = parseInt(v, 10) - str;
                    if (s < t2Best) t2Best = s;
                    t2Valid = true;
                }
            });

            if (t1Valid && t2Valid) {
                maxThru++;
                let diff = 0;
                if (t1Best < t2Best) diff = 1;
                else if (t2Best < t1Best) diff = -1;

                let holeWinner = diff === 1 ? t1Name : (diff === -1 ? t2Name : "Halved");
                let newPresses = [];

                activeMatches.forEach(m => {
                    if (hNum >= m.startHole && hNum <= m.endHole && !m.closed) {
                        m.status += diff;

                        let hLeft = m.endHole - hNum;
                        if (Math.abs(m.status) > hLeft) {
                            m.closed = true;
                            let winnerName = m.status > 0 ? t1Name : t2Name;
                            m.finalResult = `${winnerName} ${Math.abs(m.status)}&${hLeft}`;
                        }

                        if (hNum < m.endHole) {
                            const threshold = pressRule === '2down' ? 2 : (pressRule === '1down' ? 1 : null);
                            const autoTrigger = threshold !== null && Math.abs(m.status) >= threshold;
                            // PER-PRESS STAKE PARITY (ported verbatim from money-engine.js).
                            //
                            // "Press you for $25" is a different bet from "press you for the
                            // same $10". This copy only DETECTED the manual press and then
                            // settled it at the base wager, so a $10 Nassau with a $25 press
                            // showed $30 here while the Receipt correctly paid $45. Same
                            // press, same winner, two different numbers - which is worse than
                            // being wrong once, because it makes the app contradict itself.
                            //
                            // Looked up rather than detected, exactly as canonical does.
                            const manualPress = (manualPresses || []).find(mp => mp.baseId === m.baseId && mp.startHole === hNum + 1);
                            const manualTrigger = !!manualPress;

                            if ((autoTrigger || manualTrigger) && m.triggers === 0) {
                                m.triggers = 1;
                                pressCount++;

                                let existingPresses = activeMatches.filter(am => am.baseId === m.baseId && am.pressNum > 0).length + newPresses.filter(am => am.baseId === m.baseId).length;
                                let nextPressNum = existingPresses + 1;

                                newPresses.push({
                                    id: `P${pressCount}`,
                                    baseId: m.baseId,
                                    // Stored ONLY when the golfer explicitly entered one. A press
                                    // without a stake settles at the original wager, which keeps
                                    // every legacy round to the cent.
                                    stake: (manualPress && manualPress.stake !== undefined && manualPress.stake !== null)
                                        ? manualPress.stake
                                        : (gameFormat === 'nassau' ? autoPressStakeFor(m.baseId) : undefined),
                                    startHole: hNum + 1,
                                    endHole: m.endHole,
                                    status: 0,
                                    label: `Press ${nextPressNum} (Hole ${hNum + 1})`,
                                    triggers: 0,
                                    closed: false,
                                    pressNum: nextPressNum
                                });
                            }
                        }
                    }
                });

                activeMatches = activeMatches.concat(newPresses);

                let f9 = activeMatches.find(m => m.id === 'F9');
                let b9 = activeMatches.find(m => m.id === 'B9');
                let t18 = activeMatches.find(m => m.id === '18');

                holeLog[hNum] = {
                    holeWinner: holeWinner,
                    f9Match: f9 ? f9.status : 0, f9Closed: f9 ? f9.closed : false, f9Res: f9 ? f9.finalResult : "",
                    b9Match: b9 ? b9.status : 0, b9Closed: b9 ? b9.closed : false, b9Res: b9 ? b9.finalResult : "",
                    totMatch: t18 ? t18.status : 0, totClosed: t18 ? t18.closed : false, totRes: t18 ? t18.finalResult : ""
                };
            }
        });

        let t1TotalMoney = 0;
        // Each segment settles at ITS stake. Base matches and auto presses never store
        // one, so segStake is the original wager for them - byte-for-byte the old
        // behaviour. Only a manual press that explicitly carried an amount differs.
        const segStake = m => (m.stake === undefined || m.stake === null) ? stake : m.stake;
        if (gameFormat === 'nassau') {
            activeMatches.forEach(m => {
                if (m.status > 0) t1TotalMoney += segStake(m);
                else if (m.status < 0) t1TotalMoney -= segStake(m);
            });
        } else {
            activeMatches.forEach(m => {
                if (holeBet > 0) {
                    t1TotalMoney += m.status * holeBet;
                } else {
                    if (m.status > 0) t1TotalMoney += segStake(m);
                    else if (m.status < 0) t1TotalMoney -= segStake(m);
                }
            });
        }

        return { t1Name, t2Name, activeMatches, maxThru, holeLog, t1TotalMoney, pressCount,

                 usesRelativeHandicap: useRelativeHcp, matchBaseline, relHcpById };
    }



    function formatMatchPill(score, t1Name, t2Name, isClosed, finalResult) {
        if (isClosed && finalResult) return finalResult;
        if (score === 0) return "AS";
        if (score > 0) return `${t1Name} ${score}UP`;
        return `${t2Name} ${Math.abs(score)}UP`;
    }

    function formatMoney(amount) {
        if (amount > 0) return `<span class="val-pos">+$${amount}</span>`;
        if (amount < 0) return `<span class="val-neg">-$${Math.abs(amount)}</span>`;
        return `<span class="val-even">$0</span>`;
    }

    // --- Builds the settlement block that gets appended to the printable card ---
    function renderSettlementBlock(data) {
        const players = data.players || [];
        const courseData = data.courseData || [];
        const savedScores = data.scores || {};
        const gameFormat = data.gameFormat || "stroke";
        const holeBet = data.holeBetStake || 0;

        // Only players opted in to money betting are included in payout math below -
        // everyone still scores normally regardless of this flag.
        const moneyPlayers = players.filter(p => p.playingForMoney !== false);

        if (gameFormat === 'skins') {
            return `
                <div class="settle-card">
                    <div class="settle-header">💵 Round Settlement</div>
                    <div class="settle-note">Skins payouts are tracked on the <strong>💰 Bets</strong> tab — open it to see the full per-player payout ledger.</div>
                </div>
                ${buildSideGamesHtml(data, courseData, savedScores)}
            `;
        }

        if (gameFormat === 'dots') {
            const playerDots = calcDotsEngine(
                Object.assign({}, data, { players: moneyPlayers }),
                courseData,
                savedScores
            ).totals;

            let dotVal = data.dotPointVal || 0;
            let ledgerHtml = "";
            const dotsN = moneyPlayers.length;
            const dotsTotalUnits = moneyPlayers.reduce((s, p) => s + (playerDots[p.id] || 0), 0);

            moneyPlayers.forEach(p => {
                let pts = playerDots[p.id];
                let money = dotsN > 1 ? dotVal * (dotsN * pts - dotsTotalUnits) : 0;
                let moneyClass = money >= 0 ? "val-pos" : "val-neg";
                let moneyText = money >= 0 ? `+$${money}` : `-$${Math.abs(money)}`;

                ledgerHtml += `
                    <div class="ledger-row">
                        <span>${p.name} (${pts} Dots):</span>
                        <span class="${moneyClass}">${moneyText}</span>
                    </div>
                `;
            });

            return `
                <div class="settle-card">
                    <div class="settle-header">🎯 Round Settlement (Dots)</div>
                    ${ledgerHtml}
                </div>
                ${buildSideGamesHtml(data, courseData, savedScores)}
            `;
        }

        if (gameFormat === 'wolf') {
            const wolfCalc = calcWolfEngine(data, courseData, savedScores);
            const wolfMoney = calcPointSettlement(moneyPlayers, wolfCalc.totals, data.wolfPointVal || 0);
            let ledgerHtml = "";

            moneyPlayers.forEach(p => {
                let pts = wolfCalc.totals[p.id] || 0;
                let money = wolfMoney[p.id] || 0;
                let moneyClass = money >= 0 ? "val-pos" : "val-neg";
                let moneyText = money >= 0 ? `+$${money.toFixed(2)}` : `-$${Math.abs(money).toFixed(2)}`;

                ledgerHtml += `
                    <div class="ledger-row">
                        <span>${p.name} (${pts} pt${pts === 1 ? '' : 's'}):</span>
                        <span class="${moneyClass}">${moneyText}</span>
                    </div>
                `;
            });

            return `
                <div class="settle-card">
                    <div class="settle-header">🐺 Round Settlement (Wolf)</div>
                    ${ledgerHtml}
                </div>
                ${buildSideGamesHtml(data, courseData, savedScores)}
            `;
        }

        if (gameFormat === 'stableford') {
            const sfCalc = calcStablefordEngine(data, courseData, savedScores);
            const sfMoney = calcPointSettlement(moneyPlayers, sfCalc.totals, data.stablefordPointVal || 0);
            let ledgerHtml = "";

            moneyPlayers.forEach(p => {
                let pts = sfCalc.totals[p.id] || 0;
                let money = sfMoney[p.id] || 0;
                let moneyClass = money >= 0 ? "val-pos" : "val-neg";
                let moneyText = money >= 0 ? `+$${money.toFixed(2)}` : `-$${Math.abs(money).toFixed(2)}`;

                ledgerHtml += `
                    <div class="ledger-row">
                        <span>${p.name} (${pts} pt${pts === 1 ? '' : 's'}):</span>
                        <span class="${moneyClass}">${moneyText}</span>
                    </div>
                `;
            });

            return `
                <div class="settle-card">
                    <div class="settle-header">🎯 Round Settlement (Stableford)</div>
                    ${ledgerHtml}
                </div>
                ${buildSideGamesHtml(data, courseData, savedScores)}
            `;
        }

        if (gameFormat !== 'nassau' && !['match', 'bestball', 'scramble', 'ryder'].includes(gameFormat)) {
            return `
                <div class="settle-card">
                    <div class="settle-header">💵 Round Settlement</div>
                    <div class="settle-note">Settlement isn't tracked for this game format yet.</div>
                </div>
            `;
        }

        let scoringType = data.nassauScoring || data.matchScoring || "net";
        let pressRule = gameFormat === 'nassau' ? (data.nassauPressRule || "none") : (data.matchPressRule || "none");
        let nassauStake = data.nassauStake || 10;
        let matchStake = data.matchStake || 0;
        let stakeToUse = gameFormat === 'nassau' ? nassauStake : matchStake;

        const manualMatchPresses = data.matchPresses ? Object.values(data.matchPresses) : [];
        const matchData = calculateMatchEngine(moneyPlayers, courseData, savedScores, scoringType, gameFormat, pressRule, stakeToUse, holeBet, manualMatchPresses, nassauStakeConfig(data));

        if (!matchData) {
            return `
                <div class="settle-card">
                    <div class="settle-header">💵 Round Settlement</div>
                    <div class="settle-note">Waiting for players and scores to be entered...</div>
                </div>
            `;
        }

        let breakdownHtml = "";

        if (gameFormat === 'nassau') {
            ['F9', 'B9', '18'].forEach(bId => {
                let groupMatches = matchData.activeMatches.filter(m => m.baseId === bId);
                if (groupMatches.length > 0) {
                    let groupLabel = bId === 'F9' ? 'Front 9' : (bId === 'B9' ? 'Back 9' : 'Total');
                    breakdownHtml += `<div style="background:var(--subtle-bg); color:var(--brand-green); padding:4px 8px; font-weight:bold; font-size:0.75rem; text-transform:uppercase; margin-top:8px; border-radius:4px;">${groupLabel} Bets</div>`;

                    groupMatches.forEach(m => {
                        let statusDesc = "All Square ($0)";
                        if (m.status > 0) statusDesc = `${matchData.t1Name} +$${stakeToUse}`;
                        else if (m.status < 0) statusDesc = `${matchData.t2Name} +$${stakeToUse}`;

                        let lockIcon = m.closed ? "🔒 " : "";
                        let indent = m.pressNum > 0 ? "margin-left: 12px; border-left: 2px solid #2a9d8f; padding-left: 8px;" : "padding-left: 4px;";
                        breakdownHtml += `<div class="breakdown-item" style="border-bottom:1px solid #eee; padding: 4px 0; ${indent}"><span>${lockIcon}${m.label}:</span> <strong>${statusDesc}</strong></div>`;
                    });
                }
            });
        } else {
            let t18 = matchData.activeMatches.find(m => m.id === '18');
            let statusDesc = "All Square ($0)";
            if (holeBet > 0) {
                let amt = Math.abs(t18.status * holeBet);
                if (t18.status > 0) statusDesc = `${matchData.t1Name} Won (+${amt})`;
                else if (t18.status < 0) statusDesc = `${matchData.t2Name} Won (-${amt})`;
            } else {
                let amt = matchStake;
                if (t18.status > 0) statusDesc = `${matchData.t1Name} Won (+${amt})`;
                else if (t18.status < 0) statusDesc = `${matchData.t2Name} Won (-${amt})`;
            }
            breakdownHtml += `
                <div class="breakdown-item">
                    <span>Overall Match:</span>
                    <span><strong>${statusDesc}</strong></span>
                </div>
            `;
        }

        let t1Total = matchData.t1TotalMoney;

        return `
            <div class="settle-card">
                <div class="settle-header">💵 Round Settlement (${matchData.t1Name} vs ${matchData.t2Name})</div>

                <div class="match-breakdown-list" style="margin-bottom: 16px;">
                    <div style="font-weight: bold; margin-bottom: 4px; color: #0f4c3a;">Bet Breakdown:</div>
                    ${breakdownHtml}
                </div>

                <div class="ledger-row" style="background:var(--nav-bg);">
                    <span>${matchData.t1Name}:</span>
                    <span>${formatMoney(t1Total)}</span>
                </div>

                <div class="ledger-row" style="background:var(--nav-bg);">
                    <span>${matchData.t2Name}:</span>
                    <span>${formatMoney(-t1Total)}</span>
                </div>
            </div>
        `;
    }

    function renderCleanCard(data) {
        const container = document.getElementById("stats-content");
        const players = data.players || [];
        const courseData = data.courseData || [];
        const savedScores = data.scores || {};
        
        if (players.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted);">Waiting for round setup...</div>`;
            return;
        }

        const courseName = data.courseName || "Golf Course";
        const dateObj = new Date();
        const dateString = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

        let html = `
            <div class="clean-scorecard" id="capture-area">
                <div class="course-header">
                    <h2 class="course-name">${courseName}</h2>
                    <div class="round-date">${dateString}</div>
                </div>
                <div class="card-table-wrapper">
                    <table class="card-table">
                        <thead>
                            <tr>
                                <th style="width: 40px;">Hole</th>
                                <th style="width: 35px;">Par</th>
                                ${players.map(p => `<th>${p.name.split(" ")[0]}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
        `;

        let f9Gross = {}, b9Gross = {}, totGross = {};
        players.forEach(p => { f9Gross[p.id]=0; b9Gross[p.id]=0; totGross[p.id]=0; });

        courseData.forEach(h => {
            html += `<tr><td>${h.hole}</td><td style="color:var(--text-muted);">${h.par}</td>`;
            players.forEach(p => {
                let v = savedScores[`p${p.id}_h${h.hole}`];
                if (v && v > 0) {
                    let score = parseInt(v, 10);
                    let par = parseInt(h.par, 10);
                    let diff = score - par;
                    
                    if (h.hole <= 9) f9Gross[p.id] += score;
                    else b9Gross[p.id] += score;
                    totGross[p.id] += score;

                    let shapeHtml = "";
                    
                    if (diff === -1) {
                        shapeHtml = `<div class="shape-circle-1"></div>`;
                    } else if (diff <= -2) {
                        shapeHtml = `<div class="shape-circle-1"></div><div class="shape-circle-2"></div>`;
                    }

                    html += `
                        <td>
                            <div class="score-display-wrapper">
                                ${score}
                                ${shapeHtml}
                            </div>
                        </td>
                    `;
                } else {
                    html += `<td style="color:var(--text-muted);">-</td>`;
                }
            });
            html += `</tr>`;

            if (h.hole === 9 || h.hole === 18) {
                let isOut = h.hole === 9;
                let label = isOut ? "OUT" : "IN";
                
                html += `<tr class="subtotal-row"><td>${label}</td><td>-</td>`;
                players.forEach(p => { 
                    let val = isOut ? f9Gross[p.id] : b9Gross[p.id];
                    html += `<td>${val > 0 ? val : '-'}</td>`; 
                });
                html += `</tr>`;

                if (h.hole === 18) {
                    html += `<tr class="total-row"><td>TOTAL</td><td>-</td>`;
                    players.forEach(p => { 
                        html += `<td>${totGross[p.id] > 0 ? totGross[p.id] : '-'}</td>`; 
                    });
                    html += `</tr>`;
                }
            }
        });

        html += `
                        </tbody>
                    </table>
                </div>
            </div>
        `;

        html += renderSettlementBlock(data);
        html += buildSideGamesHtml(data, courseData, savedScores);

        html += `
            <!-- Stats prints remain possible via the browser; the MONEY document is canonical. -->
            <a class="btn-primary nav-link" href="settlement.html" style="display:block; text-align:center; text-decoration:none;">📄 Final Results &amp; Receipt</a>
        `;

        container.innerHTML = html;
    }

    // Close the "More" popover when a tap lands outside it. Native <details> already
    // handles tapping the summary again, and navigating away closes it implicitly, so
    // this only covers the tap-elsewhere case. Uses a plain listener rather than a CSS
    // overlay: an overlay can block links but can never close anything.
    document.addEventListener('click', function (e) {
        document.querySelectorAll('details.nav-more[open]').forEach(function (d) {
            if (!d.contains(e.target)) d.removeAttribute('open');
        });
    });
</script>

</body>
