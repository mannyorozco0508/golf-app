<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardPan Tournaments · TV board</title>
    <!-- THE CLUBHOUSE TV BOARD (57, TV option A; Manny 2026-11-12). One page,
         tournament-tv.html?tourney=CODE, opened on the bar TV in any browser.
         Read-only: it shows what the board already knows (the same engine
         resolution as the organizer's Board tab and the golfer's card), in big
         type, one flight a page, paging on its own; a QR in the corner follows
         the event on a phone. No sponsor is shown here (Manny 2026-11-14: one
         placement only, the HardPan app's GPS tee card). Nothing here writes to the database.
         ?every=N sets the seconds a page stays (3..60, default 10).
         ?checkin=1 (CI-FINAL, 2026-11-14) is the CHECK-IN BOARD instead: the
         table QR, who has arrived group by group, a Just arrived strip. It
         reads arrivals only - no payment status is read or shown - and writes
         nothing either.
         PO (2026-11-14): once the organizer posts results, the first page is
         RESULTS - places per flight, skins, KPs and long drive, card by card -
         read from tournaments/<code>/prizeResults through tournament-prizes.js. -->
    <link rel="icon" href="tournament-icon-192.png" type="image/png">
    <script src="./firebase-app-compat.js"></script>
    <script src="./firebase-database-compat.js"></script>
    <script src="./firebase-auth-compat.js"></script>
    <script src="handicap.js"></script>
    <script src="payouts.js"></script>
    <script src="text-safe.js"></script>
    <script src="tournament-engine.js"></script>
    <script src="event-columns.js"></script>
    <!-- PO (2026-11-14): the posted prize results, read with the same builder as the recap. -->
    <script src="skins.js"></script>
    <script src="tournament-prizes.js"></script>
    <script src="./qrcode.min.js"></script>
    <style>
        :root { --bg: #0b1d16; --panel: #10281f; --line: rgba(255,255,255,.12); --ink: #ffffff; --mute: #a9c2b6; --lime: #d4f28a; --red: #ff6b6b; --live: #c0392b; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
        body { display: flex; flex-direction: column; padding: 2.2vh 3vw 1.6vh; }
        .hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 2vw; border-bottom: 2px solid var(--line); padding-bottom: 1.2vh; }
        .ev { font-size: 4.2vh; font-weight: 800; line-height: 1.1; letter-spacing: -.01em; }
        .sub { font-size: 2.3vh; color: var(--mute); margin-top: .6vh; }
        .sub b { color: var(--lime); font-weight: 700; }
        .liv { display: flex; align-items: center; gap: 1vw; font-size: 2.3vh; color: var(--mute); white-space: nowrap; }
        .liv .pill { background: var(--live); color: #fff; font-weight: 800; font-size: 1.9vh; padding: .3vh 1vw; border-radius: .8vh; letter-spacing: .06em; }
        .liv.stale .pill { background: #6b5d1a; }
        .main { flex: 1; min-height: 0; display: flex; gap: 2vw; padding-top: 1.4vh; }
        .board { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .ttl { display: flex; justify-content: space-between; align-items: baseline; font-size: 2.6vh; color: var(--mute); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 0 0 .8vh; }
        .ttl .n { color: var(--lime); }
        .row { display: grid; grid-template-columns: minmax(44px, 6vw) minmax(0, 1fr) minmax(56px, 10vw) minmax(64px, 12vw); align-items: center; padding: .55vh 1vw; border-top: 1px solid var(--line); font-size: 3.9vh; line-height: 1.1; }
        .row.h { font-size: 2vh; color: var(--mute); letter-spacing: .1em; text-transform: uppercase; border-top: 0; padding-bottom: .4vh; }
        .row .pos { font-weight: 800; color: var(--mute); }
        .row.lead .pos { color: var(--lime); }
        .row .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row .nm small { font-size: .55em; color: var(--mute); font-weight: 600; margin-left: .6em; }
        .row .nm2 { display: block; font-size: 1.9vh; color: var(--mute); font-weight: 500; line-height: 1.15; margin-top: .2vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row .th { text-align: center; color: var(--mute); }
        .row .tp { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
        /* UNDER PAR IS RED, nothing else is coloured (Manny 2026-11-14: "red means under par and
           just keep everything else as the same color - white number with the green background"). */
        .row .tp.under { color: var(--red); }
        /* THE EVENT PAGES (MR-FINAL): a column a round, a total, to par. --rn is the round count. */
        .row.ev { grid-template-columns: minmax(44px, 6vw) minmax(0, 1fr) repeat(var(--rn, 2), minmax(64px, 8vw)) minmax(64px, 8vw) minmax(64px, 12vw); }
        .row .rd, .row .tot { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
        .row .rd small { display: block; font-size: .5em; color: var(--mute); font-weight: 600; line-height: 1; }
        .empty { color: var(--mute); font-size: 3vh; padding: 4vh 1vw; }
        /* The QR lives in the footer's right end (the table has the whole width). */
        .ftq { display: flex; align-items: center; gap: 1vw; }
        .qr { background: #fff; padding: .6vh; border-radius: 1vh; }
        .qr canvas, .qr img { display: block; width: 8.5vh !important; height: 8.5vh !important; }
        .qrt { font-size: 1.8vh; color: var(--mute); text-align: left; line-height: 1.3; }
        .qrt b { display: block; color: var(--ink); font-size: 2vh; }
        .ft { display: flex; align-items: center; justify-content: space-between; gap: 2vw; border-top: 2px solid var(--line); padding-top: .9vh; font-size: 2.1vh; color: var(--mute); }
        .ftl { display: flex; flex-direction: column; gap: .4vh; }
        .wait { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.6vh; }
        .wait .w1 { font-size: 6vh; font-weight: 800; }
        .wait .wi { font-size: 2.8vh; color: var(--mute); }
        .wait .w2 { font-size: 2.2vh; color: var(--mute); }
        /* The field while waiting (Manny 2026-11-12): one line a team, board type. */
        .wait .wl { width: 100%; text-align: left; margin: .6vh 0; }
        .wait .wt { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr) auto; gap: 1.6vw; align-items: baseline; padding: .55vh 1vw; border-top: 1px solid var(--line); font-size: 3.9vh; line-height: 1.1; }
        .wait .wt .a { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34vw; }
        .wait .wt .b { color: var(--mute); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .wait .wt .c { font-weight: 800; color: var(--lime); white-space: nowrap; }
        @media (max-width: 700px) {
            html, body { overflow: auto; height: auto; }
            body { padding: 10px 12px 16px; min-height: 100vh; }
            .qr { display: none; }
            .ev { font-size: 22px; } .sub, .liv, .ttl, .ft { font-size: 12px; }
            .row { font-size: 18px; padding: 6px 4px; grid-template-columns: 32px minmax(0, 1fr) 44px 56px; }
            .row.h { font-size: 11px; letter-spacing: .04em; }
            .row .nm2 { font-size: 11px; }
            .qr canvas, .qr img { width: 72px !important; height: 72px !important; }
            .qrt b { font-size: 12px; } .qrt { font-size: 11px; }
            .dots i { width: 14px; height: 4px; }
            .hd { flex-wrap: wrap; align-items: flex-start; }
        }
        @media (max-width: 480px) {
            .row { grid-template-columns: 32px minmax(0, 1fr) 56px; }
            .row .th { display: none; }
        }
        /* VETERANS A (ADVISOR-20261115-1647): the opening ceremony page (a flag drawn in CSS)
           and the branch leaderboard page. Shown only when the event's switches are on. */
        .cer { flex: 1; display: flex; align-items: center; gap: 4vw; padding: 2vh 2vw; }
        .cer .flag { flex: 0 0 26vw; aspect-ratio: 19/10; position: relative; border-radius: .6vh; box-shadow: 0 1vh 3vh rgba(0,0,0,.4); overflow: hidden; background: #fff; }
        /* The flag as it is specified (Executive Order 10834): hoist 1 : fly 1.9, 13 stripes (7 red, 6 white), the canton 0.4 of the fly
           wide and 7 stripes tall, 50 stars in 9 rows of 6 and 5 on the canton's 10 x 12 grid, star diameter 0.0616 of the hoist.
           Inline SVG built by vetFlagSvg(); was a CSS drawing with 29 stars (ADVISOR-20261115-1738). */
        .cer .flag svg { display: block; width: 100%; height: 100%; }
        .cer .flag .sp.r { fill: #b22234; } .cer .flag .sp.w { fill: #fff; } .cer .flag .cn { fill: #3c3b6e; } .cer .flag .st { fill: #fff; }
        .cer .k { font-size: 2.2vh; font-weight: 800; letter-spacing: .14em; color: var(--lime); text-transform: uppercase; }
        .cer .t { font-size: 6.4vh; font-weight: 800; line-height: 1.08; margin: .8vh 0 1.4vh; letter-spacing: -.01em; }
        .cer .s { font-size: 3.4vh; line-height: 1.3; }
        .cer .s2 { font-size: 2.4vh; color: var(--mute); margin-top: 1.4vh; }
        .cer .s3 { font-size: 2vh; color: var(--mute); margin-top: 3vh; }
        .row.br { grid-template-columns: minmax(44px, 6vw) minmax(0, 1fr) minmax(0, 1fr) minmax(64px, 9vw) minmax(64px, 10vw) minmax(64px, 12vw); }
        .row .bt { display: inline-block; width: .8vw; height: 3.4vh; border-radius: .3vw; vertical-align: middle; margin-right: 1vw; background: #4b5a52; }
        .bt.army { background: #6b7a2a; } .bt.navy { background: #1d3357; } .bt.af { background: #2b4b9b; } .bt.usmc { background: #9b1e2a; } .bt.uscg { background: #1f4e79; } .bt.ussf { background: #2a2f5b; }
        .row .ld { color: var(--mute); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row .av { text-align: right; font-weight: 800; font-size: 1.2em; font-variant-numeric: tabular-nums; color: var(--lime); } .row .av.under { color: var(--red); }
        @media (max-width: 700px) { .cer { flex-direction: column; align-items: flex-start; } .cer .flag { flex: none; width: 60vw; } .cer .t { font-size: 26px; } .cer .s { font-size: 16px; } .row.br { grid-template-columns: 32px minmax(0, 1fr) 44px 56px; } .row .ld, .row .br .c { display: none; } }
        .dots { display: flex; gap: .8vw; }
        .dots i { width: 3.2vw; height: .9vh; border-radius: .5vh; background: rgba(255,255,255,.18); }
        .dots i.on { background: var(--lime); }
        .err { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 3.4vh; color: var(--mute); text-align: center; padding: 4vw; }
        /* CHECK-IN BOARD (CI-FINAL, 2026-11-14): ?tourney=CODE&checkin=1. Who has
           arrived, group by group, beside the table QR. No payment status, ever. */
        .ci-clock { font-size: 5.4vh; font-weight: 800; font-variant-numeric: tabular-nums; }
        .ci-side { flex: 0 0 25vw; background: var(--panel); border: 1px solid var(--line); border-radius: 1.6vh; display: flex; flex-direction: column; align-items: center; padding: 2.4vh 1.4vw; text-align: center; }
        .ci-side .ci-qr { background: #fff; padding: 1.2vh; border-radius: 1vh; }
        .ci-side .ci-qr canvas, .ci-side .ci-qr img { width: 29vh !important; height: 29vh !important; display: block; }
        .ci-scan { font-size: 2.7vh; font-weight: 800; margin-top: 1.8vh; line-height: 1.25; }
        .ci-url { font-size: 1.6vh; color: var(--mute); margin-top: .8vh; word-break: break-all; }
        .ci-big { margin-top: auto; font-size: 9.5vh; font-weight: 800; color: var(--lime); line-height: 1; font-variant-numeric: tabular-nums; }
        .ci-bigsub { font-size: 2.3vh; margin-top: .8vh; }
        .ci-right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .ci-fl { font-size: 2.3vh; font-weight: 800; letter-spacing: .12em; color: var(--lime); text-transform: uppercase; margin: .2vh 0 .8vh; }
        .ci-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.4vh 1vw; margin-bottom: 1.6vh; }
        .ci-g { border: 2px solid var(--line); border-radius: 1.4vh; padding: 1vh .9vw; background: var(--panel); min-width: 0; }
        .ci-g.full { border-color: var(--lime); }
        .ci-gh { display: flex; justify-content: space-between; gap: .6vw; font-size: 2vh; font-weight: 800; margin-bottom: .6vh; }
        .ci-gh .l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ci-gh .n { color: var(--mute); white-space: nowrap; }
        .ci-g.full .ci-gh .n { color: var(--lime); }
        .ci-p { display: flex; justify-content: space-between; gap: .6vw; font-size: 2.5vh; line-height: 1.45; }
        .ci-p .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ci-p .t { color: var(--lime); font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .ci-p.no, .ci-p.no .t { color: rgba(255,255,255,.45); font-weight: 600; }
        .ci-strip { margin-top: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 1vh; padding: 1vh 1vw; font-size: 2.2vh; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ci-strip b { color: var(--lime); margin-left: 1.4vw; }
        .ci-strip span { color: var(--ink); }
        .ci-page { font-size: 1.8vh; color: var(--mute); text-align: right; margin-top: .6vh; }
        @media (max-width: 700px) {
            .ci-main { flex-direction: column; }
            .ci-side { flex: 0 0 auto; }
            .ci-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .ci-p { font-size: 15px; } .ci-gh { font-size: 13px; } .ci-big { font-size: 48px; }
            .ci-side .ci-qr canvas, .ci-side .ci-qr img { width: 160px !important; height: 160px !important; }
        }
        .hide { display: none !important; }
        /* PO: the results page. Three cards side by side, 16:9. */
        .res { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.6vw; }
        .res .col { background: var(--panel); border: 1px solid var(--line); border-radius: 1.6vh; padding: 1.8vh 1.4vw; min-width: 0; overflow: hidden; }
        .res .ch { font-size: 2.6vh; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--lime); margin-bottom: .8vh; }
        .res .fh { font-size: 1.9vh; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin: 1vh 0 .3vh; }
        .res .rr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 1vw; padding: .7vh 0; border-top: 1px solid var(--line); font-size: 3.1vh; line-height: 1.1; }
        .res .rr .a { font-weight: 800; color: var(--lime); min-width: 3.2vw; }
        .res .rr .b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .res .rr .b small { font-size: .6em; color: var(--mute); font-weight: 600; margin-left: .4em; }
        .res .rr .b small.under { color: var(--red); }
        .res .rr .c { font-weight: 800; text-align: right; white-space: nowrap; }
        .res .ring { display: inline-flex; align-items: center; justify-content: center; width: 4.4vh; height: 4.4vh; font-weight: 800; font-size: 2.4vh; }
        .res .ring.birdie { box-shadow: inset 0 0 0 2px var(--red); border-radius: 50%; }
        .res .ring.eagle { box-shadow: inset 0 0 0 2px var(--red), inset 0 0 0 4px var(--panel), inset 0 0 0 6px var(--red); border-radius: 50%; }
        .res .ring.bogey { box-shadow: inset 0 0 0 2px var(--ink); border-radius: 3px; }
        .res .ring.double { box-shadow: inset 0 0 0 2px var(--ink), inset 0 0 0 4px var(--panel), inset 0 0 0 6px var(--ink); border-radius: 3px; }
        .res .more, .res .none { font-size: 2vh; color: var(--mute); padding-top: .8vh; }
        .res .note { font-size: 2.1vh; color: var(--mute); margin-top: 2vh; line-height: 1.35; }
        @media (max-width: 700px) { .res { grid-template-columns: 1fr; } .res .rr { font-size: 16px; } .res .ch { font-size: 13px; } .res .fh, .res .more, .res .none, .res .note { font-size: 12px; } .res .ring { width: 26px; height: 26px; font-size: 13px; } }
    </style>
</head>
<body>
    <div class="hd">
        <div><div class="ev" id="tv-name">HardPan Tournaments</div><div class="sub" id="tv-sub"></div></div>
        <div class="liv" id="tv-live" style="display:none;"><span class="pill">LIVE</span><span id="tv-updated"></span></div>
    </div>
    <div class="main" id="tv-main">
        <div class="board" id="tv-board"><div class="err" id="tv-msg">Loading the board…</div></div>
    </div>
    <div class="ft" id="tv-foot" style="display:none;">
        <span class="ftl"><span id="tv-page-label"></span><span id="tv-next-label"></span></span>
        <span class="dots" id="tv-dots"></span>
        <span class="ftq" id="tv-side"><span class="qr" id="tv-qr"></span><span class="qrt"><b>Follow on your phone</b><span id="tv-follow"></span></span></span>
    </div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyB5sBBd-pdnrdp-nu60lHTMBUUd5Kwjfyk",
      authDomain: "golfapp-9fb21.firebaseapp.com",
      databaseURL: "https://golfapp-9fb21-default-rtdb.firebaseio.com",
      projectId: "golfapp-9fb21",
      storageBucket: "golfapp-9fb21.firebasestorage.app",
      messagingSenderId: "761739328763",
      appId: "1:761739328763:web:08ac41351578565c94045e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    // VETERANS A DEMO (preview only): ?tourney=VETDEMO&demo=veterans reads veterans-demo.js (fake data) instead
    // of the database; nothing is written. Without ?demo=veterans this block does nothing (see tournament.html).
    if (new URLSearchParams(window.location.search).get('demo') === 'veterans') {
        const realRef = db.ref.bind(db);
        const give = (cb) => {
            const go = () => cb({ val: () => JSON.parse(JSON.stringify(window.VETERANS_DEMO || null)), exists: () => !!window.VETERANS_DEMO });
            if (window.VETERANS_DEMO) { go(); return; }
            const sc = document.createElement('script'); sc.src = 'veterans-demo.js'; sc.onload = go; sc.onerror = () => cb({ val: () => null, exists: () => false }); document.head.appendChild(sc);
        };
        db.ref = function (p) {
            if (!/^tournaments\/VETDEMO$/.test(String(p || ''))) return realRef(p);
            return { on: (ev, cb) => { if (ev === 'value') give(cb); }, off() {}, once: () => new Promise((res) => give(res)) };
        };
    }

    const params = new URLSearchParams(window.location.search);
    const CODE = String(params.get('tourney') || '').trim().toUpperCase();
    const EVERY = Math.min(60, Math.max(3, parseInt(params.get('every'), 10) || 10)) * 1000;
    const PAGE_ROWS = 8;
    // The follow link is the public board on the product's own host, whatever
    // host this TV page was opened from (a preview, the Pages host).
    // The one front door is hardpangolf.com (Manny 2026-11-15 9:18 AM: "TV footer to hardpangolf.com"); the
    // old tournaments host still serves the same page, so printed QRs keep working.
    const FOLLOW_URL = 'https://hardpangolf.com/tournament?tourney=' + encodeURIComponent(CODE);
    const FOLLOW_TEXT = 'hardpangolf.com';
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    let data = null, pages = [], pageIdx = 0, timer = null, updatedAt = null;

    function toParText(r) { return !r.hasScores ? '—' : (r.toPar === 0 ? 'E' : (r.toPar > 0 ? '+' + r.toPar : String(r.toPar))); }
    function toParClass(r) { return !r.hasScores ? '' : (r.toPar < 0 ? 'under' : (r.toPar > 0 ? 'over' : '')); }
    function clock(d) { let h = d.getHours(), m = d.getMinutes(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ap; }
    function fmtName(s) { return String(s || '').replace(/^\w/, (c) => c.toUpperCase()); }

    // ONE PAGE PER FLIGHT (TV A). No flights: pages of ten. A multi-round event
    // pages its combined standings when the engine allows them, otherwise one
    // page per round; the sentence the engine gives is shown, never a blank.
    function buildPages(d) {
        const out = [];
        const flights = d.flights || {};
        const fids = Object.keys(flights).sort((a, b) => (flights[a].createdAt || 0) - (flights[b].createdAt || 0) || String(flights[a].name || '').localeCompare(String(flights[b].name || '')));
        const multi = typeof isMultiRound === 'function' && isMultiRound(d);
        const selections = [];
        if (multi) {
            const ev = resolveLeaderboardView(d, 'event', null);
            const title = ev.title || 'Event total';
            const fam = typeof aggregateFamily === 'function' ? aggregateFamily(d) : null;
            const can = (b) => typeof aggregateAvailability === 'function' && aggregateAvailability(d, { basis: b }).available;
            // BOTH BASES ON THE ROTATION (Manny's per-file OK 2026-11-15; switch on
            // everywhere 09:18): the scored basis first, the other after it. An all-gross
            // event: Gross (as scored) then Net when every round can allocate; an all-net
            // event: Net (as scored) then Gross; a Gross/Net mix: Gross then Net, the
            // engine combining on the explicit basis. A round with no real stroke index
            // keeps the Net pages off the rotation.
            if (ev.available && fam === 'individual:net') {
                selections.push({ sel: 'event', title: title + ' \u00b7 Net', display: 'net' });
                selections.push({ sel: 'event', title: title + ' \u00b7 Gross', opts: { basis: 'gross' }, display: 'gross' });
            } else if (ev.available || can('gross')) {
                selections.push({ sel: 'event', title: title + ' \u00b7 Gross', opts: ev.available ? undefined : { basis: 'gross' }, display: 'gross' });
                if (can('net')) selections.push({ sel: 'event', title: title + ' \u00b7 Net', opts: { basis: 'net' }, display: 'net' });
            } else Object.keys(d.rounds || {}).forEach((rid) => selections.push({ sel: rid, title: (d.rounds[rid] && d.rounds[rid].name) || 'Round' }));
        } else selections.push({ sel: null, title: '' });
        selections.forEach(({ sel, title, opts, display }) => {
            const scopes = fids.length ? fids.map((f) => ({ fid: f, name: flights[f].name || 'Flight' })) : [{ fid: null, name: '' }];
            scopes.forEach(({ fid, name }) => {
                const v = resolveLeaderboardView(d, sel, fid, opts);
                const net = display === 'net';
                const cols = v.kind === 'event' && typeof eventRoundColumns === 'function' ? eventRoundColumns(d, null, net ? { basis: 'net' } : opts) : null;
                const rows = v.available ? v.rows : [];
                const label = [title, name].filter(Boolean).join(' · ');
                if (!rows.length) { out.push({ kind: 'board', label: label || 'Leaderboard', display: label || 'Leaderboard', rows: [], thruHead: v.kind === 'event' ? 'Rds' : 'Thru', cols, net, note: v.available ? 'No scores yet.' : (v.reason || '') }); return; }
                // EIGHT ROWS A PAGE: ten with the names line under each team ran
                // 117 px past the footer at 720p (measured); eight fit with room.
                for (let i = 0; i < rows.length; i += PAGE_ROWS) {
                    const chunk = rows.slice(i, i + PAGE_ROWS);
                    const range = i + 1 + '\u2013' + (i + chunk.length) + ' of ' + rows.length;
                    // (#12) the page's name in the footer: the flight (and its range
                    // when it runs past ten), or the range alone when there are no flights.
                    const display = label ? (rows.length > PAGE_ROWS ? label + ' \u00b7 ' + range : label) : range;
                    out.push({ kind: 'board', key: label + '#' + i, label: label || 'Leaderboard', display, rows: chunk, from: i + 1, to: i + chunk.length, of: rows.length, thruHead: v.kind === 'event' ? 'Rds' : 'Thru', cols, net });
                }
            });
        });
        // NOTHING SCORED YET: one Waiting page instead of a board of dashes.
        // The first score that lands rebuilds the pages and the table appears.
        const anyScore = out.some((p) => p.kind === 'board' && p.rows.some((r) => r.hasScores));
        // (Manny 2026-11-12) The waiting page lists the field, a line a team,
        // eight a page like the board, turning on the same timer.
        let pages = out;
        if (!anyScore) {
            const field = waitingField(d);
            pages = [];
            if (!field.length) pages.push({ kind: 'waiting', key: 'waiting#0', label: 'waiting', display: 'Waiting for first scores', lines: [] });
            for (let i = 0; i < field.length; i += PAGE_ROWS) {
                const chunk = field.slice(i, i + PAGE_ROWS);
                const range = field.length > PAGE_ROWS ? ' \u00b7 ' + (i + 1) + '\u2013' + (i + chunk.length) + ' of ' + field.length : '';
                pages.push({ kind: 'waiting', key: 'waiting#' + i, label: 'waiting', display: 'Waiting for first scores' + range, lines: chunk });
            }
        }

        const post = window.TournamentPrizes ? TournamentPrizes.posted(d) : null;
        if (post) pages.unshift({ kind: 'results', key: 'results', label: 'Results', display: 'Results', post: post });
        return vetPages(d, pages);   // VETERANS A: the ceremony first and the branch page, each only when its switch is on
    }

    // THE GOLFERS UNDER A TEAM. A team row carries its players; a player row is
    // the golfer already. Long lists fall back to "First L." so a row stays one line.
    function teamNames(r) {
        if (!data || r.entryType !== 'team') return '';
        const t = (data.teams || {})[r.entryKey] || {};
        const names = (t.players || []).map((p) => String(p || '').trim()).filter(Boolean);
        if (!names.length) return '';
        const full = names.join(' \u00b7 ');
        if (full.length <= 60) return full;
        return names.map((n) => { const w = n.split(/\s+/); return w.length > 1 ? w[0] + ' ' + w[w.length - 1].charAt(0) + '.' : n; }).join(' \u00b7 ');
    }
    // THE FIELD WHILE WAITING. A team event lists its teams (name, golfers as
    // stored, start hole); an individual event its scoring groups, or its
    // golfers when there are no groups. Shotgun: the hole the record holds
    // (teams/teamN/startingHole, "1", "1A"...), left off when it is not set.
    // Tee time: hole 1 for everyone, as the setup screen states the rule.
    function waitingField(d) {
        const shotgun = d.startType === 'shotgun';
        const hole = (h) => shotgun ? (String(h || '').trim() ? 'Hole ' + String(h).trim() : '') : 'Hole 1';
        const teams = Object.values(d.teams || {}).filter((t) => t && t.num).sort((a, b) => a.num - b.num);
        if (teams.length) return teams.map((t) => ({ name: t.name || ('Team ' + t.num), who: (t.players || []).map((p) => String(p || '').trim()).filter(Boolean).join(', '), hole: hole(t.startingHole) }));
        const players = d.players || {};
        const pname = (pid) => String((players[pid] && players[pid].name) || '').trim();
        const groups = Object.keys(d.scoringGroups || {}).map((k) => d.scoringGroups[k]).filter(Boolean);
        if (groups.length) return groups.map((g) => ({ name: g.name || 'Group', who: (g.playerIds || []).map(pname).filter(Boolean).join(', '), hole: hole(g.startingHole) }));
        return Object.keys(players).map(pname).filter(Boolean).map((n) => ({ name: n, who: '', hole: hole('') }));
    }
    function startInfo(d) {
        const parts = [];
        if (d.startType === 'shotgun') parts.push('Shotgun start');
        if (d.startTime && /^\d{1,2}:\d{2}$/.test(d.startTime)) { const [hh, mm] = d.startTime.split(':').map(Number); const dt = new Date(); dt.setHours(hh, mm, 0, 0); parts.push(clock(dt)); }
        const n = typeof competitorCount === 'function' ? competitorCount(d) : Object.keys(d.teams || {}).length;
        const noun = typeof competitorNoun === 'function' ? competitorNoun(d, n) : (n === 1 ? 'team' : 'teams');
        if (n) parts.push(n + ' ' + noun);
        return parts.join(' \u00b7 ');
    }
    function rankCounts(rows) { const c = {}; rows.forEach((r) => { if (r.rank) c[r.rank] = (c[r.rank] || 0) + 1; }); return c; }


    // ===== VETERANS A (ADVISOR-20261115-1647-OK-veterans-A) ===============================================
    // Two pages, each only when the event's own switch is on (tournaments/<code>/veterans, see tournament.html):
    //  - ceremony: the first page, held until a tap / key or the set minutes pass (default 10), then the rotation
    //    continues from the next page (the branch board when branch teams are on). A flag drawn in CSS only.
    //  - branch: one row a branch (Army, Navy, Air Force, Marines, Coast Guard, Space Force): the leading team,
    //    teams, best to par, average to par; read from the rows the board already computed, under par red.
    const VET_NAMES = { army: 'Army', navy: 'Navy', af: 'Air Force', usmc: 'Marines', uscg: 'Coast Guard', ussf: 'Space Force' };
    let ceremonyDone = false, ceremonyShownAt = 0;
    function vetOf(d) { return (d && d.veterans && typeof d.veterans === 'object') ? d.veterans : {}; }
    function vetStandings(rows, teams) {
        const by = {};
        (rows || []).forEach((r) => {
            if (!r || r.entryType === 'player' || r.entryType === 'event') return;
            const tm = (teams || {})['team' + Number(r.num)]; const b = tm && VET_NAMES[tm.branch] ? tm.branch : '';
            if (!b) return;
            const s = by[b] = by[b] || { branch: b, name: VET_NAMES[b], teams: 0, scored: 0, best: null, bestTeam: '', sum: 0 };
            s.teams++;
            if (!r.hasScores) return;
            s.scored++; s.sum += r.toPar;
            if (s.best === null || r.toPar < s.best) { s.best = r.toPar; s.bestTeam = r.teamName || ''; }
        });
        return Object.keys(by).map((k) => { const s = by[k]; s.avg = s.scored ? s.sum / s.scored : null; return s; })
            .sort((a, b) => ((a.avg === null) - (b.avg === null)) || (a.avg - b.avg) || ((a.best === null ? 99 : a.best) - (b.best === null ? 99 : b.best)) || a.name.localeCompare(b.name));

        const v = vetOf(d);

        if (v.branchTeams === true) {

            const rows = first ? pages.filter((p) => p.kind === 'board' && p.label === first.label).reduce((a, p) => a.concat(p.rows), []) : [];
            const teamRows = rows.length ? rows : Object.keys(d.teams || {}).map((k) => ({ num: (d.teams[k] || {}).num, teamName: (d.teams[k] || {}).name, hasScores: false, toPar: 0 }));
            const page = { kind: 'branch', key: 'branch', label: 'Branch leaderboard', display: 'Branch leaderboard', rows: vetStandings(teamRows, d.teams) };
            const at = first ? pages.indexOf(first) + 1 : pages.length;

                // THE EVENT PAGE (MR-FINAL, Manny 2026-11-14): R1 / R2 / Tot replace the Rds

                    const name = '<span class="nm"><span class="nm1">' + esc(r.teamName || r.name || '') + tie + '</span>' + (who ? '<span class="nm2">' + esc(who) + '</span>' : '') + strokesLine + '</span>';
                    if (cols) {

                        const cells = cols.columns.map((c) => { const x = mine[c.rid]; return '<span class="rd">' + (x && x.hasScores ? esc(p.net ? x.net : x.strokes) + (x.complete ? '' : '<small>thru ' + esc(x.thru) + '</small>') : '\u2013') + '</span>'; }).join('');
                        h += '<div class="row' + (r.rank === 1 ? ' lead' : '') + ev + '"><span class="pos">' + esc(r.rank || '-') + '</span>' + name + cells + '<span class="tot">' + (r.hasScores ? esc(p.net ? r.strokes - received : r.strokes) : '\u2013') + '</span><span class="tp ' + toParClass(r) + '">' + esc(toParText(r)) + '</span></div>';
                    } else {
                        const thru = p.thruHead === 'Rds' ? (r.hasScores ? r.roundsComplete + '/' + r.countableRounds : '-') : (r.hasScores ? r.thru : '-');
                        h += '<div class="row' + (r.rank === 1 ? ' lead' : '') + '"><span class="pos">' + esc(r.rank || '-') + '</span>' + name + '<span class="th">' + esc(thru) + '</span><span class="tp ' + toParClass(r) + '">' + esc(toParText(r)) + '</span></div>';

        const n = pages.length;

        const next = pages[(pageIdx + 1) % n];
        $('tv-page-label').textContent = n > 1 ? (p.display + ' · ' + (EVERY / 1000) + ' s a page') : p.display;

    // THE RESULTS PAGE: what the organizer posted, card by card. Amounts are
    // the posted ones; the word (pro shop credit or cash) follows the event's
    // switch, said once in the KPs card and on every amount there.
    const RES_ROWS = 11;   // measured: 11 rows and two flight heads fit a 720p card
    function resultsHtml(post, d) {
        const amt = (v) => esc(v > 0 ? TournamentPrizes.money(v) : 'Trophy');
        const ord = (n) => esc(typeof ordinal === 'function' ? ordinal(n) : String(n));
        const tp = (v) => typeof v !== 'number' ? '' : ' <small class="' + (v < 0 ? 'under' : '') + '">' + esc(v === 0 ? 'E' : (v > 0 ? '+' + v : String(v))) + '</small>';
        const ring = (sc, par) => '<span class="ring ' + TournamentSkins.scoreMark(sc, par) + '">' + esc(sc) + '</span>';
        const capped = (rows) => rows.slice(0, RES_ROWS).join('') + (rows.length > RES_ROWS ? '<div class="more">+' + (rows.length - RES_ROWS) + ' more on the recap</div>' : '');
        let places = '';
        const placeRows = [];
        post.places.forEach((g) => {
            if (!g.rows.length) return;
            if (g.flight) placeRows.push('<div class="fh">' + esc(g.flight) + '</div>');
            g.rows.forEach((r) => placeRows.push('<div class="rr"><span class="a">' + ord(r.rank) + '</span><span class="b">' + esc(r.name) + tp(r.toPar) + '</span><span class="c">' + amt(r.amount) + '</span></div>'));
        });
        places = placeRows.length ? capped(placeRows) : '<div class="none">No places posted.</div>';
        const skinRows = [];
        const multi = post.skins.rounds.length > 1;
        post.skins.rounds.forEach((rd) => rd.won.forEach((x) => skinRows.push('<div class="rr"><span class="a">' + ring(x.score, x.par) + '</span><span class="b">' + esc(x.name) + ' <small>' + esc((multi && rd.name ? rd.name.charAt(0) : '') + x.hole) + (x.carriedIn ? ' · x' + esc(x.skins) : '') + '</small></span><span class="c">' + (x.amount > 0 ? amt(x.amount) : '') + '</span></div>')));
        const skins = skinRows.length ? capped(skinRows) : '<div class="none">No skins won.</div>';
        const kpRows = post.contests.rows.map((c) => '<div class="rr"><span class="a">' + esc(c.hole) + '</span><span class="b">' + esc(c.name) + ' <small>' + esc(c.value) + '</small></span><span class="c">' + (c.amount > 0 ? amt(c.amount) : '') + '</span></div>');
        const credit = TournamentPrizes.typeOf(d) === 'credit';
        const host = post.host || TournamentPrizes.hostOf(d);
        const note = '<div class="note">All amounts are ' + esc(TournamentPrizes.wordOf(d)) + (credit && host ? ' at the ' + esc(host) + ' pro shop' : '') + '.<br>See yours: open the recap on your phone, tap your name.</div>';
        const kps = (post.contests.multi ? '<div class="none">Contest holes are for one-round events.</div>' : (kpRows.length ? capped(kpRows) : '<div class="none">No contest winners posted.</div>')) + note;
        return '<div class="res" id="tv-results"><div class="col"><div class="ch">Places</div>' + places + '</div><div class="col"><div class="ch">Skins</div>' + skins + '</div><div class="col"><div class="ch">KPs &amp; long drive</div>' + kps + '</div></div>';
    }

    function renderHeader(d) {

        const noun = typeof competitorNoun === 'function' ? competitorNoun(d, n) : (n === 1 ? 'team' : 'teams');
        $('tv-sub').innerHTML = [esc(d.courseName || ''), esc(fmtName(d.format || '')), n ? n + ' ' + esc(noun) : ''].filter(Boolean).join(' · ');

    let qrDrawn = false;

    function onSnapshot(snap) {

    // ===== CHECK-IN BOARD (CI-FINAL, approved 2026-11-14) =====================
    // tournament-tv.html?tourney=CODE&checkin=1, opened from the Desk. The names
    // are tournaments/<code>/checkin (the list the organizer's Desk keeps); each
    // arrival is registrations/<code>/<entryId>/arrivedAt, read one entry at a
    // time. That read is refused for anyone but the owner until the check-in
    // rules candidate is published; the board then says arrivals cannot be read
    // rather than showing everyone as not arrived. This page reads arrivedAt and
    // the record, and NOTHING about payment: no paid key is ever read here.
    // Writes nothing.
    // THE SWITCH: the same CHECKIN_LIVE as tournament.html (see its comment);
    // off until the check-in rules candidate is published. Off, ?checkin=1 is
    // the leaderboard TV it always was. Flip both files in the publish commit.
    // Flipped ON 2026-11-15 (Manny's go 09:19 "Go check-in"; merged only after the combined rules candidate is live, RULES-READY-20261115).
    const CHECKIN_LIVE = true;
    const CHECKIN = CHECKIN_LIVE && params.get('checkin') === '1';
    const CHECKIN_URL = 'https://hardpangolf.com/tournament?tourney=' + encodeURIComponent(CODE) + '&checkin=1';
    const CHECKIN_TEXT = 'hardpangolf.com/tournament?tourney=' + CODE + '&checkin=1';
    const CI_GROUPS_PAGE = 8;
    // CHECKIN-ROSTER-BEGIN (byte-identical in tournament-tv.html: the two screens
    // a golfer and the clubhouse read must agree on who is in which group, and
    // tournament_checkin_test.js holds the two copies equal).
    function checkinClock(ms) {
        const d = new Date(Number(ms));
        const h = d.getHours() % 12 || 12, m = d.getMinutes();
        return h + ':' + (m < 10 ? '0' : '') + m;
    }
    // The check-in list from the record alone: tournaments/<code>/checkin for the
    // names, the teams / scoring groups for where each one starts, flights for
    // the order. arrivals is { entryId: ms } (whatever could be read). Pure.
    function checkinRoster(data, arrivals) {
        data = data || {};
        arrivals = arrivals || {};
        const index = (data.checkin && typeof data.checkin === 'object') ? data.checkin : {};
        const shotgun = data.startType === 'shotgun';
        const flights = data.flights || {};
        const fids = Object.keys(flights).sort((a, b) => ((flights[a] || {}).createdAt || 0) - ((flights[b] || {}).createdAt || 0));
        const flightName = (fid) => (fid && flights[fid]) ? String(flights[fid].name || 'Flight') : '';
        const holeOf = (v) => { const h = String(v === undefined || v === null ? '' : v).trim(); return shotgun ? h : ''; };
        const holeRank = (h) => { const m = /^(\d+)\s*([A-Za-z]?)$/.exec(h || ''); return m ? Number(m[1]) * 100 + (m[2] ? m[2].toUpperCase().charCodeAt(0) - 64 : 0) : 100000; };
        const teams = data.teams || {};
        const players = data.players || {};
        let groups = data.scoringGroups || {};
        if (!Object.keys(groups).length) {
            const rounds = data.rounds || {};
            const rid = Object.keys(rounds).sort((a, b) => ((rounds[a] || {}).createdAt || 0) - ((rounds[b] || {}).createdAt || 0))
                .find((r) => rounds[r] && rounds[r].scoringGroups && Object.keys(rounds[r].scoringGroups).length);
            groups = rid ? rounds[rid].scoringGroups : {};
        }
        const gids = Object.keys(groups).sort((a, b) => ((groups[a] || {}).createdAt || 0) - ((groups[b] || {}).createdAt || 0));
        const groupOf = {}, posOf = {};
        gids.forEach((gid) => ((groups[gid] || {}).playerIds || []).forEach((pid, i) => { if (!(pid in groupOf)) { groupOf[pid] = gid; posOf[pid] = i; } }));
        const out = {}, byId = {};
        Object.keys(index).forEach((id) => {
            const e = index[id] || {};
            const name = String(e.name || '').trim();
            if (!name) return;
            let g = null;
            if (e.teamNum !== undefined && e.teamNum !== null && e.teamNum !== '') {
                const t = teams['team' + e.teamNum];
                if (!t) return;   // the team is no longer in the field
                const pos = (t.players || []).map((p) => String(p).trim().toLowerCase()).indexOf(name.toLowerCase());
                g = { key: 'team' + t.num, label: String(t.name || ('Team ' + t.num)), hole: holeOf(t.startingHole), fid: t.flightId, order: Number(t.num) || 0, pos: pos === -1 ? 99 : pos };
            } else if (e.playerId !== undefined && e.playerId !== null && e.playerId !== '') {
                const pid = String(e.playerId);
                const p = players[pid];
                if (!p || p.status === 'withdrawn') return;
                const gid = groupOf[pid];
                g = gid ? { key: gid, label: String(groups[gid].name || 'Group'), hole: holeOf(groups[gid].startingHole), fid: p.flightId, order: gids.indexOf(gid), pos: posOf[pid] }
                    : { key: 'nogroup', label: 'No group yet', hole: '', fid: p.flightId, order: 1e9, pos: 0 };
            } else return;
            const at = Number(arrivals[id]) > 0 ? Number(arrivals[id]) : 0;
            if (!out[g.key]) out[g.key] = { key: g.key, label: g.label, hole: g.hole, flightId: (g.fid && flights[g.fid]) ? g.fid : '', flight: flightName(g.fid), order: g.order, members: [], arrived: 0, total: 0 };
            const grp = out[g.key];
            const m = { id: id, name: name, arrivedAt: at, pos: g.pos, groupKey: g.key };
            grp.members.push(m);
            grp.total++;
            if (at) grp.arrived++;
            byId[id] = m;
        });
        const flightRank = (fid) => { const i = fids.indexOf(fid); return i === -1 ? fids.length : i; };
        const list = Object.keys(out).map((k) => out[k]);
        list.forEach((g) => g.members.sort((a, b) => (a.pos - b.pos) || a.name.localeCompare(b.name)));
        list.sort((a, b) => (flightRank(a.flightId) - flightRank(b.flightId)) || (shotgun ? holeRank(a.hole) - holeRank(b.hole) : 0) || (a.order - b.order) || a.label.localeCompare(b.label));
        const members = list.reduce((acc, g) => acc.concat(g.members), []);
        const recent = members.filter((m) => m.arrivedAt).sort((a, b) => b.arrivedAt - a.arrivedAt);
        const flightList = [];
        list.forEach((g) => { if (flightList.indexOf(g.flight) === -1) flightList.push(g.flight); });
        return { groups: list, groupsByKey: out, byId: byId, total: members.length, arrived: recent.length, recent: recent, flights: flightList };
    }
    // CHECKIN-ROSTER-END
    let ciArrivals = {}, ciRefused = false, ciPage = 0, ciTimer = null, ciQrDrawn = false;
    const ciWatching = {};
    function ciWatch() {
        const index = (data && data.checkin) || {};
        Object.keys(index).forEach((id) => {
            if (ciWatching[id]) return;
            ciWatching[id] = true;
            db.ref('registrations/' + CODE + '/' + id + '/arrivedAt').on('value', (snap) => {
                const v = Number(snap && snap.val());
                if (v > 0) ciArrivals[id] = v; else delete ciArrivals[id];
                renderCheckinBoard();
            }, () => { ciRefused = true; renderCheckinBoard(); });
        });
    }
    function ciStartText(d) {
        if (!d.startTime || !/^\d{1,2}:\d{2}$/.test(d.startTime)) return d.startType === 'shotgun' ? 'Shotgun' : '';
        const [hh, mm] = d.startTime.split(':').map(Number);
        const dt = new Date(); dt.setHours(hh, mm, 0, 0);
        return (d.startType === 'shotgun' ? 'Shotgun ' : 'Tee time ') + clock(dt);
    }
    function renderCheckinBoard() {
        const main = $('tv-main');
        if (!data) return;
        const r = checkinRoster(data, ciArrivals);
        $('tv-name').textContent = (data.name || 'Tournament') + ' \u00b7 Check in here';
        const size = r.groups.length ? (r.total + ' golfer' + (r.total === 1 ? '' : 's') + ', ' + r.groups.length + ' group' + (r.groups.length === 1 ? '' : 's')) : '';
        $('tv-sub').textContent = [data.courseName || '', ciStartText(data), size].filter(Boolean).join(' \u00b7 ');
        const pages = Math.max(1, Math.ceil(r.groups.length / CI_GROUPS_PAGE));
        if (ciPage >= pages) ciPage = 0;
        const shown = r.groups.slice(ciPage * CI_GROUPS_PAGE, (ciPage + 1) * CI_GROUPS_PAGE);
        const showFlights = r.flights.some(Boolean);
        let right = '';
        if (!r.total) right = '<div class="err" id="ci-empty">No names to check in yet. The list fills in as the organizer approves signups.</div>';
        else {
            let open = false, last = null;
            shown.forEach((g) => {
                if (!open || (showFlights && g.flight !== last)) {
                    if (open) right += '</div>';
                    if (showFlights) right += '<div class="ci-fl">' + esc(g.flight || 'No flight') + '</div>';
                    right += '<div class="ci-grid">';
                    open = true; last = g.flight;
                }
                const full = !ciRefused && g.total > 0 && g.arrived === g.total;
                const n = ciRefused ? '' : (full ? 'All here' : g.arrived + ' / ' + g.total);
                right += '<div class="ci-g' + (full ? ' full' : '') + '" data-group="' + esc(g.key) + '"><div class="ci-gh"><span class="l">' + esc(g.label + (g.hole ? ' \u00b7 Hole ' + g.hole : '')) + '</span><span class="n">' + esc(n) + '</span></div>'
                    + g.members.map((m) => '<div class="ci-p' + (m.arrivedAt ? '' : ' no') + '"><span class="nm">' + esc(m.name) + '</span><span class="t">' + (m.arrivedAt ? '\u2713' + esc(checkinClock(m.arrivedAt)) : (ciRefused ? '' : 'not yet')) + '</span></div>').join('')
                    + '</div>';
            });
            if (open) right += '</div>';
            if (pages > 1) right += '<div class="ci-page">Page ' + (ciPage + 1) + ' of ' + pages + '</div>';
            const recent = r.recent.slice(0, 5);
            right += '<div class="ci-strip" id="ci-strip">' + (ciRefused ? 'Arrivals cannot be read on this screen yet.'
                : ('Just arrived' + (recent.length ? recent.map((m) => '<b>' + esc(m.name) + ' <span>' + esc(checkinClock(m.arrivedAt)) + '</span></b>').join('') : ' <b>no one yet</b>'))) + '</div>';
        }
        const big = ciRefused ? '<div class="ci-big">' + r.total + '</div><div class="ci-bigsub">golfers</div>'
            : '<div class="ci-big" id="ci-count">' + r.arrived + ' / ' + r.total + '</div><div class="ci-bigsub">arrived \u00b7 ' + (r.total - r.arrived) + ' to come</div>';
        main.className = 'main ci-main';
        main.innerHTML = '<div class="ci-side"><div class="ci-qr" id="ci-qr"></div><div class="ci-scan">Scan with your camera.<br>Tap your name.</div><div class="ci-url">' + esc(CHECKIN_TEXT) + '</div>' + big + '</div><div class="ci-right" id="ci-right">' + right + '</div>';
        // The QR is redrawn into the fresh box each render (innerHTML replaced it).
        try { if (window.QRCode) new QRCode($('ci-qr'), { text: CHECKIN_URL, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { /* the address reads below it */ }
        if (!ciTimer && pages > 1) ciTimer = setInterval(() => { ciPage++; renderCheckinBoard(); }, EVERY);
    }
    function tickClock() { const c = $('tv-clock'); if (c) { const t = clock(new Date()); c.textContent = t.replace(/ [AP]M$/, ''); } }
    function startCheckin() {
        document.title = 'HardPan Tournaments \u00b7 Check-in board';
        $('tv-live').innerHTML = '<span class="ci-clock" id="tv-clock"></span>';
        $('tv-live').style.display = 'flex';
        tickClock(); setInterval(tickClock, 15000);
        db.ref('tournaments/' + CODE).on('value', (snap) => {
            data = snap.val();
            if (!data) { $('tv-main').innerHTML = '<div class="board"><div class="err">No tournament found with that code.</div></div>'; return; }
            ciWatch();
            renderCheckinBoard();
        }, (err) => { $('tv-main').innerHTML = '<div class="board"><div class="err">' + esc('The board could not be read: ' + (err && err.message ? err.message : err)) + '</div></div>'; });
        try { if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) { /* no wake lock */ }
    }

    function start() {
        if (!CODE) { $('tv-board').innerHTML = '<div class="err">Open this page from the organizer’s Board tab, or add ?tourney=CODE to the address.</div>'; return; }
        if (CHECKIN) { startCheckin(); return; }
        db.ref('tournaments/' + CODE).on('value', onSnapshot, (err) => { $('tv-board').innerHTML = '<div class="err">' + esc('The board could not be read: ' + (err && err.message ? err.message : err)) + '</div>'; });
        // A TV should not dim mid-event; refused quietly where unsupported.
        try { if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) { /* no wake lock */ }
    }
    try {
        const auth = firebase.auth();
        const go = () => start();
        if (auth.currentUser) go();
        else auth.signInAnonymously().then(go, go);
    } catch (e) { start(); }
</script>
</body>
</html>
