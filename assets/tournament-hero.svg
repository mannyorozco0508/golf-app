<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-label="">
  <!-- Brand-green fairway band for /tournament. Abstract, no people, no
       photograph of a real course. Palette is brand-green #0f4c3a and
       neighbours, so a missing overlay still reads as the same product. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2a22"/>
      <stop offset="0.42" stop-color="#0c3a2e"/>
      <stop offset="1" stop-color="#0f4c3a"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3d30"/>
      <stop offset="1" stop-color="#0a2f25"/>
    </linearGradient>
    <linearGradient id="fairway" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#156049"/>
      <stop offset="0.55" stop-color="#0f4c3a"/>
      <stop offset="1" stop-color="#0b3328"/>
    </linearGradient>
    <radialGradient id="green" cx="0.42" cy="0.48" r="0.7">
      <stop offset="0" stop-color="#1c7a5c"/>
      <stop offset="0.55" stop-color="#147a54"/>
      <stop offset="1" stop-color="#0f4c3a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.72" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#2a9d8f" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#1a6b58" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0f4c3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>
  <rect width="1600" height="640" fill="url(#sky)"/>
  <rect width="1600" height="640" fill="url(#glow)"/>
  <!-- distant ridge -->
  <path d="M0 318 C 180 290, 340 308, 520 284 S 860 250, 1040 278 S 1360 250, 1600 270 L1600 400 L0 400 Z" fill="url(#far)"/>
  <!-- rolling fairway -->
  <path d="M0 368 C 280 328, 560 356, 840 338 S 1280 312, 1600 348 L1600 640 L0 640 Z" fill="url(#fairway)"/>
  <!-- mower stripes: quiet, not cartoon -->
  <g fill="url(#stripe)">
    <path d="M-40 640 L 220 360 L 310 358 L 80 640 Z"/>
    <path d="M200 640 L 430 354 L 520 352 L 340 640 Z"/>
    <path d="M460 640 L 650 348 L 740 346 L 600 640 Z"/>
    <path d="M740 640 L 860 344 L 950 342 L 880 640 Z"/>
    <path d="M1040 640 L 1080 340 L 1170 338 L 1180 640 Z"/>
    <path d="M1320 640 L 1280 338 L 1370 336 L 1480 640 Z"/>
  </g>
  <!-- putting surface -->
  <ellipse cx="560" cy="488" rx="340" ry="78" fill="url(#green)" filter="url(#soft)"/>
  <ellipse cx="560" cy="488" rx="340" ry="78" fill="none" stroke="#8fd3b5" stroke-opacity="0.18" stroke-width="2"/>
  <!-- cup -->
  <ellipse cx="598" cy="478" rx="7" ry="2.8" fill="#071f19"/>
  <rect x="596.2" y="338" width="3.2" height="140" fill="#d7e4dc"/>
  <path d="M599.4 338 L 668 356 L 599.4 376 Z" fill="#b7d46a"/>
</svg>
