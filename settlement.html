                    : `${row.requiredCount - row.postedCount} golfer(s)`;
                html += `<div class="ledger-row"><span>${row.label} — Waiting on ${who}</span><span></span></div>`;
                return;
            }
            if (row.kind === 'carry') {
                html += `<div class="ledger-row skins-carry-row"><span>${row.text}</span><span></span></div>`;
                return;
            }
            const cents = centsByHole[String(row.hole)];
            html += `<div class="ledger-row"><span>${row.label} — ${escapeHtml(row.winner.name)} — ${row.score}${row.collected || ' — Skin'}</span>`
                + `<span class="val-pos">${cents === undefined ? '' : $(cents)}</span></div>`;
        });

        // A pot nobody won says so rather than rendering empty (the per-golfer
        // Skins Summary that used to follow the rows left with v196).
        if (pot.lines.length === 0) html += `<div class="ledger-row"><span>No skins were won.</span><span></span></div>`;

        // ---- MONEY THAT FOUND NO WINNER ------------------------------------
        // Stated outright. An unwon carry or a fully tied round leaves real money in
        // the pot, and a Receipt that just omits it looks like the money vanished.
        if (pot.unwonCents > 0) {
            const why = pot.pendingUnits > 0
                ? `${pot.pendingUnits} unwon skin${pot.pendingUnits === 1 ? '' : 's'} carried to the end`
                : 'no skins won';
            html += `<div class="ledger-row"><span>↩️ Unwon skins money (${why}) — refunded to the field</span>`
                + `<span>${$(pot.unwonCents)}</span></div>`;
        }

        return html;
    }

    // (The per-game PAYOUTS BLOCK - Skins / Net Finish / KP, who is owed what -
    // left with v196: 💰 Pay out in #results-top is the one answer, per golfer,
    // and each game card below is the proof. A golfer's total prints once.)

    // ---- A TIED NET PLACE, ONE GOLFER AT A TIME -------------------------------
    //
    // pool-engine.js pays each golfer of a tie their own share and puts those
    // shares ON THE LINE - {shares: [...]} in l.ids order, the same array it paid
    // from. This page reads them and computes nothing. (v142 reproduced the split
    // here by calling the engine's allocators with the engine's inputs; that
    // reproduction is gone - the engine is the one source.) Both the PAYOUTS
    // block and the Net Finish detail read this, so the two cannot disagree, and
    // a legacy tie prints the cents the engine paid (33.34/33.33/33.33), not
    // "$33.33 each".
    function netTieShares(l) {
        return (l.shares || [l.cents]).slice();
    }

    // The place label, the leaderboard's way: the engine's `place` is the players
    // ahead plus one, and a split line spans the places it consumed - T + place.
    function netPlaceLabel(l) {
        return (l.split ? 'T' : '') + l.place;
    }

    function renderMoneyPoolSection(data, courseData, savedScores) {
        const mount = document.getElementById('money-pool-section');
        if (!mount) return;
        if (typeof computeMoneyPool !== 'function') { mount.innerHTML = ''; return; }
        const r = computeMoneyPool(data, courseData, savedScores);
        if (!r) { mount.innerHTML = ''; return; }
        const $ = c => '$' + (c / 100).toFixed(c % 100 === 0 ? 0 : 2);
        // ONE CARD PER GAME (v196, 2026-09-22): KP, Net Finish, Skins per flight -
        // sibling .game-card blocks under a small "Weekly Game" label, each with a
        // coloured head band, the title large, the pot on the right, the winners by
        // hole beneath. Gone from this mount: the gold wrapper card, the Not-final
        // line (one mount above everything now), the per-game payouts block and the
        // Skins Summary lists (💰 Pay out prints a golfer's total once).
        // The pot total sits in Pay out's head ("$880 of $920"), so the label here
        // carries no figure.
        let html = `<div class="results-section-label">\uD83C\uDFC6 Weekly Game</div>`;
        if (!r.valid) {
            html += `<div class="settle-card"><div class="ledger-row"><span style="color:var(--accent-red);">\u26A0\uFE0F ${r.errors.join(' \u00B7 ')}</span></div></div>`;
        }
        // CANCELLED IS NOT A REFUND, and the Receipt has to say which it was. The
        // money did not come back to the field - the game was removed and the pot
        // was re-divided, which is why no golfer sees a KP line at all.
        if (r.valid && r.kpCancelled && r.kpCancelled.cancelled) {
            html += gameCardHtml('game-kp', '\uD83D\uDCCD KP', 'Cancelled',
                `<div class="ledger-row"><span>Cancelled before settlement \u00B7 original allocation ${$(r.kpCancelled.originalCents)}</span>`
                 + `<span>moved to skins</span></div>`);
        }
        if (r.valid && r.kp) {
            // THREE STATES, EACH NAMED (2026-09-22, KP money never refunds). Paid: the
            // name and the distance when somebody measured. Skins: the organizer called
            // "nobody" and the share went into the skins pot. Unresolved: HELD - a blank
            // hole (live or finished), a recorded winner who is out of the round, or
            // "nobody" on a round with no skins pot - the share stays in the pot and the
            // round is not final until it is recorded.
            const noWin = data.kpNoWinner || {};
            const winners = data.kpWinners || {};
            let kpRows = '';
            const leaders = (data.kpLeaders || {});
            r.kp.lines.forEach(l => {
                const led = leaders['h' + l.hole];
                const dist = (led && led.distanceInches !== null && led.distanceInches !== undefined)
                    ? ' \u2014 ' + Math.floor(led.distanceInches / 12) + "' " + (led.distanceInches % 12) + '"'
                    : '';
                if (l.state === 'paid') {
                    kpRows += `<div class="ledger-row"><span>Hole ${l.hole}: ${escapeHtml(l.winnerName)}${dist}</span><span class="val-pos">${$(l.cents)}</span></div>`;
                } else if (l.state === 'skins') {
                    kpRows += `<div class="ledger-row"><span>Hole ${l.hole}: nobody</span><span>${$(l.cents)} to the skins pot</span></div>`;
                } else {
                    const what = l.reason === 'out' ? `${escapeHtml(l.winnerName || '')} is out of the round \u2014 re-record it`
                        : (l.reason === 'nobody' ? 'nobody \u2014 no skins pot to take it, still in the pot' : 'not recorded');
                    kpRows += `<div class="ledger-row" style="color:var(--warn-text);"><span>Hole ${l.hole}: ${what}</span><span>${$(l.cents)} in the pot</span></div>`;
                }
            });
            html += gameCardHtml('game-kp', '\uD83D\uDCCD KP', $(r.kp.amountCents), kpRows);
        }
        if (r.valid && r.net) {
            let netRows = '';
            // A TIE IS EXPLAINED, NOT JUST MARKED.
            //
            // "(split)" was accurate and told a golfer nothing. The rule behind it is
            // the least intuitive money rule in the app: golfers tied for a place
            // occupy every position the tie spans and share ALL of that money, so two
            // tied for 1st in a $40/$30 structure take $70 between them and the next
            // golfer finishes 3rd with nothing. People query that, on the spot, and
            // "(split)" gives them nothing to check.
            //
            // Every figure below is read from the canonical result - the positions the
            // engine consumed, the money it assigned to them, the integers it
            // allocated. Nothing is recomputed here; a second implementation of the
            // tie rule is exactly how a receipt starts disagreeing with the money.
            // The ALLOCATED place values, straight from the engine. Calling
            // moneyPoolNetPlaceCents() here instead was wrong: that is the legacy
            // percentage path, and on a whole-dollar round it returns 3999/3001 where
            // the engine allocated 4000/3000 - so the explanation read
            // "$39.99 + $30.01 = $70" underneath a $70 line. Consume, never recompute.
            const placeCents = r.net.placeCents || null;
            r.net.lines.forEach(l => {
                const tied = l.ids.length > 1;
                const who = tied
                    ? `T${l.place}: ${l.names.join(' / ')}`
                    : `${l.place}${['st','nd','rd'][l.place-1]||'th'}: ${l.names[0]}`;
                netRows += `<div class="ledger-row"><span>${who} \u00B7 net ${l.net}</span><span class="val-pos">${$(l.cents)}</span></div>`;

                if (!tied) return;

                // Which positions this tie consumed, and what each was worth.
                const span = l.ids.length;
                const first = l.place, last = l.place + span - 1;
                const parts = [];
                if (placeCents) {
                    for (let k = first; k <= last && k <= placeCents.length; k++) parts.push($(placeCents[k - 1]));
                }
                const posLabel = last > first ? `Positions ${first}\u2013${last}` : `Position ${first}`;
                netRows += `<div class="nf-explain">${posLabel}`
                    + (parts.length > 1 ? ` \u00B7 ${parts.join(' + ')} = ${$(l.cents)}` : ` \u00B7 ${$(l.cents)}`)
                    + `</div>`;

                // The per-golfer split, the shares the engine put on the line. In a
                // whole-dollar round an odd pot is deliberately uneven - $100 over three
                // is $34/$33/$33 - so the actual amounts are printed rather than an
                // average that would not add up.
                // (v142) The same shares the PAYOUTS block prints, from netTieShares.
                const each = netTieShares(l);
                const same = each.every(c => c === each[0]);
                netRows += `<div class="nf-explain">${same
                    ? `${$(each[0])} each`
                    : l.names.map((n, i) => `${n} ${$(each[i])}`).join(' \u00B7 ')}</div>`;

                // What it cost the golfer behind them, stated plainly - this is the part
                // that gets queried in the car park.
                if (span > 1) {
                    netRows += `<div class="nf-explain">The tie consumed ${span} paid place${span === 1 ? '' : 's'}, `
                        + `so the next golfer finishes ${last + 1}${['st','nd','rd'][last]||'th'}.</div>`;
                }
            });
            if (r.net.lines.length === 0) netRows += `<div class="ledger-row"><span>No scores \u2014 refunded</span><span>${$(r.net.amountCents)}</span></div>`;
            html += gameCardHtml('game-net', '\uD83E\uDD47 Net Finish', $(r.net.amountCents), netRows);
        }
        if (r.valid && r.skins) {
            html += buildSkinsReceiptSection(r, data, courseData, savedScores, $);
        }
        if (r.valid && r.refund.cents > 0) {
            html += `<div class="settle-card game-card game-refund"><div class="ledger-row"><span>\u21A9\uFE0F Refunded to the field (${r.refund.reasons.length ? r.refund.reasons.join(' ') : 'residue'})</span><span>${$(r.refund.cents)} \u00F7 ${r.participants.length}</span></div></div>`;
        }
        mount.innerHTML = html;
    }

    // FLIGHT LABELS ON THE LEDGER (Wave 2, Step 7). A ledger line earned inside a
    // flight says which one: "Skins (A)", "Birdie Pool (B)". Only lines from a
    // wager the round actually scopes per flight get the suffix - the resolver's
    // flightScopeApplies() is the one rule, so a field-wide birdie game on a
    // flighted round stays "Birdie Pool", exactly as the engine paid it. The
    // engine's label strings are not touched: the suffix is presentation, added
    // here and nowhere else. Totals and Who Pays Who carry no badge.
    //
    // Which lines a scope covers, by the label the engine emits:
    //   'skins'    every skins WAGER line - "Skins", "Skins (2)" (getRoundGames
    //              hands the round's `flights` to each instance, so all of them
    //              settle per flight together). The Main Pool's skins bucket is
    //              flight-blind and its note reads "Net Skins · 2 skins" - a note
    //              line, and not this label - so it is never suffixed.
    //   'birdies'  the "Birdie Pool" line.
    // A golfer the roster cannot name gets no suffix rather than a guessed one.
    const FLIGHT_LABEL_SCOPES = [
        { scope: 'skins', matches: label => /^Skins( \(\d+\))?$/.test(label) },
        { scope: 'birdies', matches: label => label === 'Birdie Pool' }
    ];
    function flightLabelSuffix(data, golferName, line) {
        if (!data || line.note || typeof flightScopeApplies !== 'function') return '';
        const rule = FLIGHT_LABEL_SCOPES.find(r => r.matches(line.label));
        if (!rule || !flightScopeApplies(data, rule.scope)) return '';
        const p = (data.players || []).find(pl => pl && pl.name === golferName);
        if (!p) return '';
        return ' (' + playerFlight(p) + ')';
    }

    // Presenter only. Reads canonical contributions and formats them; the only
    // arithmetic is summing the lines it was handed, to prove they add up.
    // `data` is read for the flight suffix alone; without it every label prints
    // exactly as the engine wrote it.
    // ---- 💰 PAY OUT (v196, 2026-09-22) ------------------------------------------
    //
    // ONE ROW PER GOLFER OWED CASH, largest first, the amount big: the list the
    // person with the envelope works down. Gross winnings - the buy-ins were
    // collected on the first tee, so a golfer's row is what they are handed, not
    // their net position (NET +/− at the bottom answers that). A row is a
    // <details>: closed on screen, the reasons under it on a tap - "Skins B · Hole
    // 4 · $52", "KP · Hole 7 · $20", "Net Finish 1st · $50" - and OPEN on paper
    // (class print-open, setPrintOpen). Under the list, one line names everyone
    // with no payout, so a golfer who won nothing still finds their name.
    //
    // THE TOTAL IS THE CANONICAL LEDGER'S. Which contribution lines count as a
    // payout is the rule Player Payouts carried from v142 to v195b (payoutLines):
    // every positive line except the buy-in, the "Main Pool" aggregate whose notes
    // carry its detail, and a side-match rollup its own detail explains. The row's
    // amount is the sum of THOSE lines - nothing here computes or rounds money.
    //
    // THE REASONS ARE A PAGE-SIDE JOIN. The engine's pool notes name the game but
    // not the hole ("Gross Skins · 2 skins"); the hole is on computeMoneyPool's
    // own lines - r.kp.lines / r.net.lines (shares) / r.skins.flights[].lines /
    // r.refund.perPlayerCents - keyed by the golfer's id, so the pool reasons are
    // read from there and every other payout line (a side game, a group game, a
    // rounding line) is the contribution line as it stands. The two are held
    // together at runtime: if the joined reasons do not sum to the row's amount
    // to the cent, the row falls back to the contribution lines themselves, so
    // the page can never show reasons that fail to add up to their own total.
    // results_payout_test.js proves the join path is the one taken.
    const POOL_NOTE_RE = /^(KP H\d+|Net Finish T?\d+|(Gross|Net) Skins · \d+ skins?|Pool refund\b)/;
    function payoutLinesOf(c) {
        const isBuyIn = l => /buy-in/i.test(l.label);
        const isPoolAggregate = l => !l.note && l.label === MAIN_POOL_LEDGER_LABEL;
        const explained = c.lines.filter(l => l.note && l.group).map(l => l.group);
        const isExplainedSideMatch = l => !l.note
            && explained.some(g => l.label.indexOf('Side Match · ' + g) === 0);
        return c.lines.filter(l =>
            !isBuyIn(l) && !isPoolAggregate(l) && !isExplainedSideMatch(l) && l.amount > 0.005);
    }
    function ordinal(n) {
        const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
        return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }
    // The pool's lines for one golfer, as {label, amount (dollars)} - the join.
    function poolReasonsFor(r, id) {
        const out = [];
        if (!r || !r.valid) return out;
        const dollars = c => c / 100;
        if (r.kp) r.kp.lines.forEach(l => {
            if (l.state === 'paid' && String(l.winnerId) === id) out.push({ label: 'KP · Hole ' + l.hole, amount: dollars(l.cents) });
        });
        if (r.net) r.net.lines.forEach(l => {
            const i = l.ids.map(String).indexOf(id);
            if (i >= 0) out.push({ label: 'Net Finish ' + (l.split ? 'T' : '') + ordinal(l.place), amount: dollars(netTieShares(l)[i]) });
        });
        if (r.skins) {
            const pots = r.skins.flights ? r.skins.flights : [{ flight: null, lines: r.skins.lines }];
            pots.forEach(pot => pot.lines.forEach(l => {
                if (String(l.winnerId) === id) out.push({ label: 'Skins' + (pot.flight ? ' ' + pot.flight : '') + ' · Hole ' + l.hole, amount: dollars(l.cents) });
            }));
        }
        if (r.refund && r.refund.perPlayerCents && r.refund.perPlayerCents[id] > 0) {
            out.push({ label: 'Pool refund' + (r.refund.reasons.length ? ' · ' + r.refund.reasons.join(' ') : ''), amount: dollars(r.refund.perPlayerCents[id]) });
        }
        return out;
    }
    // "$880 of $920 · $40 held": the rows' total; "of the pot" only when the rows
    // and the held money ARE the pot (a refund is a row, so it is already in the
    // rows; a round with side games pays more than the pot, and then the total
    // stands alone); the held part only when something is held.
    function payoutHeadCell(paidCents, potCents, heldCents) {
        const $ = c => '$' + fmtWhole(c / 100);
        let t = $(paidCents);
        if (potCents > 0 && paidCents + (heldCents || 0) === potCents) t += ' of ' + $(potCents);
        if ((heldCents || 0) > 0) t += ' · ' + $(heldCents) + ' held';
        return t;
    }
    function buildPayoutCardHtml(contributions, sortedTotals, r, data) {
        if (!contributions) return '';
        const keys = Object.keys(contributions);
        if (keys.length === 0) return '';
        const idByName = {};
        (data.players || []).forEach(p => { idByName[p.name] = String(p.id); });
        const money = amt => '$' + fmtWhole(Math.abs(amt));
        const cents = amt => Math.round(amt * 100);

        const rows = [], none = [];
        keys.forEach(k => {
            const c = contributions[k];
            const lines = payoutLinesOf(c);
            const total = lines.reduce((a, l) => a + l.amount, 0);
            if (total <= 0.005) { none.push(c.name); return; }
            const id = idByName[c.name];
            // A note tagged with a wager name carries it: "Zach vs Chris · Press 1", so a
            // golfer in two matches never reads two identical "Overall Match" lines.
            const asReason = l => ({ label: (l.group ? escapeHtml(l.group) + ' \u00B7 ' : '') + l.label + flightLabelSuffix(data, c.name, l), amount: l.amount });
            const other = lines.filter(l => !(l.note && !l.group && POOL_NOTE_RE.test(l.label))).map(asReason);
            let reasons = (id !== undefined ? poolReasonsFor(r, id) : []).concat(other);
            const joined = reasons.reduce((a, x) => a + x.amount, 0);
            if (cents(joined) !== cents(total)) {
                // the join and the ledger disagree: show the ledger's own lines
                reasons = lines.map(asReason);
            }
            rows.push({ name: c.name, total, reasons });
        });
        rows.sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
        const paidCents = rows.reduce((a, x) => a + cents(x.total), 0);
        const head = payoutHeadCell(paidCents, r && r.valid ? r.totalPoolCents : 0, r && r.valid ? (r.kpUnresolvedCents || 0) : 0);

        let html = `<div class="settle-card payout-card">`
            + `<div class="settle-header po-head"><span>💰 Pay out</span><span class="po-total">${head}</span></div>`;
        if (rows.length === 0) html += `<div class="po-none">Nobody is owed anything.</div>`;
        rows.forEach(x => {
            html += `<details class="po-row print-open"><summary><span class="po-name">${escapeHtml(x.name)}</span><span class="po-amt">${money(x.total)}</span></summary>`;
            x.reasons.forEach(re => {
                html += `<div class="po-reason"><span>${re.label}</span><span>${money(re.amount)}</span></div>`;
            });
            html += `</details>`;
        });
        if (none.length) html += `<div class="po-none">No payout: ${none.map(escapeHtml).join(', ')}</div>`;
        return html + `</div>`;
    }

    // ---- NET +/− (v196) ------------------------------------------------------
    // Every golfer's position after their own stake, said as NET, collapsed under
    // the games - the settlement argument's list, kept for the golfer who wants
    // it and out of the payer's way. Open on paper.
    function buildNetViewHtml(sortedTotals) {
        const fmt = amt => {
            if (amt > 0.005) return `<span class="val-pos">+$${fmtWhole(amt)} NET</span>`;
            if (amt < -0.005) return `<span class="val-neg">-$${fmtWhole(Math.abs(amt))} NET</span>`;
            return `<span class="val-even">$0 NET</span>`;
        };
        let html = `<details class="settle-card net-view print-open"><summary class="settle-header">Net +/−</summary>`;
        (sortedTotals || []).forEach(t => { html += `<div class="ledger-row"><span>${escapeHtml(t.name)}</span>${fmt(t.net)}</div>`; });
        return html + `</details>`;
    }

    // ---- LIVE RESULTS -------------------------------------------------------
    //
    // A GOLF SUMMARY, NOT A RECEIPT. Three questions and nothing else: who is
    // leading, who has won skins, what is still outstanding. Every dollar figure is
    // deliberately absent - the number of winning skins can still change, so any
    // amount shown now is a guess that gets contradicted later.
    //
    // NO NEW MATH. Standings come from computeNetToParStandings() in money-engine.js,
    // the same function the scorecard ticker and the Leaderboard tab call, so all
    // three surfaces rank identically. Skins come from computeSkinsHoleLedger(). KP
    // status is read off the pool result.
    function liveGroupOf(data, playerId) {
        const players = data.players || [];
        const idx = players.findIndex(p => String(p.id) === String(playerId));
        if (idx < 0) return null;
        return Math.floor(idx / 4) + 1;
    }

    function buildLiveResultsHtml(data, courseData, savedScores, settlement) {
        const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
        const st = settlement || receiptSettlement(data, courseData, savedScores);

        // PER FLIGHT (Wave 2). The ledger's `flights` - one entry when the round is
        // not flighted - never its top level, which is null when it is. Each entry
        // gets its own SKINS WON card; a hole can be a skin in A and a tie in B.
        let ledgers = [];
        // ONE PREDICATE FOR THE WHOLE APP - roundHasSkinsGame() in action-model.js.
        // FROM THE RIGHT CONFIG (live-skins.js): one section per skins wager, from
        // that wager's own config, plus the Main Pool bucket's own section - gross
        // or net as the bucket says, never flighted. This used to hand the ROUND to
        // the ledger builder, so a pool-only round drew NET cards per flight for a
        // gross, field-wide pot.
        if (roundHasSkinsGame(data) && typeof liveSkinsLedgerEntries === 'function') {
            try {
                ledgers = liveSkinsLedgerEntries(data, courseData, savedScores, { groupOf: id => liveGroupOf(data, id) });
            } catch (e) { ledgers = []; }
        }
        const L = ledgers.length ? ledgers[0].L : null;
        // Section labels only when the round holds more than one skins pot.
        const manySections = ledgers.length > 0 && ledgers[0].section.count > 1;
        // THE FIELD'S FLIGHTS for the standings: enabled is enough - standings are
        // not a game, so no scope decides them. Absent -> one section, as always.
        const fl = data.flights;
        const standingsFlighted = !!(fl && fl.enabled === true) && typeof playerFlight === 'function';

        // THRU is the OFFICIAL point across every group, never whichever hole this
        // device happens to be looking at.
        let thru = 0;
        if (ledgers.length && ledgers.every(e => e.L.officialThru > 0)) {
            thru = Math.min.apply(null, ledgers.map(e => e.L.officialThru));
        } else if (typeof computePlayerRoundTotals === 'function') {
            const played = (data.players || []).map(p => {
                try { return computePlayerRoundTotals(p, courseData, savedScores).holesPlayed; }
                catch (e) { return 0; }
            });
            thru = played.length ? Math.min.apply(null, played) : 0;
        }

        // THE HEAD SAYS WHAT IS HOLDING THE ROUND OPEN, AND WHO. Three shapes:
        //   golfers still out   "Still in play — thru 9, 1 golfer still has holes
        //                       left: Dee D (9 of 18)." - up to six names, then
        //                       "+ N more"; the trip's sentence and plural rule.
        //   KP-only hold        every card is in, so "still in play" would blame
        //                       golfers who have finished; the head says RESULTS —
        //                       NOT FINAL and the gap line above it names the holes.
        //                       (Removed 2026-09-19 when a blank KP refunded on a
        //                       finished round; back 2026-09-22 - KP money never
        //                       goes back to the field, so the hole holds its share.)
        //   not started         today's head, unchanged.
        // Money stays OUT of this branch by design (see the block comment above):
        // this names the hold, it does not price it.
        const out = st.unfinished || [];
        const holdGolfers = st.started && out.length > 0;
        const holdKp = st.finished && !st.kpSettled;
        let head, note;
        if (holdGolfers) {
            const names = out.slice(0, 6).map(u => esc(u.name) + ' (' + u.holesPlayed + ' of ' + u.holesRequired + ')').join(', ')
                + (out.length > 6 ? ' + ' + (out.length - 6) + ' more' : '');
            head = '\uD83C\uDFC6 LIVE RESULTS' + (thru > 0 ? ' \u2014 THRU ' + thru : '');
            note = 'Still in play' + (thru > 0 ? ' \u2014 thru ' + thru : '') + ', ' + out.length + ' golfer' + (out.length === 1 ? '' : 's')
                + ' still ' + (out.length === 1 ? 'has' : 'have') + ' holes left: ' + names + '.'
                + ' Final money appears once every card is in, or once the scores are confirmed in Finish Round.';
        } else if (holdKp) {
            head = '\uD83C\uDFC6 RESULTS \u2014 NOT FINAL';
            note = 'Every card is in. A KP is not recorded \u2014 its share stays in the pot, and final money appears once the winner is recorded.';
        } else {
            head = '\uD83C\uDFC6 LIVE RESULTS' + (thru > 0 ? ' \u2014 THRU ' + thru : '');
            note = 'The round is still in play. Final money appears once every card is in.';
        }
        // The Not-final line is NOT in this card any more (v196): it renders once,
        // in #results-gap-line above every mount, on every round.
        let html = '<div class="settle-card live-head">'
            + '<div class="settle-header">' + head + '</div>'
            + '<div class="live-note">' + note + '</div>'
            + '</div>';

        if (typeof computeNetToParStandings === 'function') {
            // PER FLIGHT: two lists, ranked within the flight, headed by it - the
            // same sectioning the leaderboard uses. One list, as always, otherwise.
            const groups = standingsFlighted
                ? ['A', 'B'].map(f => ({ label: 'FLIGHT ' + f + ' \u2014 NET', flight: f, players: (data.players || []).filter(p => playerFlight(p) === f) }))
                : [{ label: 'OVERALL \u2014 NET', flight: null, players: data.players || [] }];
            groups.forEach(g => {
                const rows = computeNetToParStandings(g.players, courseData, savedScores,
                    { basis: 'net' }).filter(r => r.started);
                if (rows.length === 0) return;
                // THE FLIGHT IS ON THE CARD (data-flight), not only in its header -
                // the CSS gives A and B their own edge, so the stack reads at a glance.
                html += '<div class="settle-card"' + (g.flight ? ' data-flight="' + g.flight + '"' : '') + '><div class="settle-header">' + g.label + '</div>';
                rows.slice(0, 5).forEach(r => {
                    html += '<div class="lr-row"><span class="lr-pos">' + r.positionLabel + '</span>'
                         + '<span class="lr-name">' + esc(r.name) + '</span>'
                         + '<span class="lr-par">' + formatToPar(r.toPar) + '</span></div>';
                });
                html += '<a class="lr-more" href="leaderboard.html?game=' + encodeURIComponent(currentMode)
                     + '">View Full Leaderboard \u203A</a></div>';
            });
        }

        ledgers.forEach(entry => {
            const LL = entry.L;
            const byPlayer = {};
            LL.holes.forEach(r => {
                if (!r.official || r.state === 'tie' || !r.winner) return;
                const k = String(r.winner.id);
                if (!byPlayer[k]) byPlayer[k] = { name: r.winner.name, holes: [] };
                byPlayer[k].holes.push(r.hole);
            });
            const winners = Object.values(byPlayer).sort((a, b) => b.holes.length - a.holes.length
                || a.holes[0] - b.holes[0] || String(a.name).localeCompare(String(b.name)));

            // A SKINS WON card is a different kind of thing from a standings card
            // and no longer shares its chrome (.skins-card); its flight is on the card.
            html += '<div class="settle-card skins-card"' + (entry.flighted ? ' data-flight="' + entry.flight + '"' : '') + '><div class="settle-header">\uD83E\uDD69 SKINS WON'
                 + (manySections ? ' \u2014 ' + esc(entry.section.label).toUpperCase() : '')
                 + (entry.flighted ? ' \u2014 FLIGHT ' + entry.flight : '') + '</div>';
            if (entry.flighted && LL.participants.length === 0) {
                html += '<div class="lr-none">Nobody in this flight.</div>';
            } else if (winners.length === 0) {
                html += '<div class="lr-none">No official skins yet.</div>';
            } else {
                winners.forEach(w => {
                    html += '<div class="lr-row"><span class="lr-name">' + esc(w.name) + '</span>'
                         + '<span class="lr-count">' + w.holes.length
                         + (w.holes.length === 1 ? ' skin' : ' skins') + '</span>'
                         + '<span class="lr-holes">' + (w.holes.length === 1 ? 'Hole ' : 'Holes ')
                         + w.holes.join(', ') + '</span></div>';
                });
            }
            html += '<div class="lr-foot">Tied holes are not shown'
                 + (LL.officialThru > 0 ? ' \u00B7 Official through Hole ' + LL.officialThru : '')
                 + '</div></div>';
        });

        if (typeof computeMoneyPool === 'function') {
            try {
                const r = computeMoneyPool(data, courseData, savedScores);
                if (r && r.valid && r.kp && r.kp.lines.length > 0) {
                    const total = r.kp.lines.length;
                    const decided = r.kp.lines.filter(l => l.state !== 'unresolved').length;
                    const recorded = r.kp.lines.filter(l => l.winnerId).length;
                    const status = recorded === total ? 'all recorded'
                        : (decided === total ? recorded + ' of ' + total + ' recorded'
                            : (recorded > 0 ? recorded + ' of ' + total + ' recorded' : 'none recorded yet'));
                    html += '<div class="settle-card"><div class="settle-header">\uD83D\uDCCD KP</div>'
                         + '<div class="lr-kp">' + total + ' KP' + (total === 1 ? '' : 's')
                         + ' today \u00B7 ' + status + '</div></div>';
                }
            } catch (e) { /* a status line is never worth taking the page down for */ }
        }

        return html;
    }

    // ---- IS THE ROUND ACTUALLY OVER? ----------------------------------------
    //
    // ONE PREDICATE FOR THE WHOLE APP - computeRoundSettlement() in
    // settlement-engine.js, the same one the trip reads (2026-09-15). It answers
    // both questions the Receipt needs:
    //
    //   finished   every golfer who TEED OFF has every hole scored - OR the
    //              organizer verified the round in Finish Round ("Scores Look
    //              Right" writes scoresVerified). That is how a picked-up ball or
    //              a golfer who left after nine gets declared deliberate: the app
    //              cannot tell "picked up on 12" from "not there yet", so an
    //              unverified blank keeps the round live, and verification is the
    //              word that finishes it. A roster name with no score never teed
    //              off and is not waited for.
    //   kpSettled  pool-engine's `settled` - unresolved KP money confirmed or
    //              cancelled - read, not re-derived.
    //
    // FINAL requires both. Before this the page asked its own two questions -
    // every ROSTER golfer complete, and the pool settled - and never read
    // scoresVerified, so a round with a DNF card stayed LIVE forever: there was
    // no way to a Final receipt for a golfer who left after nine except typing
    // scores that were not made. The trip meanwhile called that round finished.
    // Now both surfaces ask the engine.
    //
    // The whole answer is kept, not just the flag: the live head names who is
    // still out from `unfinished`, and says which hold is open.
    function receiptSettlement(data, courseData, savedScores) {
        if (typeof computeRoundSettlement !== 'function') {
            // No engine, no claim: never call a round final on a page that cannot ask.
            return { settled: false, finished: false, started: false, kpSettled: true, unfinished: [], playing: 0, thru: 0, holesRequired: (courseData || []).length };
        }
        try { return computeRoundSettlement(data, courseData || [], savedScores || {}); }
        catch (e) { return { settled: false, finished: false, started: false, kpSettled: true, unfinished: [], playing: 0, thru: 0, holesRequired: (courseData || []).length }; }
    }

    // THE WORD ON A PER-GAME HEADING. "Final Skins Settlement (No Carry)" while
    // the round is final - exactly as it always read - and "Skins Settlement —
    // Not Final (No Carry)" while it is not. These cards render in BOTH modes
    // (renderSettlement runs regardless of the live gate), and they used to say
    // Final under a LIVE RESULTS head that said the round was still in play.
    function settleHeading(base, suffix, final) {
        return final ? 'Final ' + base + (suffix || '') : base + ' \u2014 Not Final' + (suffix || '');
    }

    function renderCombinedSummary(data, courseData, savedScores) {
        const container = document.getElementById('combined-settlement-summary');
        if (!container) return;
        const players = data.players || [];
        // THE SEND RESULTS PILL IS DECIDED HERE AND ONLY HERE. Cleared on entry, set
        // at the end of the settled branch - so a round that goes back to live, or
        // hits the duplicate-name refusal, leaves no button behind.
        setReceiptAction(false);
        // THE SETTLED-ONLY MOUNTS ARE CLEARED ON EVERY ENTRY (v196), so a round
        // that goes back to live, or hits the name refusal, leaves no Pay out list
        // or Net view behind.
        const topMount = document.getElementById('results-top');
        const netMount = document.getElementById('results-net');
        if (topMount) topMount.innerHTML = '';
        if (netMount) netMount.innerHTML = '';
        if (players.length === 0) { container.innerHTML = ''; return; }

        // LIVE MODE SHORT-CIRCUITS THE WHOLE SETTLEMENT DOCUMENT. At hole five a
        // golfer wants to know who is leading, who has won a skin and what is still
        // outstanding - not a $480 accounting statement with pending-dollar rows for
        // holes nobody has played. Results earns its receipt when the round is over.
        const settlement = receiptSettlement(data, courseData, savedScores);
        if (!settlement.settled) {
            // NO PRINT BUTTON WHILE THE ROUND IS LIVE. The Receipt belongs to the
            // finished round (live_results_test: "Print / Save" is absent while
            // live); the copy that used to sit at the very bottom of
            // #settle-content on every branch - 2,300 px down on a flighted pool
            // round - is gone (2026-09-14), so the settled branch's button at the
            // top of the receipt is the one and only.
            container.innerHTML = buildLiveResultsHtml(data, courseData, savedScores, settlement);
            return;
        }

        // A NAME THE MONEY CANNOT TELL APART STOPS THE RECEIPT.
        //
        // Every total below is added up by name, so two golfers sharing one become a
        // single balance and somebody pays the other man's debts. This is the receipt
        // cash actually changes hands on, so it refuses rather than printing a number
        // nobody can check. Scores are untouched and still on every other screen.
        const dupNames = (typeof duplicatePlayerNames === 'function')
            ? duplicatePlayerNames(players) : [];
        if (dupNames.length > 0) {
            const esc = t => String(t).replace(/[&<>"]/g,
                c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            container.innerHTML = '<div class="settle-card" style="background:var(--warn-bg); '
                + 'border:2px solid var(--warn-border);">'
                + '<div class="settle-header" style="color:var(--warn-text);">'
                + '\u26A0\uFE0F Money Not Totalled</div>'
                + dupNames.map(d => '<div style="font-size:0.82rem; padding:6px 0;">'
                    + (d.count > 2 ? d.count + ' golfers are all called' : 'Two golfers are both called')
                    + ' <strong>' + esc(d.name) + '</strong>. Every total on this '
                    + 'page is added up by name, so their money would be merged into one '
                    + 'balance and somebody would pay the other\u2019s debts. Rename one of '
                    + 'them in Setup, then come back.</div>').join('')
                + '</div>';
            return;
        }

        // `contributions` is the canonical per-golfer breakdown added in the Wave 2B
        // foundation. Destructured here so the ledger below reads engine output rather
        // than recomputing anything.
        const { netByName, transactions, contributions } = computeCombinedNetTotals(data, courseData, savedScores);
        const totals = Object.values(netByName);

        // Nothing to combine yet (no scores, no active bets) — stay quiet rather than show an
        // empty "Final Results" card above the real per-game breakdowns below.
        if (totals.length === 0 || totals.every(t => t.net === 0)) { container.innerHTML = ''; return; }

        const sorted = totals.slice().sort((a, b) => b.net - a.net);

        // "FINAL" IS A CLAIM AND IT HAS TO BE EARNED - and it was earned at the
        // gate above: this branch renders only when receiptSettlement() said
        // settled. A "⏳ Results — Not Final" alternative used to sit here, re-asking
        // computeMoneyPool with the same inputs the gate had already passed; it could
        // never be chosen, and it was removed (2026-09-15) so nobody reads it as a
        // second guard. The one guard is the gate.
        // THE ORDER (v196, 2026-09-22): the header and 💰 PAY OUT lead, in
        // #results-top above the game cards; this mount keeps Who Pays Who (only
        // when anybody pays anybody); NET +/− closes the money in #results-net,
        // after the side games, collapsed. Gone: the per-golfer PLAYER PAYOUTS
        // ledger (its lines are each Pay out row's reasons now) and the pool-off
        // "🏁 Final Results" list (the Net view is that list, on every round).
        const pool = (typeof computeMoneyPool === 'function' && data.moneyPool && data.moneyPool.enabled !== false)
            ? computeMoneyPool(data, courseData, savedScores) : null;
        if (topMount) topMount.innerHTML = buildReceiptHeader() + buildPayoutCardHtml(contributions, sorted, pool, data);
        if (netMount) netMount.innerHTML = buildNetViewHtml(sorted);

        let html = '';
        // ---- WHO PAYS WHO, ONLY WHEN ANYBODY ACTUALLY PAYS ANYBODY ----------
        //
        // The reasoning now lives with the predicate, in action-model.js, so this page
        // and Trip Mode ask one question instead of keeping two copies that drift.
        if (transactions.length > 0 && hasPlayerToPlayerSettlement(contributions)) {
            html += `<div class="settle-card">
                <div class="settle-header">🤝 Who Pays Who</div>`;
            transactions.forEach(t => {
                html += `<div class="ledger-row"><span>${t.from} → ${t.to}</span><span class="val-neg">$${fmtWhole(t.amount)}</span></div>`;
            });
            html += `</div>`;
        }

        container.innerHTML = html;
        // The receipt is on screen and final: the one way to send it goes on.
        setReceiptAction(true);
    }

    // THE SEND PILL ("📤 Send"), in #receipt-actions on the title row. On or off,
    // nothing else: the label lives here and nowhere else (v152: one button, one
    // label), it calls the same printReceipt() the full-width button did, and it
    // sits outside every export root so it never rides into the PDF. 📤 is the
    // app's glyph for the share sheet (the trip recap's Share, the tournament
    // link copy) - kept at this size on purpose, so the pill reads as a button
    // and not a link.
    function setReceiptAction(show) {
        const mount = document.getElementById('receipt-actions');
        if (!mount) return;
        mount.innerHTML = show
            ? '<button class="receipt-send" onclick="printReceipt()">\uD83D\uDCE4 Send</button>'
            : '';
    }

    // Scores come LAST. The money story is what a golfer opens this document for, and
    // the grid is the reference you check afterwards - so it renders into its own
    // container, which sits after every money section in the markup.
    function renderReceiptScorecard() {
        const el = document.getElementById('receipt-scorecard');
        if (!el) return;
        el.innerHTML = buildReceiptScorecard();
    }

    function renderSettlement(data) {
        const container = document.getElementById("settle-content");
        const players = data.players || [];
        const courseData = data.courseData || [];
        const savedScores = data.scores || {};
        const gameFormat = data.gameFormat || "stroke";
        const holeBet = data.holeBetStake || 0;

        // Only players opted in to money betting are included in payout math below -
        // everyone still scores normally regardless of this flag (team formats never show
        // this checkbox, so it's a no-op there and full teams stay intact).
        const moneyPlayers = players.filter(p => p.playingForMoney !== false);
        // ONE WORD, DECIDED ONCE, for every heading below: the engine's predicate,
        // the same answer the gate above and the trip read.
        const isFinal = receiptSettlement(data, courseData, savedScores).settled;

        if (gameFormat === 'skins') {
            const skinsNet = computeSkinsSettlementNet(data, courseData, savedScores);
            // THE HEADER NOW COMES FROM THE SAME RESOLVER AS THE LEDGER BELOW IT.
            // This read `!== false` and printed "Final Skins Settlement (Carry
            // Over)" over a ledger the engine had computed with NO carry - one
            // page, a label and a number that disagreed. Measured: header said
            // CARRY OVER, ledger said Ann +$5, Ben +$5, Cal -$10.
            const carryOver = (typeof skinsCarriesOver === 'function')
                ? skinsCarriesOver(data.skinsCarryOver) : data.skinsCarryOver === true;
            let ledgerHtml = "";
            moneyPlayers.forEach(p => {
                const money = skinsNet[p.id] || 0;
                ledgerHtml += `<div class="ledger-row"><span>${escapeHtml(p.name)}:</span>${fmtSignedHtml(money)}</div>`;
            });
            container.innerHTML = `
                <div class="settle-card">
                    <div class="settle-header">🥩 ${settleHeading('Skins Settlement', ` (${carryOver ? 'Carry Over' : 'No Carry'})`, isFinal)}</div>
                    ${ledgerHtml}
                </div>
                ${buildSideGamesHtml(data, courseData, savedScores)}
            `;
            return;
        }

        if (gameFormat === 'hilo') {
            const hiloNet = computeHiLoSettlementNet(data, courseData, savedScores);
            const calc = calculateHiLoEngine(moneyPlayers, courseData, savedScores);
            let ledgerHtml = "";
            moneyPlayers.forEach(p => {
                const money = hiloNet[p.id] || 0;
                ledgerHtml += `<div class="ledger-row"><span>${escapeHtml(p.name)}:</span>${fmtSignedHtml(money)}</div>`;
            });
            const pointsLine = calc ? `<p style="font-size:0.78rem; color:var(--text-muted); margin-top:0;">${calc.t1Name}: ${calc.t1Points} pts &nbsp;|&nbsp; ${calc.t2Name}: ${calc.t2Points} pts</p>` : '';
            container.innerHTML = `
                <div class="settle-card">
                    <div class="settle-header">↕️ ${settleHeading('Hi-Lo Settlement', '', isFinal)}</div>
                    ${pointsLine}
                    ${ledgerHtml}
                </div>
                ${buildSideGamesHtml(data, courseData, savedScores)}
            `;
            return;
        }

        if (gameFormat === 'wolf') {
            const wolfCalc = calcWolfEngine(data, courseData, savedScores);
            const wolfMoney = calcPointSettlement(moneyPlayers, wolfCalc.totals, data.wolfPointVal || 0);
            let ledgerHtml = "";

            moneyPlayers.forEach(p => {
                let pts = wolfCalc.totals[p.id] || 0;
                let money = wolfMoney[p.id] || 0;
                ledgerHtml += `
                    <div class="ledger-row">
                        <span>${escapeHtml(p.name)} (${pts} pt${pts === 1 ? '' : 's'}):</span>
                        ${fmtSignedHtml(money)}
                    </div>
                `;
            });

            if (players.length !== 4) {
                ledgerHtml = `<div style="text-align:center; color: var(--text-muted); padding: 10px;">Wolf requires exactly 4 players — check the Home/setup page.</div>`;
            }

            container.innerHTML = `
                <div class="settle-card">
                    <div class="settle-header">🐺 ${settleHeading('Wolf Settlement', '', isFinal)}</div>
                    ${ledgerHtml}
                </div>
                ${buildSideGamesHtml(data, courseData, savedScores)}
            `;
            return;
        }

        if (gameFormat === 'stableford') {
            const sfCalc = calcStablefordEngine(data, courseData, savedScores);
            const sfMoney = calcPointSettlement(moneyPlayers, sfCalc.totals, data.stablefordPointVal || 0);
            let ledgerHtml = "";

            moneyPlayers.forEach(p => {
                let pts = sfCalc.totals[p.id] || 0;
                let money = sfMoney[p.id] || 0;
                ledgerHtml += `
                    <div class="ledger-row">
                        <span>${escapeHtml(p.name)} (${pts} pt${pts === 1 ? '' : 's'}):</span>
                        ${fmtSignedHtml(money)}
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="settle-card">
                    <div class="settle-header">⭐ ${settleHeading('Stableford Settlement', '', isFinal)}</div>
                    ${ledgerHtml}
                </div>
                ${buildSideGamesHtml(data, courseData, savedScores)}
            `;
            return;
        }

        if (gameFormat === 'dots') {
            const dotsCalc = calcDotsEngine(data, courseData, savedScores);
            let dotVal = data.dotPointVal || 0;
            let ledgerHtml = "";
            
            moneyPlayers.forEach(p => {
                let pts = dotsCalc.totals[p.id] || 0;
                let money = pts * dotVal;
                ledgerHtml += `
                    <div class="ledger-row">
                        <span>${escapeHtml(p.name)} (${pts} Dots):</span>
                        ${fmtSignedHtml(money)}
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="settle-card">
                    <div class="settle-header">🔘 ${settleHeading('Dot Game Settlement', '', isFinal)}</div>
                    ${ledgerHtml}
                    ${unclaimedKpNoteHtml(data, courseData, savedScores)}
                </div>
                ${buildSideGamesHtml(data, courseData, savedScores)}
            `;
            return;
        }

        // ------------------------------------------------------------------
        // THE KPs NOBODY WON.
        //
        // DESCRIPTIVE ONLY. This reads canonical state and returns text. It is
        // appended INSIDE the Dots card, after the ledger that was already built,
        // and touches no total, no net, no who-pays-whom and no receipt figure.
        // A carry that died unclaimed is worth exactly nothing, because nobody ever
        // put money in - there is no pot in this game, only per-opponent debts that
        // arise when somebody actually wins. Saying so is the entire point: without
        // this line the group sees a winner paid for one KP and no account of the
        // two that rolled past unwon.
        //
        // Shown only when there is something true to say: carryovers on, and units
        // still riding at the finish.
        function unclaimedKpNoteHtml(data, courseData, savedScores) {
            if (!data || data.greenieCarryover !== true) return '';
            if (typeof greenieCarryMap !== 'function') return '';
            let map;
            try {
                map = greenieCarryMap(data, courseData || [], savedScores || {}, data.players || []);
            } catch (e) { return ''; }

            // riding is the value the NEXT KP would have carried. It sits at 1 whenever
            // the last eligible par 3 was won, so anything above 1 means unwon units
            // outlived the round.
            const unwon = (map.riding || 1) - 1;
            if (unwon < 1) return '';

            const dollars = parseFloat(data.dotPointVal) || 0;
            const each = dollars > 0 ? '$' + (map.riding * dollars).toFixed(0) + ' each riding' : '';
            const label = unwon === 1 ? '1 KP unclaimed at finish' : unwon + ' KPs unclaimed at finish';
            return `<div class="settle-row" style="opacity:0.85;">
                        <span>${label}${each ? ' \u00B7 ' + each : ''}</span>
                        <span style="font-weight:bold;">No payout</span>
                    </div>`;
        }

        if (gameFormat === 'stroke') {
            const sideHtml = buildSideGamesHtml(data, courseData, savedScores);
            if (sideHtml) {
                container.innerHTML = sideHtml;
            } else if (typeof computeMoneyPool === 'function' && computeMoneyPool(data, courseData, savedScores)) {
                // THE DENIAL BELOW ASKED THE WRONG QUESTION. It fired on "no side
                // games" and never looked at the Main Pool, so the ordinary pool
                // round - a pot, no side matches - printed "No money bets were set
                // up for this round" as the FIRST line under the header and then
                // $480 of pool money four words below it. On screen and in the
                // exported receipt both. Measured, not supposed.
                //
                // THE SAME QUESTION THE POOL CARD ASKS, so the two cannot disagree:
                // renderMoneyPoolSection shows the Main Pool when computeMoneyPool
                // returns a result and hides it when it does not. The denial now
                // appears if and only if that card does not.
                //
                // Emptied rather than given a heading of its own: the Main Pool card
                // immediately below IS this round's ledger, and printReceipt drops
                // roots that render empty, so the export starts at the header and
                // goes straight to the money instead of carrying a bare "Final
                // Ledger" title with nothing under it.
                container.innerHTML = '';
            } else {
                container.innerHTML = `
                    <div class="settle-card">
                        <div class="settle-header">${settleHeading('Ledger', '', isFinal)}</div>
                        <div style="text-align: center; color: var(--text-muted); padding: 10px;">No money bets were set up for this round.</div>
                    </div>
                `;
            }
            return;
        }

        if (gameFormat === 'match' && data.matchScoringStyle === 'stroke') {
            const scoringType = data.matchScoring || 'net';
            const matchStake = data.matchStake || 0;
            const strokePresses = data.strokePresses ? Object.values(data.strokePresses) : [];
            const pressSet = calculateStrokePressSet(moneyPlayers, courseData, savedScores, scoringType, matchStake, strokePresses);
            const sideHtml = buildSideGamesHtml(data, courseData, savedScores);

            if (!pressSet) {
                container.innerHTML = `
                    <div class="settle-card">
                        <div class="settle-header">${settleHeading('Ledger', '', isFinal)}</div>
                        <div style="text-align: center; color: #555; padding: 10px;">Stroke Play 1v1 requires exactly 2 players.</div>
                    </div>
                    ${sideHtml}
                `;
                return;
            }

            const fmtStrokeSettle = fmtSignedHtml;

            const calc = pressSet.original;
            let pressBreakdownHtml = '';
            pressSet.pressResults.forEach(pr => {
                const winnerName = pr.roundComplete && pr.winner ? (pr.winner === pr.p1.id ? pr.p1.name : pr.p2.name) : null;
                const prStatus = !pr.roundComplete
                    ? `Not yet final — thru ${pr.holesCompleted} holes of this press`
                    : (winnerName ? `${escapeHtml(winnerName)} won $${pr.stake}` : 'Tied, no money');
                pressBreakdownHtml += `<div class="breakdown-item"><span>Press ${pr.pressNum} (Hole ${pr.startHole}, $${pr.stake}):</span> <span>${prStatus}</span></div>`;
            });

            container.innerHTML = `
                <div class="settle-card">
                    <div class="settle-header">${settleHeading('Ledger', ' — 1v1 (Stroke Play)', isFinal)}</div>
                    <div class="breakdown-item"><span>Original — $${matchStake} Flat:</span> <span>${calc.p1.name} ${calc.holesCompleted > 0 ? calc.p1Total : '-'} | ${calc.p2.name} ${calc.holesCompleted > 0 ? calc.p2Total : '-'}</span></div>
                    ${!calc.roundComplete ? `<div class="breakdown-item"><span style="color:#888;">Not yet final — thru ${calc.holesCompleted} of ${calc.totalHoles}.</span></div>` : ''}
                    ${pressBreakdownHtml}
                    <div class="ledger-row" style="margin-top:10px;"><span>${pressSet.p1.name}</span>${fmtStrokeSettle(pressSet.combinedT1Money)}</div>
                    <div class="ledger-row"><span>${pressSet.p2.name}</span>${fmtStrokeSettle(-pressSet.combinedT1Money)}</div>
                </div>
                ${sideHtml}
            `;
            return;
        }

        if (gameFormat !== 'nassau' && !['match', 'bestball', 'scramble', 'ryder'].includes(gameFormat)) {
            const sideHtml = buildSideGamesHtml(data, courseData, savedScores);
            container.innerHTML = `
                <div class="settle-card">
                    <div class="settle-header">${settleHeading('Ledger', '', isFinal)}</div>
                    <div style="text-align: center; color: #555; padding: 10px;">Settlement calculations are currently built for Match Play, Nassau, Dot, Wolf, and Stableford formats.</div>
                </div>
                ${sideHtml}
            `;
            return;
        }

        let scoringType = data.nassauScoring || data.matchScoring || "net";
        let pressRule = gameFormat === 'nassau' ? (data.nassauPressRule || "none") : (data.matchPressRule || "none");
        let nassauStake = data.nassauStake || 10;
        let matchStake = data.matchStake || 0;
        let stakeToUse = gameFormat === 'nassau' ? nassauStake : matchStake;

        const manualMatchPresses = data.matchPresses ? Object.values(data.matchPresses) : [];
        const matchData = calculateMatchEngine(moneyPlayers, courseData, savedScores, scoringType, gameFormat, pressRule, stakeToUse, holeBet, manualMatchPresses);

        if (!matchData) {
            const sideHtml = buildSideGamesHtml(data, courseData, savedScores);
            container.innerHTML = `
                <div class="settle-card">
                    <div class="settle-header">${settleHeading('Ledger', '', isFinal)}</div>
                    <div style="text-align: center; color: #555; padding: 10px;">Waiting for players and scores to be entered...</div>
                </div>
                ${sideHtml}
                
            `;
            return;
        }

        let breakdownHtml = "";
        
        if (gameFormat === 'nassau') {
            ['F9', 'B9', '18'].forEach(bId => {
                let groupMatches = matchData.activeMatches.filter(m => m.baseId === bId);
                if(groupMatches.length > 0) {
                    let groupLabel = bId === 'F9' ? 'Front 9' : (bId === 'B9' ? 'Back 9' : 'Total');
                    breakdownHtml += `<div style="background:#e0e8e4; color:#0f4c3a; padding:4px 8px; font-weight:bold; font-size:0.75rem; text-transform:uppercase; margin-top:8px; border-radius:4px;">${groupLabel} Bets</div>`;
                    
                    groupMatches.forEach(m => {
                        let statusDesc = "All Square ($0)";
                        if (m.status > 0) statusDesc = `${matchData.t1Name} +$${stakeToUse}`;
                        else if (m.status < 0) statusDesc = `${matchData.t2Name} +$${stakeToUse}`;
                        
                        let lockIcon = m.closed ? "🔒 " : "";
                        let indent = m.pressNum > 0 ? "margin-left: 12px; border-left: 2px solid #2a9d8f; padding-left: 8px;" : "padding-left: 4px;";
                        breakdownHtml += `<div class="breakdown-item" style="border-bottom:1px solid #eee; padding: 4px 0; ${indent}"><span>${lockIcon}${m.label}:</span> <strong>${statusDesc}</strong></div>`;
                    });
                }
            });
        } else {
            let t18 = matchData.activeMatches.find(m => m.id === '18');
            let statusDesc = "All Square ($0)";
            if (holeBet > 0) {
                let amt = Math.abs(t18.status * holeBet);
                if (t18.status > 0) statusDesc = `${matchData.t1Name} Won (+${amt})`;
                else if (t18.status < 0) statusDesc = `${matchData.t2Name} Won (-${amt})`;
            } else {
                let amt = matchStake;
                if (t18.status > 0) statusDesc = `${matchData.t1Name} Won (+${amt})`;
                else if (t18.status < 0) statusDesc = `${matchData.t2Name} Won (-${amt})`;
            }
            breakdownHtml += `
                <div class="breakdown-item">
                    <span>Overall Match:</span>
                    <span><strong>${statusDesc}</strong></span>
                </div>
            `;
        }

        let t1Total = matchData.t1TotalMoney;
        const formatMoney = fmtSignedHtml;

        const sideHtml = buildSideGamesHtml(data, courseData, savedScores);

        // The old "Final Payout Settlement" card is gone. It described the same wager the
        // Side Matches section now describes properly, and describing one bet twice - once
        // in full and once as a single line - is exactly how a golfer ends up unsure which
        // number to believe. Per-player totals already appear in Final Results and Who
        // Pays Who above, so nothing is lost.
        container.innerHTML = `
            ${sideHtml}
        `;
    }
</script>

</body>
</html>
