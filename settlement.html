<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" href="hardpan-icon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Round Settlement</title>
    <script src="./firebase-app-compat.js"></script>
    <!-- Anonymous Auth at boot (MONETIZATION.md step 1). One tag, fire-and-forget:
         creates window.authReady now, signs in after the parse, never blocks render.
         Loads the auth SDK itself, asynchronously, so no page waits for it. -->
    <script src="auth-boot.js"></script>
    <script src="./firebase-database-compat.js"></script>
    <!-- Handicap. Every stroke a golfer receives, and every relative-handicap
         decision a match makes, comes from these seven functions. They used to be
         duplicated here and in four other places; this page now consumes the one
         shared definition. Loaded ahead of the money and settlement engines,
         because both call into it, and ahead of the inline block so nothing below
         can shadow it. (Deliberately no engine filenames in this comment:
         stack_action_test.js checks script order with a raw indexOf, and a comment
         that names a file ahead of its real tag reads as the wrong order.) -->
    <script src="handicap.js"></script>
    <script src="match-engine.js"></script>
    <!-- pwa-boot.js owns GolfNet.isNative(), which native-export.js asks before
         choosing between window.print() and the iOS share sheet. Build 4 shipped
         without it on this page: GolfNet was undefined, the exporter concluded
         "browser", and window.print() did nothing at all inside WKWebView. It must
         load BEFORE native-export.js is used, which defer guarantees for a click
         handler. -->
    <script src="pwa-boot.js" defer></script>
    <!-- window.print() is a no-op inside WKWebView. This routes the native build
         through a real PDF + the iOS share sheet, and leaves the browser alone. -->
    <script src="native-export.js"></script>
    <script src="text-safe.js"></script>
    <script src="score-marks.js"></script>
    <script src="money-engine.js"></script>
    <!-- The scorecard rows live once, in scorecard-rows.js (2026-09-16): the
         Full Scorecard below and the leaderboard's tap-a-name card draw from it.
         Loaded after score-marks.js (rings), text-safe.js and money-engine.js
         (net strokes), whose globals it reads. -->
    <script src="scorecard-rows.js"></script>
<script src="action-model.js"></script>
    <!-- v215: the Aloha bet's rules, BEFORE settlement-engine.js because that file
         calls into them. Every page that settles loads this: the call is guarded by
         typeof, so a page missing it would quietly settle the round WITHOUT the
         Aloha - two pages showing two different totals, which is the one failure
         this feature must not have. -->
    <script src="aloha-bet.js"></script>
<script src="settlement-engine.js"></script>
<script src="live-skins.js"></script>
<script src="pool-engine.js"></script>
<!-- Grouping (v141): playerGroupMap / canLinkSeeWager, so the SIDE MATCHES cards
     show a group link only the matches its golfers are in - the same rule, the
     same function, as the Matches, Bets, Board and Stats tabs. The MONEY is never
     scoped: Final Results, Player Payouts, Who Pays Who, the Weekly Game and every
     total are computed from the full record and shown to every link. -->
<script src="grouping.js"></script>
<!-- score-gaps.js (v192): "Not final — Marty is missing hole 1" on the money surfaces while a card has a blank hole inside it. -->
<script src="score-gaps.js"></script>
    <style>
        :root {
            --bg-page: #f4f6f8;
            --bg-card: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666;
            /* Between --text-main and --text-muted. Introduced because the net rows
               on the scorecard and leaderboards need to be clearly readable while
               staying subordinate to gross - muted was too faint, main too loud.
               It was previously referenced without ever being defined, so those rows
               ran on a hard-coded fallback and did not react to dark mode. */
            --text-secondary: #4a5568;
            --brand-green: #0f4c3a;
            --brand-navy: #1d3557;
            --accent-teal: #2a9d8f;
            --accent-red: #e63946;
            --border-light: #e0e0e0;
            --border-mid: #d0e1db;
            --border-faint: #eee;
            --nav-bg: #f0f4f2;
            --subtle-bg: #e0e8e4;
            --modal-bg: #ffffff;
            --input-disabled-bg: #dde3e8;
            --input-disabled-border: #aab4bc;
            --input-disabled-text: #1a1a1a;
            --shadow-color: rgba(0,0,0,0.08);
            --nassau-box-bg: #eef6f2;
            --danger-box-bg: #fff0f0;
        }
        html.dark-mode {
            --bg-page: #14181a;
            --bg-card: #1e2426;
            --text-main: #e8ecec;
            --text-muted: #9aa8a7;
            --text-secondary: #c2cecd;
            --brand-green: #2f9e78;
            --brand-navy: #4a7bb5;
            --accent-teal: #3dbfae;
            --accent-red: #ff6b76;
            --border-light: #333c3e;
            --border-mid: #3a4a45;
            --border-faint: #2c3436;
            --nav-bg: #223028;
            --subtle-bg: #26332d;
            --modal-bg: #1e2426;
            --input-disabled-bg: #3a4145;
            --input-disabled-border: #55606a;
            --input-disabled-text: #f0f0f0;
            --shadow-color: rgba(0,0,0,0.4);
            --nassau-box-bg: #1a2b24;
            --danger-box-bg: #2b1c1e;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-page); margin: 0; padding: 12px 12px 40px 12px; color: var(--text-main); -webkit-text-size-adjust: 100%; transition: background-color 0.2s ease, color 0.2s ease; }
        /* Reached FROM somewhere - the scorecard, the nav bar, a shared link - so it
           needs a way back to it. The nav bar lists destinations, not a return. */
        .back-btn { display: inline-flex; align-items: center; margin-bottom: 10px;
            color: var(--brand-navy); font-weight: bold; font-size: 0.85rem;
            text-decoration: none; cursor: pointer; min-height: 44px; }
        .container { max-width: 700px; margin: 0 auto; background: var(--bg-card); border-radius: 12px; box-shadow: 0 4px 12px var(--shadow-color); padding: 16px; }
        .event-title { text-align: center; font-size: 1.4rem; font-weight: bold; color: var(--brand-green); margin-top: 0; margin-bottom: 12px; }
        /* The title row and the Send pill (2026-09-16). 1fr auto 1fr keeps the
           title centred whenever the row has room for it; if a title were ever
           wider than the room beside the pill it would wrap in its own cell rather
           than slide under the button - the label was shortened from "Send
           Results" to "Send" precisely so a phone keeps the title on one line. The pill is half
           the title's size (0.7rem of 1.4rem) and styled as a secondary action
           beside a heading, not the page's primary button. */
        .title-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: 8px; margin-bottom: 12px; }
        .title-row .event-title { grid-column: 2; margin-bottom: 0; min-width: 0; text-wrap: balance; }
        .title-row .receipt-actions { grid-column: 3; justify-self: end; }
        /* THE PILL DROPS UNDER THE TITLE ON PHONES (2026-09-16, option 3). The
           breakpoint is measured, not round: the title "🤝 Settle (Weekend Round)"
           renders 282px wide at 1.4rem; the pill is 67px and the column gap 8px;
           body padding 12+12 and container padding 20+20 take 56px of the
           viewport. The title stays CENTRED beside the pill only while each 1fr
           side cell can hold the pill: content >= 282 + 2 x (67 + 8) = 432px, i.e.
           a viewport of 488px. Below that the grid would first slide the title off
           centre (down to 413px) and then wrap it - both the things this wave is
           for removing - so from 487px down the row is one column: the title alone,
           centred exactly as it always was, the pill beneath it at the right.
           A LONGER event name moves the true threshold up; at a width just above
           487 such a title slides rather than wraps. Measured, not guessed. */
        @media (max-width: 487px) {
            .title-row { grid-template-columns: 1fr; row-gap: 6px; }
            .title-row .event-title { grid-column: 1; }
            .title-row .receipt-actions { grid-column: 1; justify-self: end; }
        }
        /* An empty mount (live round) takes no row and no gap, so the title's
           position on a live round is byte-for-byte what it was before the pill. */
        .title-row .receipt-actions:empty { display: none; }
        .receipt-send { font-size: 0.7rem; font-weight: 700; line-height: 1; padding: 6px 10px; border: 1px solid var(--brand-green); border-radius: 999px; background: var(--bg-card); color: var(--brand-green); cursor: pointer; white-space: nowrap; }
        .receipt-send:active { background: var(--nassau-box-bg); }

        .theme-toggle-btn { background: var(--nav-bg); color: var(--brand-green); border: 1px solid var(--border-mid); border-radius: 16px; font-size: 0.75rem; font-weight: bold; padding: 6px 12px; cursor: pointer; white-space: nowrap; display: block; margin: 0 auto 12px auto; }

        /* Top Navigation Bar */
        /* ---- App navigation ----------------------------------------------------
           ALL EIGHT PAGES, ALWAYS VISIBLE (2026-09-14). The bar used to be a
           horizontal scroller of four pills beside a "⋯ More" popover holding the
           other four. Measured at 390px: the strip had 255px for 455px of pills,
           the scrollbar was hidden, so Scorecard showed, Leaderboard was clipped
           and Bets and Results were entirely off screen with nothing hinting they
           existed. Now the bar WRAPS: at phone width two rows of four, emoji plus
           a short label at 12px with 8px side padding (row 1 measured ~303px, row 2
           ~308px of the 334-342 available), one row on a wider screen. No More,
           no overflow, nothing to swipe. The pills grow to fill their row so the
           two rows read as a block. nav_bar_test.js measures it on every page. */
        .app-nav-wrap {
            display: block;
            padding: 8px 0; margin-bottom: 16px; border-bottom: 1px solid var(--border-light);
        }
        .top-nav-bar { display: flex; flex-wrap: wrap; gap: 6px; }
        .top-nav-item { flex: 1 1 auto; justify-content: center; padding: 8px 8px; min-height: 40px; background: var(--nav-bg); color: var(--brand-green); border: 1px solid var(--border-mid); border-radius: 20px; font-weight: bold; font-size: 12px; text-decoration: none; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .top-nav-item.active { background: var(--brand-green); color: #ffffff; border-color: var(--brand-green); }
        .top-nav-item.matches-nav-link { color: var(--brand-navy); border-color: var(--brand-navy); }
        .top-nav-item.matches-nav-link.active { background: var(--brand-navy); color: #ffffff; border-color: var(--brand-navy); }
        /* No invisible overlay here. An earlier version put a full-screen ::before on
           <summary> to catch outside taps; because summary also carried a z-index it
           formed a stacking context, and the catcher ended up painted OVER the menu,
           silently swallowing every tap on Matches / Stats / Trip / Home. Outside-tap
           closing is handled by a real listener in JS instead, which can actually close
           the menu rather than merely block it. */

        .live-head { border-color: var(--brand-green) !important; }
        .live-note { font-size: 0.74rem; color: var(--text-muted); text-align: center; }
        .lr-row { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border-faint); }
        .lr-pos { width: 34px; flex-shrink: 0; font-size: 0.72rem; font-weight: bold; color: var(--text-muted); }
        .lr-name { flex: 1; min-width: 0; font-weight: 600; font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lr-par { font-weight: bold; font-size: 1rem; color: var(--brand-green); }
        .lr-count { font-size: 0.78rem; font-weight: bold; color: var(--brand-green); white-space: nowrap; }
        .lr-holes { font-size: 0.76rem; color: var(--text-secondary); white-space: nowrap; }
        .lr-more { display: block; text-align: center; margin-top: 8px; padding: 10px; font-size: 0.8rem; font-weight: bold; color: var(--brand-green); text-decoration: none; }
        .lr-none { font-size: 0.8rem; color: var(--text-muted); font-style: italic; padding: 4px 0; }
        .lr-foot { font-size: 0.68rem; color: var(--text-muted); margin-top: 6px; }
        .lr-kp { font-size: 0.85rem; }
        .settle-card { background: var(--nassau-box-bg); border: 2px solid var(--accent-teal); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        /* v192: a blank hole inside a card - the money is not final until it is filled. */
        /* v195: a golfer marked Out on the Players sheet. */
        .golfer-out td { opacity: 0.55; text-decoration: line-through; }
        .gap-line { font-weight: bold; color: var(--accent-red); font-size: 0.85rem; margin: 0 0 8px 0; }
        /* THE HEADING HIERARCHY (v195b). A payer reading the Receipt could not see
           where Flight A ended and Flight B began: the section heads were the size of
           the rows. Three sizes, top down, each with a rule under it and air above:
             section  (.settle-header; a game card's .game-title, v196)  1.2rem, 2px rule
             sub      (none since v196 - each flight is a card of its own)
             row      (.ledger-row 0.95rem)                              0.95rem and under
           Numbers and rows are untouched; this is type and spacing only. */
        .settle-card { margin-top: 22px; }
        .settle-card:first-child { margin-top: 0; }
        .settle-header { font-size: 1.2rem; font-weight: bold; color: var(--brand-green); text-transform: uppercase; letter-spacing: 0.02em; margin: 0 0 12px 0; padding-bottom: 6px; border-bottom: 2px solid var(--brand-green); text-align: center; }
        
        .ledger-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg-card); border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border-mid); font-weight: bold; font-size: 0.95rem; color: var(--text-main); }
        .val-pos { color: var(--accent-teal); }
        .val-neg { color: var(--accent-red); }
        .val-even { color: var(--text-muted); }
        
        .match-breakdown-list { margin-top: 10px; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border-mid); padding-top: 8px; }
        .breakdown-item { display: flex; justify-content: space-between; padding: 3px 0; }

        .btn-primary { width: 100%; background-color: var(--brand-green); color: white; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; margin-top: 16px;}
        
        /* ---- The Receipt --------------------------------------------------------
           A vertical block per match: the original wager, every press with its start
           hole and stake, who won each segment, and the net. Designed to be read on a
           phone in a group chat, not printed as a spreadsheet. */
        .receipt-match { border: 1px solid var(--border-mid); border-radius: 10px; padding: 12px; margin: 10px 0; background: var(--bg-card); }
        .receipt-title { font-size: 1rem; font-weight: bold; color: var(--text-main); }
        .receipt-sub { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
        .receipt-seg { padding: 8px 0; border-top: 1px solid var(--border-faint); }
        .receipt-seg-head { display: flex; justify-content: space-between; font-size: 0.88rem; font-weight: bold; color: var(--text-main); }
        .receipt-seg-meta { font-size: 0.72rem; color: var(--text-muted); }
        .receipt-seg-result { font-size: 0.85rem; color: var(--text-main); margin-top: 2px; }
        .receipt-seg-money { font-size: 0.85rem; font-weight: bold; color: var(--brand-green); }
        .receipt-net { margin-top: 10px; padding-top: 8px; border-top: 2px solid var(--border-mid); font-size: 0.92rem; font-weight: bold; color: var(--brand-green); }
        .receipt-each { font-weight: normal; font-size: 0.78rem; color: var(--text-muted); }

        .receipt-head { text-align: center; margin-bottom: 14px; }
        /* THE MARK, PRINT ONLY. The printed receipt is the one thing that leaves the
           app - paper, a saved PDF, a group chat - so it carries the brand mark
           (logo-mark.png, the print mark, precached by sw.js and shipped in
           the native bundle - never a network fetch). On SCREEN it is display:none:
           the element is in the header so the print path needs no second header,
           and it takes no space, so nothing on the page moves. The size is set in
           the print block below. */
        .receipt-mark { display: none; }
        .receipt-head-course { font-size: 1.15rem; font-weight: bold; color: var(--brand-green); text-transform: uppercase; letter-spacing: 0.04em; }
        .receipt-head-date { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
        .receipt-head-format { font-size: 0.8rem; color: var(--text-main); margin-top: 2px; }

        /* The one wide element. It scrolls inside its own card so the money sections
           above it stay a single readable column on a phone. */
        .receipt-card-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .receipt-table { border-collapse: collapse; width: 100%; font-size: 0.72rem; }
        .receipt-table th, .receipt-table td { padding: 5px 4px; text-align: center; border-bottom: 1px solid var(--border-faint); color: var(--text-main); }
        .receipt-table th { background: var(--nav-bg); color: var(--brand-green); font-weight: bold; }
        .receipt-table .rt-name { text-align: left; white-space: nowrap; padding-right: 8px; }
        .receipt-table .rt-sec { background: var(--nassau-box-bg); font-weight: bold; }
        /* A thin ring, not a filled badge - the score stays the readable thing. Drawn
           with box-shadow so the cell keeps its size and the rows stay compact. */
        .receipt-table td.mark-birdie { box-shadow: inset 0 0 0 2px var(--accent-red); border-radius: 50%; }
        /* EAGLE IS A DOUBLE RED RING - two rings for two under, same colour as a
           birdie because it is the same achievement scaled up. Concentric rings are
           layered inset shadows; each later band draws behind the one before it. */
        .receipt-table td.mark-eagle {
            box-shadow: inset 0 0 0 2px var(--accent-red),
                        inset 0 0 0 4px var(--bg-card),
                        inset 0 0 0 6px var(--accent-red);
            border-radius: 50%;
        }
        /* Net rows sit tight under their golfer's gross row and are visually
           quieter, so the card still scans as one row per golfer. */
        /* NET IS SECONDARY, NOT INVISIBLE. At 0.72em in --text-muted this row was
           unreadable on a phone, defeating the point of printing it: net is how you
           check a net skin without doing handicap arithmetic in your head. It stays
           subordinate to gross through weight and colour, not by being too small to
           read. Row height is unchanged, so the card does not grow. */
        .rt-net td { font-size: 0.82em; color: var(--text-secondary, #4a5568); border-top: none; padding-top: 0; }
        .rt-net .rt-name { font-style: italic; }
        /* Player ledger. Note rows are indented and muted because they are ALREADY
           inside the row above them; only the un-indented rows add up to FINAL NET. */
        /* Tie explanation sits under the line it explains, quieter than it. */
        .nf-explain { font-size: 0.72rem; color: var(--text-muted); padding: 1px 0 1px 18px; }
        /* THE MAIN POOL IS SECTIONED (2026-09-14). Each game (KP, Net Finish, Skins
           Pot) is a bordered block with a header that reads as one; inside the
           Skins Pot each flight is a bordered block with its pot in the header.
           New classes, deliberately: .ledger-row is used by every other section and
           is not restyled. Their print rules sit in the print block further down. */
        /* (.pool-game / .pool-flight left with v196 - every game is a .game-card.) */
        /* A run of tied holes on a carry round: part of the money, not a result
           of its own, so it reads quieter than the hole that collected it. */
        .skins-carry-row { font-weight: normal; font-size: 0.82rem; color: var(--text-muted); padding-top: 6px; padding-bottom: 6px; }
        /* LIVE RESULTS: a SKINS WON card is a different kind of thing from a
           standings card, so it does not share the standings chrome; and every
           per-flight card carries its flight as a left edge - A teal, B navy - so
           the flight is a property of the card and not only words in its header. */
        .skins-card { background: var(--bg-card); border-style: dashed; }
        .settle-card[data-flight="A"] { border-left: 6px solid var(--accent-teal); }
        .settle-card[data-flight="B"] { border-left: 6px solid var(--brand-navy); }
        /* The three money mounts and the scorecard are separated by a rule - but
           only when they hold something, so an empty mount draws no bare line. */
        #combined-settlement-summary:not(:empty), #settle-content:not(:empty), #results-net:not(:empty), #receipt-scorecard:not(:empty) { border-top: 3px solid var(--border-mid); margin-top: 22px; padding-top: 16px; }
        /* ---- THE RESULTS ORDER (v196) ------------------------------------------
           #results-gap-line   the Not-final line, once, above everything.
           .payout-card        💰 PAY OUT: one <details> row per golfer, the amount
                               big; the reasons under it on a tap.
           .game-card          one card per game: a coloured head band (title left,
                               pot right), the winners by hole beneath. A flight
                               card keeps the A teal / B navy left edge.
           .net-view           NET +/−, a collapsed <details>, last. */
        #results-gap-line .results-gap { margin: 0 0 12px 0; font-size: 0.95rem; }
        .results-section-label { font-size: 0.78rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin: 22px 0 -10px 0; }
        .payout-card { border-color: var(--brand-green); }
        .po-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
        .po-total { font-size: 0.82rem; font-weight: bold; text-transform: none; letter-spacing: 0; color: var(--text-secondary); white-space: nowrap; }
        .po-row { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 8px; margin-bottom: 8px; }
        .po-row > summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; list-style: none; }
        .po-row > summary::-webkit-details-marker { display: none; }
        .po-row > summary::before { content: '\203A'; color: var(--text-muted); font-weight: bold; margin-right: 8px; transition: transform 0.15s; }
        .po-row[open] > summary::before { transform: rotate(90deg); }
        .po-name { flex: 1; min-width: 0; font-weight: 600; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .po-amt { font-size: 1.35rem; font-weight: bold; color: var(--accent-teal); white-space: nowrap; }
        .po-reason { display: flex; justify-content: space-between; gap: 12px; font-size: 0.82rem; color: var(--text-secondary); padding: 4px 14px 4px 36px; }
        .po-row > .po-reason:last-child { padding-bottom: 10px; }
        .po-none { font-size: 0.78rem; color: var(--text-muted); margin-top: 6px; }
        .game-card { padding: 0 0 6px 0; overflow: hidden; }
        .game-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 14px; margin-bottom: 8px; background: var(--brand-green); color: #fff; }
        .game-title { font-size: 1.2rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.02em; }
        .game-pot { font-size: 1rem; font-weight: bold; white-space: nowrap; }
        .game-kp .game-head { background: var(--brand-navy); }
        .game-net .game-head { background: #b8860b; }
        .game-skins .game-head { background: var(--accent-teal); }
        .game-skins[data-flight="B"] .game-head { background: var(--brand-navy); }
        .game-card > .ledger-row, .game-card > .nf-explain, .game-card > .game-note { margin-left: 10px; margin-right: 10px; }
        .game-note { font-size: 0.78rem; color: var(--text-muted); padding: 2px 4px 8px 4px; }

        /* THE NATIVE APP SEES THE SEND BUTTON (2026-09-16).
           From 98b4fc7 (2026-09-04) a rule here - html.is-native
           [onclick*="printReceipt"] { display: none !important; } - hid the export
           control in the Capacitor shell, because window.print() is a silent no-op
           in WKWebView and four TestFlight builds had failed to route around it.
           That reason is gone: native-export.js builds a real PDF (readable lines
           v151, the header once v152, the mark v153) and hands it to the iOS share
           sheet through the Filesystem and Share plugins the iOS target links.
           The rule is lifted; native_print_hidden_test.js records why it was there
           and why it no longer applies. UNTIL A REAL DEVICE HAS RUN IT, every proof
           of that path is Chrome with a stand-in - see HANDOFF, the Send pill section. */

        @media print {
            /* DARK MODE MUST NOT REACH PAPER.
               The theme is a class on <html>, and it survived into print. The block
               forced a white background but never reset the text colours, so a golfer
               who prints while in dark mode gets --text-main #e8ecec - near-white ink
               on white paper. The money sections would be effectively invisible in the
               saved PDF, and nothing on screen warns you before you share it.
               Redefining the variables here restores the light palette for print only;
               the on-screen theme is untouched. */
            html.dark-mode, html.dark-mode body {
                --bg-page: #ffffff; --bg-card: #ffffff;
                --text-main: #1a1a1a; --text-muted: #5b6666; --text-secondary: #4a5568;
                --brand-green: #0f4c3a; --brand-navy: #1d3557;
                --accent-teal: #2a9d8f; --accent-red: #e63946;
                --border-light: #e0e0e0; --border-mid: #d0e1db; --border-faint: #eee;
                --nav-bg: #f0f4f2; --subtle-bg: #e0e8e4; --modal-bg: #ffffff;
                --nassau-box-bg: #eef6f2; --danger-box-bg: #fff0f0;
                --shadow-color: rgba(0,0,0,0.08);
                background: #fff !important; color: #1a1a1a !important;
            }
            body { background-color: white; padding: 0; color: #1a1a1a; }
            .container { box-shadow: none; max-width: 100%; padding: 0; }
            /* The whole nav wrapper, not just the bar: the ⋯ More popover used to sit
               OUTSIDE .top-nav-bar and printed a navigation menu into a payout
               document. The popover is gone (2026-09-14, all eight pages are pills in
               the bar) but the wrapper stays hidden as a whole. */
            .top-nav-bar, .btn-primary, .event-title, .theme-toggle-btn,
            .app-nav-wrap, .receipt-actions { display: none !important; }
            .settle-card { border: 1px solid #ccc; background: #fff; }
            /* A match's story must not break across a page - the whole point is that a
               golfer can read one block and see how the money happened. */
            .receipt-match { break-inside: avoid; page-break-inside: avoid; border: 1px solid #ccc; background: #fff; }
            /* Money must not split across pages either - a Who Pays Who list broken after
               one row is exactly the sort of thing that starts an argument. */
            .settle-card { break-inside: avoid; page-break-inside: avoid; }
            /* (v196: one golfer's row and its reasons, one game card, the Net view -
               the break rules below; a card taller than a sheet still splits, which
               no rule can prevent.) */
            /* v195b: the heading hierarchy survives onto paper - sizes, rules and the air
               above a section; colours go to ink-safe greys/greens. */
            .settle-card { margin-top: 18px; }
            /* v196: the Pay out rows, the game cards and the Net view - never broken
               across a sheet; the head band keeps its colour on paper; a <details>
               row prints open (setPrintOpen), its reasons at row size. */
            .payout-card, .game-card, .net-view, .po-row { break-inside: avoid; page-break-inside: avoid; }
            .game-head { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; break-after: avoid; page-break-after: avoid; }
            .game-title, .po-head, .net-view > summary { font-size: 14pt; }
            .game-pot, .po-total, .po-amt { font-size: 11.5pt; }
            .po-name, .po-reason, .game-note { font-size: 9.5pt; }
            .po-row > summary::before, .net-view > summary::before { display: none; }
            .results-section-label { font-size: 9.5pt; }
            .settle-header { font-size: 14pt; border-bottom: 2px solid #0f4c3a; color: #0f4c3a; padding-bottom: 4pt; margin-top: 14pt; }
            .ledger-row { font-size: 9.5pt; }
            .game-card { border-color: #ccc; background: #fff; }
            .skins-card { border-style: dashed; }
            .settle-card[data-flight] { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .receipt-head { break-after: avoid; page-break-after: avoid; }
            /* 64 CSS px = 17 mm on paper: reads as a mark, does not dominate the sheet.
               The asset is 256 px, 4x the CSS size and 1.28x what 300 dpi needs
               (64 x 300/96 = 200 px), so it prints sharp - rattle_identity_test.js
               holds that rule. Centred above the course name, 6 px clear of it. */
            .receipt-mark { display: block; width: 64px; height: 64px; margin: 0 auto 6px auto; }
            /* The scorecard is the only section allowed its own page. */
            .receipt-card-wide { break-before: auto; page-break-inside: auto; }
            .receipt-card-scroll { overflow-x: visible; }
            /* Browsers drop box-shadows when saving to PDF unless told otherwise, and the
               PDF is exactly where these rings matter most. */
            /* The +/- colours carry meaning on a payout document, and browsers drop
               colour when saving to PDF unless told otherwise. */
            .val-pos, .val-neg, .val-even {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .receipt-table td.mark-birdie, .receipt-table td.mark-eagle,
            .legend-birdie, .legend-eagle {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .receipt-table td.mark-birdie, .legend-birdie {
                box-shadow: inset 0 0 0 2px #c1121f !important; border-radius: 50% !important;
            }
            .receipt-table td.mark-eagle, .legend-eagle {
                box-shadow: inset 0 0 0 2px #c1121f,
                            inset 0 0 0 4px #ffffff,
                            inset 0 0 0 6px #c1121f !important;
                border-radius: 50% !important;
            }
        }
    </style>
<style>

    <!-- THE RESULTS ORDER (v196, 2026-09-22), top to bottom, and the PDF reads the

    <div id="results-gap-line"></div>

</div>

<script>
    // --- CALENDAR-DATE SAFETY ---
    // There is deliberately NO date gate on this page.
    //
    // A beta "time bomb" used to live here: past a hardcoded date it replaced
    // document.body wholesale and threw, so the page went blank and stayed blank.
    // On the course that means a live round, a leaderboard or a settlement simply
    // vanishing mid-match. index.html was fixed in an earlier batch; this page and
    // four others were missed because the regression test only read index.html.
    //
    // ARCHITECTURAL RULE: a calendar date must never take a working round,
    // scorecard, leaderboard, settlement page, admin page or any other core app
    // page offline. Do not reintroduce a date gate here in any form.
    // ---------------------------

    const firebaseConfig = {
      apiKey: "AIzaSyB5sBBd-pdnrdp-nu60lHTMBUUd5Kwjfyk",
      authDomain: "golfapp-9fb21.firebaseapp.com",
      databaseURL: "https://golfapp-9fb21-default-rtdb.firebaseio.com",
      projectId: "golfapp-9fb21",
      storageBucket: "golfapp-9fb21.firebasestorage.app",
      messagingSenderId: "761739328763",
      appId: "1:761739328763:web:08ac41351578565c94045e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- DARK MODE ---
    (function initTheme() {
        const saved = localStorage.getItem('golfapp-theme');
        if (saved === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    })();


    // Back to wherever this page was opened from. history.back() alone is a dead
    // end on a cold link or a bookmark - there is nothing behind it, or what is
    // behind it is outside the app - so the referrer decides, exactly as
    // instructions.html has always done it.
    function goBack() {
        if (document.referrer && document.referrer.includes(window.location.host)) {
            history.back();
        } else {
            window.location.href = 'admin.html';
        }
    }

    function toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark-mode');
        localStorage.setItem('golfapp-theme', isDark ? 'dark' : 'light');
        const btn = document.getElementById('theme-toggle-btn');
        if (btn) btn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
    }

    document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('theme-toggle-btn');
        if (btn && document.documentElement.classList.contains('dark-mode')) {
            btn.textContent = '☀️ Light Mode';
        }
    });
    // ------------------

    const urlParams = new URLSearchParams(window.location.search);
    let currentMode = urlParams.get('game');
    // WHICH GROUP HOLDS THIS LINK (v141). It scopes the Side Matches CARDS only.
    const lockedGroup = urlParams.get('group') ? parseInt(urlParams.get('group'), 10) : null;
    let currentData = {};

    if (!currentMode) {
        window.location.href = "admin.html";
    } else {
        currentMode = currentMode.toUpperCase();
        document.getElementById("main-content").style.display = "block";

        document.querySelectorAll('.nav-link').forEach(link => {
            const base = link.getAttribute('href').split('?')[0];
            let navHref = base + '?game=' + currentMode;
            const groupParam = urlParams.get('group');
            if (groupParam) navHref += '&group=' + groupParam;
            link.href = navHref;
        });

        db.ref(`events/${currentMode}`).on('value', (snapshot) => {
            currentData = snapshot.val() || {};
            document.getElementById("main-title").textContent = `🤝 Settle (${currentData.eventName || "Weekend Round"})`;
            renderResultsGapLine(currentData);
            renderMoneyPoolSection(currentData, currentData.courseData || [], currentData.scores || {});
            renderCombinedSummary(currentData, currentData.courseData || [], currentData.scores || {});
            renderSettlement(currentData);
            renderReceiptScorecard();
        });
    }

    // parseHcp, getStrokes, calcWolfEngine, calcStablefordEngine, calcPointSettlement,
    // calculateMatchEngine, and calcDotsEngine now all live in money-engine.js so
    // settlement.html and trip.html always agree on the math. The old inline copies
    // that used to sit here have been removed.
    function formatMatchPill(score, t1Name, t2Name, isClosed, finalResult) {
        if (isClosed && finalResult) return finalResult;
        if (score === 0) return "AS";
        if (score > 0) return `${t1Name} ${score}UP`;
        return `${t2Name} ${Math.abs(score)}UP`;
    }

    // --- HOLE BET + OVERALL BET ENGINE (mirrors index.html for final settlement) ---



    // Same rule as Dots/Junk, verified consistent — a stroke-under-par unit (birdie=1,
    // eagle=2, already correctly weighted since "under" is the literal stroke count) is worth
    // its dollar value paid by every other player, not an isolated credit with no payer.

    // KP already correctly credited the winner (buyIn * (n-1)) — it just never debited anyone.
    // Same rule, now complete on both sides: each KP win is paid by every other player.

    // Cross-group Side Matches (from the ⚔️ Matches tab) — always shown regardless of primary format
    // THE RECEIPT, per match. Reads buildSideMatchReceipts() in settlement-engine.js -
    // the same engines settlement itself uses - so the story and the total can never
    // disagree. Deliberately a vertical list, not a table: this gets opened in a group
    // chat on a phone.
    // ---- THE RECEIPT: header + scorecard ------------------------------------
    // These are the only two things the retired index.html print path had that this
    // document did not. Everything else it produced - game ledgers for the main format,
    // Wolf, Stableford, Nassau, Skins, Birdie - the Receipt already covered, and covered
    // better, because it also shows side matches and press timelines.
    // Sets a useful document title so the saved PDF names itself after the round rather
    // than the page, then restores it - the title is what most browsers use as the
    // default filename.
    function printReceipt() {
        const course = ((currentData && currentData.courseName) || 'Golf Round')
            .replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');
        const d = new Date();
        const stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const title = `${course}-${stamp}-Receipt`;

        // ONE EXPORT, TWO DELIVERIES. On the web this still ends in window.print()
        // with the existing print CSS behind it. Inside Capacitor, window.print() is
        // a silent no-op, so the same document is turned into a real PDF and handed
        // to the iOS share sheet instead.
        //
        // The PDF is read out of THESE TWO NODES - the settlement document and the
        // scorecard beneath it, exactly as rendered. Nothing is recalculated, so the
        // exported money is the displayed money by construction.
        // EVERY SECTION THAT CARRIES MONEY, not just the one named "settle-content".
        //
        // THE EXPORT SHIPPED A RECEIPT WITH NO MONEY IN IT. These two ids are
        // SIBLINGS of the money sections, not their parents - on a Main Pool round
        // #settle-content holds only "No money bets were set up for this round", so
        // the PDF was that sentence plus a scorecard while $480 of pool money sat on
        // screen in #money-pool-section and #combined-settlement-summary. No error,
        // no empty file: a plausible-looking document missing the entire point.
        //
        // Listed in reading order, and empties are dropped so a round without a pool
        // does not export a blank heading.
        //
        // THE HEADER, ONCE (2026-09-15). buildReceiptHeader() renders INSIDE
        // #combined-settlement-summary (the settled branch of renderCombinedSummary
        // puts it first, then the print button, then the money), and
        // 'receipt-export-head' is that same element - so the PDF printed the course,
        // date and format twice: once as the first root and again inside the fourth.
        // The first root stays: the header belongs at the top of the document, and
        // the reading order below - side matches, the pool, the settlement - is the
        // order the money has always been exported in. The summary is exported as
        // its PARTS instead: its cards, minus the header (already the first root)
        // and minus any button (never exported). Same text, same order, three
        // lines fewer. The screen is untouched - nothing here renders.
        // Since 2026-09-16 the "📤 Send" pill lives in #receipt-actions on the
        // title row, outside every root; the BUTTON filter stays as the guard that
        // a button never rides into the PDF wherever it is rendered.
        //
        // THE PAPER IS THE SCREEN (v196, 2026-09-22): the roots are the page's
        // mounts IN THE ORDER THEY SIT ON SCREEN - RESULTS_MOUNTS, the one list -
        // so the Not-final line, the header and the Pay out list lead, the game
        // cards follow, then the side games, the Net view and the card. Until v196
        // the side games printed BEFORE the pool while the screen showed them after.
        // The header renders inside #results-top now (first on screen, first on
        // paper); the receipt-export-head filter below is kept only so a header
        // can never be exported twice if it is ever moved back.
        const summary = document.getElementById('combined-settlement-summary');
        const summaryParts = summary
            ? Array.from(summary.children).filter(el => el.id !== 'receipt-export-head' && el.tagName !== 'BUTTON')
            : [];
        const roots = RESULTS_MOUNTS
            .map(id => document.getElementById(id))
            .flatMap(el => (el && el.id === 'combined-settlement-summary') ? summaryParts : [el])
            .filter(el => el && (el.innerText || '').trim().length > 0);

        // REASONS PRINT EXPANDED. A Pay out row and the Net view are <details>,
        // closed on screen; paper cannot be tapped, so every one is opened for the
        // export and put back after (a Cmd+P print goes through the beforeprint /
        // afterprint pair below the same way).
        const restore = setPrintOpen(true);
        const done = () => restore();
        let result;
        try { result = window.RattleExport.exportOrPrint({ title: title, roots: roots }); }
        catch (e) { done(); throw e; }
        if (result && typeof result.then === 'function') return result.then(v => { done(); return v; }, e => { done(); throw e; });
        done();
        return result;
    }

    // The page's money mounts in screen order - the one list printReceipt reads
    // (paper order = screen order by construction) and results_payout_test.js
    // holds against the markup.
    const RESULTS_MOUNTS = ['results-gap-line', 'results-top', 'money-pool-section',
                            'combined-settlement-summary', 'settle-content', 'results-net', 'receipt-scorecard'];

    // Every <details class="print-open"> that is closed is opened; the returned
    // function closes exactly those again. Idempotent under a beforeprint that
    // fires while an export already opened them (nothing was closed, nothing is
    // put back).
    function setPrintOpen(on) {
        const closed = Array.from(document.querySelectorAll('details.print-open')).filter(d => !d.open);
        if (on) { closed.forEach(d => { d.open = true; }); window.__printOpenCount = (window.__printOpenCount || 0) + closed.length; }   // the count a cold check reads
        return () => closed.forEach(d => { d.open = false; });
    }
    let __printRestore = null;
    function onBeforePrint() { if (!__printRestore) __printRestore = setPrintOpen(true); }
    function onAfterPrint() { if (__printRestore) { __printRestore(); __printRestore = null; } }
    window.addEventListener('beforeprint', onBeforePrint);
    window.addEventListener('afterprint', onAfterPrint);

    // THE NOT-FINAL LINE, ONCE (v196). It used to render inside the Weekly Game
    // card and again inside the live head - twice on a held round. One mount,
    // above everything, on every round; empty when the round is final.
    function renderResultsGapLine(data) {
        const mount = document.getElementById('results-gap-line');
        if (!mount) return;
        mount.innerHTML = gapLineHtml(data, 'gap-line results-gap');
    }

    // ---- THE ONE MONEY DISPLAY RULE FOR THIS DOCUMENT -----------------------
    //
    // Settlement is allocated in whole dollars, so ".00" is noise. But a fraction is
    // never chopped off either: an explanatory per-game figure that genuinely lands on
    // $12.50 must print $12.50. The Receipt EXPLAINS the money; it must not restate it
    // as something tidier than it is. So: whole value -> no decimals, true fraction ->
    // shown honestly. A fraction appearing in canonical settlement would mean the
    // allocator failed, and that should be visible, not hidden.
    function fmtWhole(n) {
        // Thousands separators, because this is the document people settle from and
        // "$15000" is genuinely harder to read correctly at a glance than "$15,000".
        //
        // Grouping is applied to the WHOLE-DOLLAR part only, so a genuine fraction still
        // prints its cents exactly as before - a per-game figure that really is $12.50
        // must stay $12.50. Formatting only: fmtWhole's output is never parsed back
        // anywhere, so a comma cannot leak into a calculation.
        const group = v => String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        if (Number.isInteger(n)) return group(n);
        const fixed = n.toFixed(2);
        const neg = fixed.startsWith('-');
        const [whole, cents] = (neg ? fixed.slice(1) : fixed).split('.');
        return (neg ? '-' : '') + group(whole) + '.' + cents;
    }

    // The sign belongs in front of the dollar sign. "$-210" is not how money is
    // written anywhere outside a spreadsheet.
    function fmtSigned(n) {
        if (n > 0) return `+$${fmtWhole(n)}`;
        if (n < 0) return `-$${fmtWhole(Math.abs(n))}`;
        return '$0';
    }

    // Same rule, wrapped in the colour classes the ledger rows already use.
    function fmtSignedHtml(n) {
        if (n > 0) return `<span class="val-pos">${fmtSigned(n)}</span>`;
        if (n < 0) return `<span class="val-neg">${fmtSigned(n)}</span>`;
        return `<span class="val-even">$0</span>`;
    }

    // The engine's segment labels are canonical DATA ("Original", "Press 1") and are
    // deliberately not renamed there. This is the presentation layer translating them
    // into what a golfer reads. Nassau's own segment names pass straight through,
    // because "Front 9" is already plain golf English.
    function receiptSegLabel(label) {
        // 'Original' (Stroke Play) and 'Overall Match' (Match Play) are the same thing
        // to a golfer: the bet that was there before anybody pressed.
        if (/^(original|overall match)$/i.test(label || '')) return 'Original Bet';
        const m = /^press\s+(\d+)/i.exec(label || '');
        return m ? `Press #${m[1]}` : (label || '');
    }

    // ---- THE MISSING HOLE (v192) ----------------------------------------------
    // One line, drawn from score-gaps.js (per group, the round's boundaries): on
    // the LIVE RESULTS head, the Weekly Game card and the Receipt head, while any
    // golfer has a blank hole INSIDE their card. Names the Board's way. Empty -
    // and byte-identical to before - when there is no gap.
    function gapLineHtml(data, cls) {
        if (!data || typeof findScoreGapsByGroup !== 'function') return '';
        const players = data.players || [];
        // THE KP HOLD (2026-09-22): a KP hole with no recorded winner holds the
        // round open - verified or not (verification does not record a KP).
        const extras = [];
        if (typeof kpHoldPhrase === 'function' && typeof computeMoneyPool === 'function' && data.moneyPool && data.moneyPool.enabled !== false) {
            try { const r = computeMoneyPool(data, data.courseData || [], data.scores || {}); const ph = r && r.valid ? kpHoldPhrase(r.kp, h => holePlayedByField(players, data.scores, h)) : ''; if (ph) extras.push(ph); } catch (e) { /* an unreadable pool holds nothing here; the pool card says its own error */ }
        }
        // A VERIFIED round is final by the organizer's word for the SCORES
        // (settlement-engine.js computeRoundFinish - the one rule): a blank the
        // organizer accepted as a pickup is not "not final". The gap line is for
        // the live round; the KP hold applies either way.
        const verified = data.scoresVerified && data.scoresVerified.verified === true;
        const boundaries = (typeof computeGroupBoundaries === 'function') ? computeGroupBoundaries(players.length, data.groupSizeOverrides || {}) : null;
        const gaps = verified ? [] : findScoreGapsByGroup(players, data.courseData || [], data.scores || {}, boundaries);
        if (gaps.length === 0 && extras.length === 0) return '';
        const shown = g => { const p = players.find(x => String(x.id) === String(g.id)) || { name: g.name }; return escapeHtml(getSmartDisplayName(p, players)); };
        return '<div class="' + (cls || 'gap-line') + '">' + notFinalLine(gaps, shown, extras) + '</div>';
    }

    function buildReceiptHeader() {
        const course = (currentData && currentData.courseName) || 'Golf Round';
        const date = new Date().toLocaleDateString('en-US',
            { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        const fmtName = { stroke: 'Stroke Play', nassau: 'Nassau', match: 'Match Play',
            skins: 'Skins', dots: 'Dots / Junk', wolf: 'Wolf', stableford: 'Stableford',
            hilo: 'Hi-Lo', bestball: '2-Man Best Ball', scramble: 'Scramble', ryder: 'Ryder Cup' };
        const gameFormat = (currentData && currentData.gameFormat) || 'stroke';
        const scoring = (currentData && (currentData.nassauScoring || currentData.matchScoring)) || '';
        const sub = (fmtName[gameFormat] || gameFormat) + (scoring ? ' \u00B7 ' + (scoring === 'net' ? 'Net' : 'Gross') : '');

        // WHO IT IS FOR. A receipt that leaves the app names the course and the day
        // but not the group, so a golfer with two rounds on one weekend cannot tell
        // two PDFs apart. The roster count and the round's own name close that.
        const who = (currentData && currentData.players || []).length;
        const label = (currentData && (currentData.eventName || currentData.roundDay)) || '';
        // THE MARK sits first in the header, adjacent to the opening tag on purpose:
        // it is display:none on screen (print shows it), and an image contributes no
        // text, so the header's tag-stripped text and innerText are what they were -
        // receipt_final_prev.fixture.json still matches byte for byte. The native
        // PDF (native-export.js) reads innerText, so it gets nothing from this line;
        // that is stated in receipt_logo_test.js rather than hidden.
        return `<div class="receipt-head" id="receipt-export-head"><img class="receipt-mark" src="logo-mark.png" alt="HardPan" width="64" height="64">
            <div class="receipt-head-course">${course}</div>
            <div class="receipt-head-date">${date}</div>
            <div class="receipt-head-format">${sub}${who ? ' \u00B7 ' + who + ' golfer' + (who === 1 ? '' : 's') : ''}</div>
            ${label ? `<div class="receipt-head-group">${escapeHtml(label)}</div>` : ''}
        </div>`;
    }

    // The full 18-hole grid, preserved from the retired print path. Deliberately the one
    // wide element in the document: a scorecard is inherently tabular, and it sits last
    // so the money sections above it stay a readable single column on a phone.
    function buildReceiptScorecard() {
        const data = currentData || {};
        const courseData = (data.courseData || []).slice().sort((a, b) => a.hole - b.hole);
        const players = data.players || [];
        const scores = data.scores || {};
        if (courseData.length === 0 || players.length === 0) return '';

        const front = courseData.filter(h => h.hole <= 9);
        const back = courseData.filter(h => h.hole > 9);
        const hasFront = front.length > 0, hasBack = back.length > 0;

        const cell = (v, cls) => `<td${cls ? ` class="${cls}"` : ''}>${v}</td>`;
        // Birdie / eagle ring, from the SAME classifier the live Full Scorecard uses.
        // Only ever applied to a player's hole score - totals, the PAR row and empty
        // cells are left alone, because none of them is an achievement.
        const markOf = (score, par) =>
            (typeof scoreMarkClass === 'function') ? scoreMarkClass(score, par).trim() : '';
        let html = `<div class="settle-card receipt-card-wide">
            <div class="settle-header">\uD83D\uDCCB Full Scorecard</div>
            <div class="receipt-card-scroll"><table class="receipt-table">`;

        // IS NET RELEVANT TO THIS ROUND? One answer, in scorecard-rows.js
        // (netMattersOn - the rule this page wrote: handicaps AND a net pool, net
        // skins or stableford), so the board's tap-a-name card shows net on
        // exactly the same terms as the Receipt. Wave 2, 2026-09-16.
        const netMatters = ScorecardRows.netMattersOn(data);

        // THE ROWS LIVE ONCE (2026-09-16). HOLE / PAR / HCP, then per golfer the
        // gross row with the rings and, when net matters, the net row from the
        // canonical getStrokes/parseHcp - all from scorecard-rows.js, which the
        // leaderboard's tap-a-name card reads too. This page decides WHETHER net
        // matters (above) and keeps its own chrome; it no longer draws a cell.
        // Byte for byte what this function rendered before the move:
        // scorecard_rows_test.js holds eleven rounds to the captured output.
        html += ScorecardRows.scorecardRowsHtml({
            courseData: courseData, scores: scores, players: players,
            showNet: netMatters, ringOf: markOf
        });

        html += `</table></div>
            <div class="receipt-legend">
                <span class="legend-dot legend-birdie"></span> Birdie
                <span class="legend-dot legend-eagle"></span> Eagle or better
                ${netMatters ? '<span style="margin-left:10px;">net rows show the score after handicap strokes</span>' : ''}
            </div></div>`;

    }

    function buildReceiptBlock(matchId, data, courseData, savedScores) {
        if (typeof buildSideMatchReceipts !== 'function') return '';
        const r = buildSideMatchReceipts(data, courseData, savedScores).find(x => x.matchId === matchId);
        if (!r) return '';

        let html = `<div class="receipt-match">`;
        html += `<div class="receipt-title">${escapeHtml(r.nameA)} vs ${escapeHtml(r.nameB)}</div>`;
        html += `<div class="receipt-sub">${r.format} \u00B7 ${r.scoring}${r.isTeam ? ' \u00B7 2v2 (best ball)' : ''}</div>`;

        r.segments.forEach(seg => {
            html += `<div class="receipt-seg">`;
            html += `<div class="receipt-seg-head"><span>${receiptSegLabel(seg.label)}</span><span>$${fmtWhole(seg.stake)}</span></div>`;
            html += `<div class="receipt-seg-meta">Started Hole ${seg.startHole}</div>`;
            html += `<div class="receipt-seg-result">${escapeHtml(seg.result)}</div>`;
            if (seg.winner && seg.money > 0) {
                html += `<div class="receipt-seg-money">${escapeHtml(seg.winner)} +$${fmtWhole(seg.money)}</div>`;
            }
            html += `</div>`;
        });

        html += `<div class="receipt-net">MATCH NET \u00B7 ` +
            (r.netTo ? `${escapeHtml(r.netTo)} +$${fmtWhole(r.netAmount)}` : 'Push \u2014 nobody pays') +
            (r.isTeam && r.netTo ? ` <span class="receipt-each">($${fmtWhole(Math.abs(r.perPlayerA))} each)</span>` : '') +
            `</div>`;
        html += `</div>`;
        return html;
    }

    function buildSideMatchesHtml(data, courseData, savedScores) {
        // THE ROUND'S OWN WAGER IS A WAGER.
        //
        // A Match or Nassau created in setup used to render through a separate one-line
        // card - "Overall Match: Manny Won (-50)" - with no presses, no start holes and
        // no match net, while the identical bet created through Action printed its whole
        // history. settlement-engine.js already learned to describe the main game as a
        // virtual side match; this page never asked, so the improvement was built and
        // discarded. It asks now, through the SAME helper, so the two can never disagree
        // about what the round's wager was.
        //
        // DISPLAY ONLY. computeCombinedNetTotals is untouched and remains the sole source
        // of money - this changes what the Receipt EXPLAINS, never what anyone is paid.
        const sideMatches = Object.assign({}, data.sideMatches || {});
        const mainWager = (typeof legacyMainAsSideMatch === 'function')
            ? legacyMainAsSideMatch(data) : null;
        if (mainWager) sideMatches.__main = mainWager;

        // SCOPED TO THE LINK'S GROUP (v141), by the rule every other surface uses:
        // grouping.js canLinkSeeWager over the match's participants. A group link
        // sees the matches one of its golfers is in - a cross-group match shows to
        // both groups in it - and the bare link sees them all. The round's own
        // wager names the whole money field, so it is everybody's. The MONEY is
        // not scoped: computeCombinedNetTotals below still folds every match into
        // every total, so a golfer's Final Results line and Who Pays Who are the
        // same on every link. A golfer only has match money from matches they are
        // in, and those are always visible on their group's link - the total stays
        // traceable to the cards under it.
        const allIds = Object.keys(sideMatches);
        if (allIds.length === 0) return "";
        const groupOf = playerGroupMap(data.players || [], data.groupSizeOverrides || {});
        const matchIds = allIds.filter(id => {
            const sm = sideMatches[id] || {};
            return canLinkSeeWager((sm.teamAIds || []).concat(sm.teamBIds || []), lockedGroup, groupOf);
        });
        if (matchIds.length === 0) {
            // Matches exist; none of them are this group's. Say so rather than
            // rendering an empty card - or nothing, which reads as "no matches".
            return `<div class="settle-card"><div class="settle-header">⚔️ Side Matches</div>`
                + `<div class="ledger-row" style="font-weight:normal; color:var(--text-muted);"><span>No matches with a Group ${lockedGroup} golfer in them. `
                + `Every match is still counted in the totals above.</span><span></span></div></div>`;
        }

        const players = data.players || [];
        // FINAL MONEY is what actually changes hands, so it prints whole dollars.
        // The per-game rows keep their exact figures - they explain the canonical
        // math rather than stating what anyone owes.
        const fmtSideM = fmtSignedHtml;

        let rows = "";
        matchIds.sort((a, b) => (sideMatches[a].createdAt || 0) - (sideMatches[b].createdAt || 0)).forEach(matchId => {
            const sm = sideMatches[matchId];
            const teamAPlayers = players.filter(p => (sm.teamAIds || []).includes(String(p.id)) || (sm.teamAIds || []).includes(p.id)).map(p => ({ ...p, team: "Team 1" }));
            const teamBPlayers = players.filter(p => (sm.teamBIds || []).includes(String(p.id)) || (sm.teamBIds || []).includes(p.id)).map(p => ({ ...p, team: "Team 2" }));
            const virtualPlayers = teamAPlayers.concat(teamBPlayers);
            if (virtualPlayers.length < 2) return;

            // Only holes from this match's own start hole forward. A match with no
            // startHole covers the whole round, exactly as before. Declared ABOVE the
            // format branch because both branches settle over the same range.
            const smCourse = (typeof sideMatchHoles === 'function')
                ? sideMatchHoles(sm, courseData)
                : ((sm.startHole || 1) > 1 ? courseData.filter(h => h.hole >= sm.startHole) : courseData);

            if (sm.format === 'stroke') {
                const p1 = teamAPlayers[0], p2 = teamBPlayers[0];
                if (!p1 || !p2) return;
                const holeConfig = { holeEnabled: (sm.holeStake || 0) > 0, holeStake: sm.holeStake || 0, segment: sm.segment || 'full', tieRule: sm.tieRule || 'carry', scoringType: sm.scoring || 'net' };
                const overallConfig = { overallEnabled: (sm.overallStake || 0) > 0, overallStake: sm.overallStake || 0, overallMode: sm.overallMode || 'stroke', scoringType: sm.scoring || 'net' };
                const holePresses = sm.holePresses ? Object.values(sm.holePresses) : [];
                const overallPresses = sm.overallPresses ? Object.values(sm.overallPresses) : [];
                const holeCalc = holeConfig.holeEnabled ? calculateHoleBetEngine([p1, p2], smCourse, savedScores, holeConfig, holePresses) : null;
                const overallCalc = overallConfig.overallEnabled ? calculateOverallBetEngine([p1, p2], smCourse, savedScores, overallConfig, overallPresses) : null;
                const p1Total = (holeCalc ? holeCalc.p1Money : 0) + (overallCalc ? overallCalc.p1Money : 0);

                rows += buildReceiptBlock(matchId, data, courseData, savedScores);
            } else {
                // THE CALL THAT USED TO LIVE HERE COMPUTED NOTHING ANYONE READ.
                //
                // It was calculateMatchEngine(...) with NINE arguments - no
                // stakeConfig - and its result went into `calc`, which was then
                // used for exactly one thing: `if (!calc) return;`. The row
                // itself has always been built by buildReceiptBlock(), which
                // recomputes from buildSideMatchReceipts(). `formatLabel` was
                // assigned and never referenced.
                //
                // THE EARLY RETURN COULD NOT SAVE ANYTHING, AND THAT WAS
                // MEASURED RATHER THAN ASSUMED. calculateMatchEngine returns
                // null on one condition only - teamKeys.length < 2 - and the
                // guard above already drops the row when virtualPlayers is
                // shorter than two. The only way through both is two players on
                // the SAME team (teamBIds empty). Fed exactly that,
                // buildSideMatchReceipts returns [], so buildReceiptBlock
                // returns '' and the row renders nothing either way.
                //
                // So this is dead-code removal, not a money fix: no input
                // exists where deleting it changes a figure on screen. It
                // matters because a nine-argument call to the money engine
                // sitting in the Receipt reads like the Receipt's source of
                // truth, and the next person to price a Nassau segment here
                // would wire it to the wrong number.
                rows += buildReceiptBlock(matchId, data, courseData, savedScores);
            }
        });

        if (!rows) return "";
        return `<div class="settle-card"><div class="settle-header">⚔️ Side Matches</div>${rows}</div>`;
    }

    function buildSideGamesHtml(data, courseData, savedScores) {
        let html = "";

        if (data.birdieGameEnabled === true) {
            const totals = calculateBirdieGameTotalsForSettle(data, courseData, savedScores);
            const players = (data.players || []).filter(p => p.playingForMoney !== false);
            if (players.length > 0) {
                html += `<div class="settle-card"><div class="settle-header">🐦 Birdie Game (amount won)</div>`;
                players.forEach(p => {
                    // Was `$${n.toFixed(2)}` on the raw signed number, which printed a
                    // loss as "$-210.00". Signed properly, and without phantom cents.
                    html += `<div class="ledger-row"><span>${escapeHtml(p.name)}</span>${fmtSignedHtml(totals[p.id] || 0)}</div>`;
                });
                html += `</div>`;
            }
        }


        // STACKED / ADDITIONAL GAMES.
        //
        // These settle into Final Money through computeCombinedNetTotals, but nothing
        // itemised them here, so a golfer saw "Won $58" with no line explaining
        // where the skins money came from. That is the argument this document exists to
        // prevent. Now that several participant-scoped Skins games can run at once, the
        // gap is worse: two separate wagers, both invisible.
        //
        // Each card is built from computeGameNetByPlayerId - the SAME function the
        // combined ledger uses - so this breakdown can never disagree with the total it
        // is explaining. No second calculation, no chance of drift.
        if (typeof getRoundGames === 'function' && typeof computeGameNetByPlayerId === 'function') {
            getRoundGames(data).filter(g => g.role === 'additional').forEach(game => {
                let net = {};
                try { net = computeGameNetByPlayerId(game, courseData, savedScores) || {}; }
                catch (e) { return; }
                const ids = Object.keys(net);
                if (ids.length === 0) return;

                const label = (typeof describeGame === 'function') ? describeGame(game) : game.label;
                html += `<div class="settle-card"><div class="settle-header">${game.icon || ''} ${label}</div>`;
                const roster = data.players || [];
                ids.forEach(pid => {
                    const pl = roster.find(p => String(p.id) === String(pid));
                    html += `<div class="ledger-row"><span>${pl ? pl.name : pid}</span>${fmtSignedHtml(net[pid] || 0)}</div>`;
                });
                html += `</div>`;
            });
        }

        html += buildSideMatchesHtml(data, courseData, savedScores);

        return html;
    }

    // Combines every active money source in this round — main game, birdie pool, KP game, and
    // every side match — into one net-per-player total, then runs it through the same
    // simplifyDebts() Trip Mode already uses, so a round with several simultaneous bets doesn't
    // leave a golfer mentally adding up four separate cards to know what they actually owe.
    // Reuses the exact same engine calls the existing per-game rendering below already makes —
    // this is purely additive, none of that rendering logic is touched.
    // Fills a real, confirmed gap: computeRoundMoneyByPlayer (money-engine.js) has no branch for
    // 'skins' or 'hilo' as the MAIN format — a Skins or Hi-Lo round previously contributed
    // nothing to Final Results / Who Pays Who at all. Deliberately NOT touching money-engine.js
    // (the more protected canonical dispatcher) — these mirror the exact, already-tested formulas
    // already used elsewhere (skins.html's renderSkinsEngine payout math; index.html's Hi-Lo
    // ticker's (t1Points-t2Points)*holeBetStake) rather than inventing anything new.

    // Skins is a pot/ante game — every player pays in buyIn, winners split the pot. For a
    // zero-sum settlement figure (comparable to every other game's net win/loss), this is
    // payout MINUS what that player put into the pot, not the raw payout skins.html displays.
    // Exact copy of index.html's calculateHiLoEngine — not reinvented, same math verbatim.
    // This app has no shared-module system, so small engine functions are duplicated per file
    // by established convention; this one simply didn't exist here before, needed to compute
    // Hi-Lo's settlement contribution using the identical formula the live ticker already uses.


    // Reuses the exact (t1Points - t2Points) * holeBetStake formula already used in index.html's
    // live Hi-Lo ticker and print ledger — same split-evenly-among-teammates convention Nassau
    // and Match Play already use elsewhere in this same file.



    // MONEY POOL on the Receipt. Every bucket itemized, every winner named, every
    // refund stated with its reason - the pot must be explainable line by line or
    // it does not belong on this page. Pure read of computeMoneyPool(); the pool's
    // per-player nets are already folded into Final Results by the engine.
    // ---- SKINS ON THE RECEIPT ----------------------------------------------
    //
    // NO SKINS LOGIC LIVES HERE. Every winner, tie, net score and official flag
    // comes from computeSkinsHoleLedger() in settlement-engine.js - the canonical
    // ledger Wave 1 added - and every DOLLAR comes from the pool engine's own
    // allocated lines. This function only turns those two objects into rows.
    //
    // WHY IT PRINTED ONLY WINNERS BEFORE
    //
    // The old block walked r.skins.lines, which by construction contains one entry
    // per WON skin. A hole that tied produced no line, so it silently vanished from
    // the Receipt. A golfer reading it could not tell the difference between "hole 7
    // was tied" and "hole 7 is missing", and the only way to find out was the paper
    // card - which is the exact thing this whole batch exists to retire.
    //
    // THE CONFIG SHIM, AND WHY IT IS NOT OPTIONAL
    //
    // The ledger reads its scoring basis from data.skinsPotFormat and its field from
    // fieldParticipants(data). The MONEY POOL's skins bucket reads neither: its basis
    // is moneyPool.skins.scoring and its field is moneyPoolParticipants(). Those are
    // different config paths and can genuinely disagree - a round can have a net pool
    // bucket and a gross standalone skins game.
    //
    // Handing the ledger the raw round would therefore print a hole-by-hole ledger
    // for a DIFFERENT game than the one the money came from: right-looking rows,
    // wrong winners. So the pool's own resolved basis, carry rule and participant
    // list are passed in explicitly. The ledger still does all the deciding; it is
    // just told which game to decide about.
    // ONE CARD PER POT (v196). A flighted bucket is two sibling cards - "🥩 Skins —
    // Flight A" with "$360 · 12 golfers" on the right - and a field-wide bucket is
    // one; the split sentence and the carry notes sit under the first head. The
    // hole rows are buildSkinsPotRowsHtml's, unchanged; the per-pot "Skins Summary"
    // name-and-total list is gone - a golfer's total is printed once, in Pay out.
    function buildSkinsReceiptSection(r, data, courseData, savedScores, $) {
        const scoring = r.skins.scoring === 'gross' ? 'gross' : 'net';
        const basisLabel = scoring === 'gross' ? 'Gross' : 'Net';
        // One vocabulary for the carry rule across every surface that names it. "Void"
        // was app-only jargon - nobody at a course says it - and it appeared here, on
        // the Skins page toggle and in the Money Pool select while eight other surfaces
        // already said Carry Over / No Carry.
        const carryLabel = r.skins.carryOver ? 'carries' : 'no carry';

        let notes = `<div class="game-note">${basisLabel} skins, ${carryLabel}</div>`;
        let html = '';

        // A ROUND THAT NEVER SAID SAYS SO. An absent carry setting used to mean
        // "carry"; it now means "no carry", which is what a group that never
        // discussed it assumes. That flip RESTATES a legacy round's money, so it is
        // declared rather than applied quietly - a receipt whose numbers changed
        // between two openings with nothing explaining why is exactly the silent
        // wrongness this app keeps removing.
        const carryRecorded = (typeof skinsCarryRuleRecorded === 'function')
            ? skinsCarryRuleRecorded((((data || {}).moneyPool || {}).skins || {}).carryOver)
            : true;
        if (!carryRecorded) {
            notes += `<div class="game-note">This round did not record a carry rule — settled as `
                 + `<strong>No Carry</strong>, one skin per hole won outright.</div>`;
        }

        if (typeof computeSkinsHoleLedger !== 'function') {
            // The engine is the only source. Rather than quietly falling back to a
            // second implementation - the duplication this project keeps removing -
            // the Receipt says the detail is unavailable and still prints the money.
            r.skins.lines.forEach(l => {
                html += `<div class="ledger-row"><span>Hole ${l.hole}: ${escapeHtml(l.winnerName)}</span><span class="val-pos">${$(l.cents)}</span></div>`;
            });
            return gameCardHtml('game-skins', '🥩 Skins', $(r.skins.amountCents), notes + html);
        }

        // ONE POT OR TWO. pool-engine.js splits the bucket by flight when the
        // round's skins scope is per flight (r.skins.flights carries each pot's
        // golfers, dollars and lines); a field-wide bucket has no such view and is
        // drawn exactly as it always was. Either way each pot's ledger is built over
        // THAT pot's golfers with the round's flights stripped - the pool decided
        // the slicing, so the ledger must not slice again.
        const pots = r.skins.flights
            ? r.skins.flights
            : [{ flight: null, golfers: r.participants.length, amountCents: r.skins.amountCents, lines: r.skins.lines,
                 pendingUnits: r.skins.pendingUnits, unwonCents: r.skins.unwonCents }];
        if (r.skins.flights) {
            // 'evenly' or 'by headcount' - the engine's own predicate (skinsSplitMode),
            // never a guess from the two amounts. Headcount wording unchanged from v126.
            const splitWord = (typeof skinsSplitMode === 'function' && skinsSplitMode(data) === 'even') ? 'evenly' : 'by headcount';
            notes += `<div class="game-note">Split by flight, ${splitWord}: `
                 + r.skins.flights.map(f => `Flight ${f.flight} ${$(f.amountCents)} (${f.golfers} golfer${f.golfers === 1 ? '' : 's'})`).join(' · ')
                 + `</div>`;
        }
        pots.forEach((pot, i) => {
            const flighted = pot.flight !== null && pot.flight !== undefined;
            const rows = buildSkinsPotRowsHtml(pot, r, data, courseData, savedScores, $, scoring, basisLabel);
            html += gameCardHtml('game-skins', '🥩 Skins' + (flighted ? ' — Flight ' + pot.flight : ''),
                $(pot.amountCents) + (flighted ? ' · ' + pot.golfers + ' golfer' + (pot.golfers === 1 ? '' : 's') : ''),
                (i === 0 ? notes : '') + rows, flighted ? pot.flight : null);
        });
        return html;
    }

    // A GAME CARD (v196): a coloured head band - large title left, the pot right -
    // over the game's rows. The band prints in colour (print-color-adjust in the
    // print block) and a card never breaks across a sheet.
    function gameCardHtml(cls, title, pot, body, flight) {
        return `<div class="settle-card game-card ${cls}"${flight ? ` data-flight="${flight}"` : ''}>`
            + `<div class="game-head"><span class="game-title">${title}</span><span class="game-pot">${pot}</span></div>`
            + body + `</div><!-- /game-card -->`;
    }

    // One pot's rows: every hole that paid, in order, then the unwon money. (The
    // per-flight .pool-flight wrapper and the Skins Summary list left with v196;
    // the pot is a card of its own now, and a golfer's total is printed once.)
    function buildSkinsPotRowsHtml(pot, r, data, courseData, savedScores, $, scoring, basisLabel) {
        let html = '';
        const flighted = pot.flight !== null && pot.flight !== undefined;
        if (flighted && pot.golfers === 0) {
            html += `<div class="ledger-row"><span>Nobody in this flight — no pot.</span><span></span></div>`;
            return html;
        }
        // r.participants carries id and name only; the tag lives on the round's
        // player record, so the flight is read from there by id.
        const tagOf = (id) => { const p = (data.players || []).find(x => String(x.id) === String(id)); return p && typeof playerFlight === 'function' ? playerFlight(p) : 'A'; };
        const potIds = r.participants
            .filter(p => !flighted || tagOf(p.id) === pot.flight)
            .map(p => String(p.id));
        // THE MAIN POOL DECIDED THE SLICING (or did not slice): this ledger is priced
        // over the pot's participants by pool-engine, so it must not inherit the
        // round's flights, or the top-level ledger would be null.
        const ledgerCfg = Object.assign({}, data, {
            participantIds: potIds,
            skinsPotFormat: scoring,
            skinsCarryOver: r.skins.carryOver,
            flights: undefined,
        });
        const bundle = computeSkinsHoleLedger(ledgerCfg, courseData, savedScores);
        const L = scoring === 'gross' ? bundle.gross : bundle.net;
        if (!L) return html;

        // Dollars per hole come from the POOL's allocated lines, keyed by hole. In
        // whole-dollar mode those are already integers; nothing here rounds anything.
        const centsByHole = {};
        pot.lines.forEach(l => { centsByHole[String(l.hole)] = l.cents; });

        // ONLY THE HOLES THAT PAID (v136), IN THE SHARED WORDS (v138). The rows -
        // which holes are listed, how a carried run reads, what a collecting hole
        // says it collected - come from buildSkinsLedgerRows() in live-skins.js,
        // the one builder the scorecard's live panel and the leaderboard's board
        // read too, so the three cannot say different things about the same
        // hole. This page adds what is its own: the dollars from the pool's
        // allocated lines, "— Skin" on a plain win, the waiting row's wording
        // (a mid-round preview only) and the Receipt's markup. The hole is
        // written "Hole 7", not "H7" - this block is read by the person handing
        // out cash.
        buildSkinsLedgerRows(L, basisLabel).forEach(row => {
            if (row.kind === 'waiting') {
                // Only reachable on a Receipt previewed mid-round. A finished round
                // has every card in, so none of these rows appear.
                const who = row.missing.length > 0
                    ? row.missing.map(m => m.name).join(', ')
