            --subtle-bg: #e0e8e4;
            --modal-bg: #ffffff;

            --bg-card: #1e2426;
            --text-main: #e8ecec;
            --text-muted: #9aa8a7;

            --brand-navy: #4a7bb5;
            --accent-teal: #3dbfae;
            --accent-red: #ff6b76;
            --border-light: #333c3e;
            --border-mid: #3a4a45;
            --border-faint: #2c3436;

            --subtle-bg: #26332d;
            --modal-bg: #1e2426;
            --input-disabled-bg: #3a4145;
            --input-disabled-border: #55606a;
            --input-disabled-text: #f0f0f0;
            --shadow-color: rgba(0,0,0,0.4);
            --nassau-box-bg: #1a2b24;
            --danger-box-bg: #2b1c1e;

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-page); margin: 0; padding: 12px 12px 40px 12px; color: var(--text-main); -webkit-text-size-adjust: 100%; transition: background-color 0.2s ease, color 0.2s ease; }
        .container { max-width: 700px; margin: 0 auto; background: var(--bg-card); border-radius: 12px; box-shadow: 0 4px 12px var(--shadow-color); padding: 16px; }
        .event-title { text-align: center; font-size: 1.4rem; font-weight: bold; color: var(--brand-green); margin-top: 0; margin-bottom: 12px; }

        .theme-toggle-btn { background: var(--nav-bg); color: var(--brand-green); border: 1px solid var(--border-mid); border-radius: 16px; font-size: 0.75rem; font-weight: bold; padding: 6px 12px; cursor: pointer; white-space: nowrap; display: block; margin: 0 auto 12px auto; }

        /* Top Navigation Bar */
        .top-nav-bar { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; margin-bottom: 16px; border-bottom: 1px solid var(--border-light); -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .top-nav-bar::-webkit-scrollbar { display: none; }
        .top-nav-item { flex: 0 0 auto; padding: 8px 14px; background: var(--nav-bg); color: var(--brand-green); border: 1px solid var(--border-mid); border-radius: 20px; font-weight: bold; font-size: 0.85rem; text-decoration: none; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .top-nav-item.active { background: var(--brand-green); color: #ffffff; border-color: var(--brand-green); }

        .settle-card { background: var(--nassau-box-bg); border: 2px solid var(--accent-teal); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .settle-header { font-size: 0.9rem; font-weight: bold; color: var(--brand-green); text-transform: uppercase; margin-bottom: 12px; text-align: center; }
        
        .ledger-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg-card); border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border-mid); font-weight: bold; font-size: 0.95rem; color: var(--text-main); }
        .val-pos { color: var(--accent-teal); }
        .val-neg { color: var(--accent-red); }
        .val-even { color: var(--text-muted); }
        
        .match-breakdown-list { margin-top: 10px; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border-mid); padding-top: 8px; }
        .breakdown-item { display: flex; justify-content: space-between; padding: 3px 0; }

        .btn-primary { width: 100%; background-color: var(--brand-green); color: white; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; margin-top: 16px;}
        
        /* MAGIC PDF HIDING CSS */
        @media print {
            body { background-color: white; padding: 0; }
            .container { box-shadow: none; max-width: 100%; padding: 0; }
            .top-nav-bar, .btn-primary, .event-title, .theme-toggle-btn { display: none !important; }
            .settle-card { border: 1px solid #ccc; background: #fff; }
        }

<body>

<script>

    }
    // ---------------------------------

    const firebaseConfig = {
      apiKey: "AIzaSyB5sBBd-pdnrdp-nu60lHTMBUUd5Kwjfyk",
      authDomain: "golfapp-9fb21.firebaseapp.com",
      databaseURL: "https://golfapp-9fb21-default-rtdb.firebaseio.com",
      projectId: "golfapp-9fb21",
      storageBucket: "golfapp-9fb21.firebasestorage.app",
      messagingSenderId: "761739328763",
      appId: "1:761739328763:web:08ac41351578565c94045e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- DARK MODE ---
    (function initTheme() {
        const saved = localStorage.getItem('golfapp-theme');
        if (saved === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    })();

    function toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark-mode');
        localStorage.setItem('golfapp-theme', isDark ? 'dark' : 'light');
        const btn = document.getElementById('theme-toggle-btn');
        if (btn) btn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
    }

    document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('theme-toggle-btn');
        if (btn && document.documentElement.classList.contains('dark-mode')) {
            btn.textContent = '☀️ Light Mode';
        }
    });
    // ------------------

    const urlParams = new URLSearchParams(window.location.search);
    let currentMode = urlParams.get('game');
    let currentData = {};

    if (!currentMode) {
        window.location.href = "admin.html";
    } else {
        currentMode = currentMode.toUpperCase();
        document.getElementById("main-content").style.display = "block";

        document.querySelectorAll('.nav-link').forEach(link => {
            const base = link.getAttribute('href').split('?')[0];
            link.href = base + '?game=' + currentMode;
        });

        db.ref(`events/${currentMode}`).on('value', (snapshot) => {
            currentData = snapshot.val() || {};
            document.getElementById("main-title").textContent = `💸 Settle (${currentData.eventName || "Weekend Round"})`;
            renderSettlement(currentData);
        });
    }

    function parseHcp(hcpStr) {
        if (!hcpStr) return 0;
        const str = String(hcpStr).trim();
        if (str.startsWith("+")) return -Math.abs(parseFloat(str.substring(1)));
        return parseFloat(str) || 0;
    }

    function getStrokes(hcpIndex, numericHcp) {
        if (numericHcp >= 0) {
            let strokes = Math.floor(numericHcp / 18);
            if (hcpIndex <= (numericHcp % 18)) strokes += 1;
            return strokes;
        } else {
            const plusVal = Math.abs(numericHcp);
            if (hcpIndex > (18 - plusVal)) return -1;
            return 0;
        }
    }

    // --- WOLF GAME ENGINE (mirrors index.html) ---
    function calcWolfEngine(data, courseData, savedScores) {
        const players = data.players || [];
        const result = { totals: {}, holeLog: {}, carryPending: 0 };
        players.forEach(p => result.totals[p.id] = 0);
        if (players.length !== 4) return result;

        const loneMult = parseFloat(data.wolfLoneMult) || 2;
        const blindMult = parseFloat(data.wolfBlindMult) || 4;
        const tieRule = data.wolfTieRule || 'carry';
        const lastPlaceRule = data.wolfLastPlaceRule === 'on';
        const calls = data.wolfCalls || {};

        let carry = 0;
        const sortedHoles = (courseData || []).slice().sort((a, b) => a.hole - b.hole);

        sortedHoles.forEach(h => {
            const hole = h.hole;
            let wolfPlayer;
            if (lastPlaceRule && (hole === 17 || hole === 18)) {
                let sorted = players.slice().sort((a, b) => (result.totals[a.id] || 0) - (result.totals[b.id] || 0));
                wolfPlayer = sorted[0];
            } else {
                wolfPlayer = players[(hole - 1) % 4];
            }

            const callData = calls[`h${hole}`];
            const allScored = players.every(p => savedScores[`p${p.id}_h${hole}`]);

            let log = { hole, wolfId: wolfPlayer.id, wolfName: wolfPlayer.name, call: callData ? callData.call : null, partnerId: callData ? callData.partnerId : null, resolved: false, winner: null, pts: {} };

            if (!callData || !allScored) {
                result.holeLog[hole] = log;
                return;
            }

            let nets = {};
            players.forEach(p => {
                const gross = parseInt(savedScores[`p${p.id}_h${hole}`], 10);
                const strokes = getStrokes(h.hcpIndex, parseHcp(p.hcp));
                nets[p.id] = gross - strokes;
            });

            const others = players.filter(p => String(p.id) !== String(wolfPlayer.id));
            let winnerSide = null;
            let basePot = 0;

            if (callData.call === 'partner' && callData.partnerId) {
                const partner = others.find(p => String(p.id) === String(callData.partnerId));
                const rest = others.filter(p => String(p.id) !== String(callData.partnerId));
                if (partner && rest.length === 2) {
                    basePot = 2;
                    const teamScore = Math.min(nets[wolfPlayer.id], nets[partner.id]);
                    const oppScore = Math.min(nets[rest[0].id], nets[rest[1].id]);
                    if (teamScore < oppScore) {
                        winnerSide = 'wolf';
                        const pot = basePot + carry;
                        log.pts[wolfPlayer.id] = pot / 2;
                        log.pts[partner.id] = pot / 2;
                    } else if (oppScore < teamScore) {
                        winnerSide = 'other';
                        const pot = basePot + carry;
                        log.pts[rest[0].id] = pot / 2;
                        log.pts[rest[1].id] = pot / 2;
                    } else {
                        winnerSide = 'tie';
                    }
                }
            } else if (callData.call === 'lone' || callData.call === 'blind') {
                const mult = callData.call === 'blind' ? blindMult : loneMult;
                basePot = mult;
                const wolfScore = nets[wolfPlayer.id];
                const bestOther = Math.min(...others.map(p => nets[p.id]));
                if (wolfScore < bestOther) {
                    winnerSide = 'wolf';
                    log.pts[wolfPlayer.id] = basePot + carry;
                } else if (bestOther < wolfScore) {
                    winnerSide = 'other';
                    basePot = 3;
                    const pot = basePot + carry;
                    others.forEach(p => log.pts[p.id] = pot / 3);
                } else {
                    winnerSide = 'tie';
                }
            }

            if (winnerSide === 'tie') {
                log.winner = 'tie';
                if (tieRule === 'carry') carry += basePot;
            } else if (winnerSide) {
                log.winner = winnerSide;
                carry = 0;
                Object.keys(log.pts).forEach(pid => {
                    result.totals[pid] = (result.totals[pid] || 0) + log.pts[pid];
                });
            }

            log.resolved = !!winnerSide;
            result.holeLog[hole] = log;
        });

        result.carryPending = carry;
        return result;
    }

    // --- STABLEFORD ENGINE (mirrors index.html) ---
    function calcStablefordEngine(data, courseData, savedScores) {
        const players = data.players || [];
        const pts = data.stablefordPoints || { other: 0, bogey: 1, par: 2, birdie: 3, eagle: 5, albatross: 10 };
        let totals = {}, holeLog = {};
        players.forEach(p => totals[p.id] = 0);
        (courseData || []).forEach(h => {
            let log = {};
            players.forEach(p => {
                const v = savedScores[`p${p.id}_h${h.hole}`];
                if (!v) return;
                const gross = parseInt(v, 10);
                const strokes = getStrokes(h.hcpIndex, parseHcp(p.hcp));
                const net = gross - strokes;
                const diff = net - parseInt(h.par, 10);
                let awarded, label;
                if (diff <= -3) { awarded = pts.albatross; label = 'Alb'; }
                else if (diff === -2) { awarded = pts.eagle; label = 'Eagle'; }
                else if (diff === -1) { awarded = pts.birdie; label = 'Birdie'; }
                else if (diff === 0) { awarded = pts.par; label = 'Par'; }
                else if (diff === 1) { awarded = pts.bogey; label = 'Bogey'; }
                else { awarded = pts.other; label = 'Dbl+'; }
                totals[p.id] += awarded;
                log[p.id] = { pts: awarded, label };
            });
            holeLog[h.hole] = log;
        });
        return { totals, holeLog };
    }

    // Zero-sum $ settlement shared by Wolf and Stableford point totals
    function calcPointSettlement(players, totals, dollarPerPoint) {
        let money = {};
        const n = players.length;
        if (n === 0) return money;
        let sumPts = 0;
        players.forEach(p => sumPts += (totals[p.id] || 0));
        players.forEach(p => {
            const myPts = totals[p.id] || 0;
            money[p.id] = dollarPerPoint * (n * myPts - sumPts);
        });
        return money;
    }

    function calculateMatchEngine(players, courseData, savedScores, scoringType, gameFormat, pressRule, stake, holeBet, manualPresses) {
        let teams = {};
        players.forEach(p => {
            let key = p.team || "Team 1";
            if (!teams[key]) teams[key] = [];
            teams[key].push(p);
        });

        const teamKeys = Object.keys(teams);
        if (teamKeys.length < 2) return null;

        let t1Key = teamKeys[0];
        let t2Key = teamKeys[1];
        let t1Players = teams[t1Key];
        let t2Players = teams[t2Key];

        let t1Name = t1Players.map(p => p.name.split(" ")[0]).join("/");
        let t2Name = t2Players.map(p => p.name.split(" ")[0]).join("/");

        let hasFront = courseData.some(h => h.hole <= 9);
        let hasBack = courseData.some(h => h.hole > 9);

        let activeMatches = [];
        if (gameFormat === 'nassau') {
            if (hasFront && hasBack) {
                activeMatches = [
                    { id: 'F9', baseId: 'F9', startHole: 1, endHole: 9, status: 0, label: 'Front 9', triggers: 0, closed: false, pressNum: 0 },
                    { id: 'B9', baseId: 'B9', startHole: 10, endHole: 18, status: 0, label: 'Back 9', triggers: 0, closed: false, pressNum: 0 },
                    { id: '18', baseId: '18', startHole: 1, endHole: 18, status: 0, label: 'Total', triggers: 0, closed: false, pressNum: 0 }
                ];
            } else if (hasFront) {
                activeMatches = [
                    { id: 'F9', baseId: 'F9', startHole: 1, endHole: 9, status: 0, label: '9-Hole Match', triggers: 0, closed: false, pressNum: 0 }
                ];
            } else if (hasBack) {
                activeMatches = [
                    { id: 'B9', baseId: 'B9', startHole: 10, endHole: 18, status: 0, label: '9-Hole Match', triggers: 0, closed: false, pressNum: 0 }
                ];
            }
        } else {
            let startH = hasFront ? 1 : 10;
            let endH = hasBack ? 18 : 9;
            activeMatches = [
                { id: '18', baseId: '18', startHole: startH, endHole: endH, status: 0, label: 'Overall Match', triggers: 0, closed: false, pressNum: 0 }
            ];
        }

        let pressCount = 0;
        let maxThru = 0;
        let holeLog = {};

        courseData.forEach(hole => {
            let hNum = hole.hole;
            let t1Best = 999, t2Best = 999;
            let t1Valid = false, t2Valid = false;

            t1Players.forEach(p => {
                let v = savedScores[`p${p.id}_h${hNum}`];
                if (v && v > 0) {
                    let s = parseInt(v, 10) - (scoringType === 'net' ? getStrokes(hole.hcpIndex, parseHcp(p.hcp)) : 0);
                    if (s < t1Best) t1Best = s;
                    t1Valid = true;
                }
            });

            t2Players.forEach(p => {
                let v = savedScores[`p${p.id}_h${hNum}`];
                if (v && v > 0) {
                    let s = parseInt(v, 10) - (scoringType === 'net' ? getStrokes(hole.hcpIndex, parseHcp(p.hcp)) : 0);
                    if (s < t2Best) t2Best = s;
                    t2Valid = true;
                }
            });

            if (t1Valid && t2Valid) {
                maxThru++;
                let diff = 0;
                if (t1Best < t2Best) diff = 1;
                else if (t2Best < t1Best) diff = -1;

                let holeWinner = diff === 1 ? t1Name : (diff === -1 ? t2Name : "Halved");
                let newPresses = [];

                activeMatches.forEach(m => {
                    if (hNum >= m.startHole && hNum <= m.endHole && !m.closed) {
                        m.status += diff;

                        let hLeft = m.endHole - hNum;
                        if (Math.abs(m.status) > hLeft) {
                            m.closed = true;
                            let winnerName = m.status > 0 ? t1Name : t2Name;
                            m.finalResult = `${winnerName} ${Math.abs(m.status)}&${hLeft}`;
                        }

                        if (hNum < m.endHole) {
                            const threshold = pressRule === '2down' ? 2 : (pressRule === '1down' ? 1 : null);
                            const autoTrigger = threshold !== null && Math.abs(m.status) >= threshold;
                            const manualTrigger = (manualPresses || []).some(mp => mp.baseId === m.baseId && mp.startHole === hNum + 1);

                            if ((autoTrigger || manualTrigger) && m.triggers === 0) {
                                m.triggers = 1;
                                pressCount++;
                                
                                let existingPresses = activeMatches.filter(am => am.baseId === m.baseId && am.pressNum > 0).length + newPresses.filter(am => am.baseId === m.baseId).length;
                                let nextPressNum = existingPresses + 1;
                                
                                newPresses.push({
                                    id: `P${pressCount}`, 
                                    baseId: m.baseId, 
                                    startHole: hNum + 1, 
                                    endHole: m.endHole, 
                                    status: 0, 
                                    label: `Press ${nextPressNum} (Hole ${hNum + 1})`, 
                                    triggers: 0, 
                                    closed: false, 
                                    pressNum: nextPressNum
                                });
                            }
                        }
                    }
                });
                
                activeMatches = activeMatches.concat(newPresses);

                let f9 = activeMatches.find(m => m.id === 'F9');
                let b9 = activeMatches.find(m => m.id === 'B9');
                let t18 = activeMatches.find(m => m.id === '18');

                holeLog[hNum] = {
                    holeWinner: holeWinner,
                    f9Match: f9 ? f9.status : 0, f9Closed: f9 ? f9.closed : false, f9Res: f9 ? f9.finalResult : "",
                    b9Match: b9 ? b9.status : 0, b9Closed: b9 ? b9.closed : false, b9Res: b9 ? b9.finalResult : "",
                    totMatch: t18 ? t18.status : 0, totClosed: t18 ? t18.closed : false, totRes: t18 ? t18.finalResult : ""
                };
            }
        });

        let t1TotalMoney = 0;
        if (gameFormat === 'nassau') {
            activeMatches.forEach(m => {
                if (m.status > 0) t1TotalMoney += stake;
                else if (m.status < 0) t1TotalMoney -= stake;
            });
        } else {
            activeMatches.forEach(m => {
                if (holeBet > 0) {
                    t1TotalMoney += m.status * holeBet;
                } else {
                    if (m.status > 0) t1TotalMoney += stake;
                    else if (m.status < 0) t1TotalMoney -= stake;
                }
            });
        }

        return { t1Name, t2Name, activeMatches, maxThru, holeLog, t1TotalMoney, pressCount };
    }

    // --- HOLE BET + OVERALL BET ENGINE (mirrors index.html for final settlement) ---
    function getRichHoleBetScore(player, holeNum, courseHole, scoringType, savedScores) {
        const v = savedScores[`p${player.id}_h${holeNum}`];
        if (!v || v <= 0) return null;
        const gross = parseInt(v, 10);
        if (scoringType === 'gross') return gross;
        return gross - getStrokes(courseHole.hcpIndex, parseHcp(player.hcp));
    }

    function calculateHoleBetEngine(players, courseData, savedScores, config, presses) {
        if (!config || config.holeEnabled === false || players.length < 2) return null;
        const p1 = players[0], p2 = players[1];
        const sortedPresses = (presses || []).slice().sort((a, b) => a.fromHole - b.fromHole);

        function getStake(holeNum) {
            let stake = config.holeStake;
            sortedPresses.forEach(pr => { if (holeNum >= pr.fromHole) stake = pr.newStake; });
            return stake;
        }

        let segments = [];
        if (config.segment === 'frontback') {
            segments = [
                { holes: courseData.filter(h => h.hole <= 9) },
                { holes: courseData.filter(h => h.hole > 9) }
            ];
        } else {
            segments = [{ holes: courseData }];
        }

        let p1Money = 0;
        let holeLog = [];

        segments.forEach(seg => {
            let carry = 0;
            seg.holes.forEach(h => {
                const s1 = getRichHoleBetScore(p1, h.hole, h, config.scoringType, savedScores);
                const s2 = getRichHoleBetScore(p2, h.hole, h, config.scoringType, savedScores);
                if (s1 === null || s2 === null) return;

                const baseStake = getStake(h.hole);
                const effectiveStake = baseStake + carry;

                if (s1 < s2) {
                    p1Money += effectiveStake;
                    holeLog.push({ hole: h.hole, winner: p1.name, amount: effectiveStake });
                    carry = 0;
                } else if (s2 < s1) {
                    p1Money -= effectiveStake;
                    holeLog.push({ hole: h.hole, winner: p2.name, amount: effectiveStake });
                    carry = 0;
                } else {
                    if (config.tieRule === 'carry') {
                        carry = effectiveStake;
                        holeLog.push({ hole: h.hole, winner: null, amount: 0, carrying: carry });
                    } else {
                        holeLog.push({ hole: h.hole, winner: null, amount: 0, carrying: 0 });
                        carry = 0;
                    }
                }
            });
            // Any carry unresolved at the end of a segment is voided - not added to p1Money, not carried further
        });

        const startHole = courseData.length > 0 ? Math.min(...courseData.map(h => h.hole)) : 1;
        const rateHistory = [{ stake: config.holeStake, fromHole: startHole, pressNum: 0 }]
            .concat(sortedPresses.map((pr, i) => ({ stake: pr.newStake, fromHole: pr.fromHole, pressNum: i + 1 })));
        const tiesCarried = holeLog.filter(h => h.winner === null && h.carrying > 0).map(h => h.hole);

        return { p1, p2, p1Money, holeLog, rateHistory, tiesCarried };
    }

    function calculateOverallBetEngine(players, courseData, savedScores, config, presses) {
        if (!config || config.overallEnabled === false || players.length < 2) return null;
        const p1 = players[0], p2 = players[1];

        if (config.overallMode === 'stroke') {
            function segmentTotals(startHole) {
                let p1Total = 0, p2Total = 0, holesCompleted = 0, totalHolesInSeg = 0;
                courseData.forEach(h => {
                    if (h.hole < startHole) return;
                    totalHolesInSeg++;
                    const s1 = getRichHoleBetScore(p1, h.hole, h, config.scoringType, savedScores);
                    const s2 = getRichHoleBetScore(p2, h.hole, h, config.scoringType, savedScores);
                    if (s1 !== null && s2 !== null) {
                        p1Total += s1;
                        p2Total += s2;
                        holesCompleted++;
                    }
                });
                const roundComplete = holesCompleted === totalHolesInSeg && totalHolesInSeg > 0;
                let winner = null, money = 0;
                if (roundComplete) {
                    if (p1Total < p2Total) { winner = p1.name; money = config.overallStake; }
                    else if (p2Total < p1Total) { winner = p2.name; money = config.overallStake; }
                }
                const segP1Money = winner === p1.name ? money : (winner === p2.name ? -money : 0);
                return { startHole, p1Total, p2Total, holesCompleted, totalHoles: totalHolesInSeg, roundComplete, winner, p1Money: segP1Money };
            }

            const base = segmentTotals(courseData.length > 0 ? Math.min(...courseData.map(h => h.hole)) : 1);
            const pressSegs = (presses || []).slice().sort((a, b) => a.startHole - b.startHole).map((pr, i) => Object.assign(segmentTotals(pr.startHole), { pressNum: i + 1 }));

            let p1Money = base.p1Money;
            pressSegs.forEach(seg => { p1Money += seg.p1Money; });

            return {
                p1, p2, mode: 'stroke', base, pressSegs, p1Money,
                p1Total: base.p1Total, p2Total: base.p2Total, holesCompleted: base.holesCompleted, totalHoles: base.totalHoles, roundComplete: base.roundComplete, winner: base.winner
            };
        } else {
            function matchStatusFromHole(startHole) {
                let status = 0;
                courseData.forEach(h => {
                    if (h.hole < startHole) return;
                    const s1 = getRichHoleBetScore(p1, h.hole, h, config.scoringType, savedScores);
                    const s2 = getRichHoleBetScore(p2, h.hole, h, config.scoringType, savedScores);
                    if (s1 !== null && s2 !== null) {
                        if (s1 < s2) status += 1;
                        else if (s2 < s1) status -= 1;
                    }
                });
                return status;
            }

            const baseStatus = matchStatusFromHole(1);
            const pressResults = (presses || []).slice().sort((a, b) => a.startHole - b.startHole).map((pr, i) => ({ startHole: pr.startHole, status: matchStatusFromHole(pr.startHole), pressNum: i + 1 }));

            let p1Money = 0;
            if (baseStatus > 0) p1Money += config.overallStake;
            else if (baseStatus < 0) p1Money -= config.overallStake;
            pressResults.forEach(pr => {
                if (pr.status > 0) p1Money += config.overallStake;
                else if (pr.status < 0) p1Money -= config.overallStake;
            });

            return { p1, p2, mode: 'match', baseStatus, pressResults, p1Money };
        }
    }

    function renderRichHoleBetSettlement(data, moneyPlayers) {
        const richConfig = data.richHoleBet;
        if (!richConfig || !['stroke', 'match'].includes(data.gameFormat || 'stroke')) return "";

        if (moneyPlayers.length !== 2) {
            return `
                <div class="settle-card">
                    <div class="settle-header">💵 Hole Bet + Overall Bet Settlement</div>
                    <div style="text-align:center; color:var(--accent-red); padding:10px; font-size:0.85rem;">
                        ⚠️ This bet needs exactly 2 players marked "Playing for Money" — currently ${moneyPlayers.length}. Fix this on the Home/setup page.
                    </div>
                </div>
            `;
        }

        const courseData = data.courseData || [];
        const savedScores = data.scores || {};
        const holePresses = data.richHoleBetPresses ? Object.values(data.richHoleBetPresses) : [];
        const overallPresses = data.richOverallBetPresses ? Object.values(data.richOverallBetPresses) : [];

        const holeCalc = calculateHoleBetEngine(moneyPlayers, courseData, savedScores, richConfig, holePresses);
        const overallCalc = calculateOverallBetEngine(moneyPlayers, courseData, savedScores, richConfig, overallPresses);

        if (!holeCalc && !overallCalc) return "";

        function fmtM(amt) {
            if (amt > 0) return `<span class="val-pos">+$${amt}</span>`;
            if (amt < 0) return `<span class="val-neg">-$${Math.abs(amt)}</span>`;
            return `<span class="val-even">$0</span>`;
        }

        let rowsHtml = "";
        let p1TotalCombined = 0;
        let p1 = null, p2 = null;

        if (holeCalc) {
            p1 = holeCalc.p1; p2 = holeCalc.p2;
            p1TotalCombined += holeCalc.p1Money;
            const historyText = holeCalc.rateHistory.length > 1
                ? holeCalc.rateHistory.map(r => r.pressNum === 0 ? `$${r.stake}/hole (Hole ${r.fromHole})` : `Press ${r.pressNum} (Hole ${r.fromHole}): $${r.stake}/hole`).join(' → ')
                : "";
            const tiesText = holeCalc.tiesCarried.length > 0
                ? `<div style="font-size:0.7rem; color:var(--accent-red); padding:0 0 6px 0;">🔁 ${holeCalc.tiesCarried.length} tie${holeCalc.tiesCarried.length > 1 ? 's' : ''} carried forward (Hole${holeCalc.tiesCarried.length > 1 ? 's' : ''} ${holeCalc.tiesCarried.join(', ')})</div>`
                : "";
            rowsHtml += `
                <div class="breakdown-item">
                    <span>💵 Hole Bet ($${richConfig.holeStake}/hole${richConfig.tieRule === 'carry' ? ', carries on ties' : ', push on ties'}):</span>
                    <span><strong>${holeCalc.p1.name.split(' ')[0]}: ${fmtM(holeCalc.p1Money)}</strong></span>
                </div>
                ${historyText ? `<div style="font-size:0.7rem; color:var(--text-muted); padding:2px 0 4px 0;">${historyText}</div>` : ""}
                ${tiesText}
            `;
        }
        if (overallCalc) {
            p1 = overallCalc.p1; p2 = overallCalc.p2;
            p1TotalCombined += overallCalc.p1Money;
            let statusDesc = "All Square ($0)";
            if (overallCalc.mode === 'stroke') {
                const b = overallCalc.base;
                statusDesc = b.winner ? `${b.winner} Won base bet` : (b.roundComplete ? "Base bet tied ($0)" : "Base bet incomplete");
                if (overallCalc.pressSegs.length > 0) {
                    const segTexts = overallCalc.pressSegs.map(seg => {
                        if (!seg.roundComplete) return `Press ${seg.pressNum} (Hole ${seg.startHole}): incomplete`;
                        return `Press ${seg.pressNum} (Hole ${seg.startHole}): ${seg.winner ? seg.winner.split(' ')[0] + ' won' : 'tied'}`;
                    });
                    statusDesc += ` • ${segTexts.join(', ')}`;
                }
            } else {
                if (overallCalc.baseStatus > 0) statusDesc = `${overallCalc.p1.name.split(' ')[0]} Won`;
                else if (overallCalc.baseStatus < 0) statusDesc = `${overallCalc.p2.name.split(' ')[0]} Won`;
                if (overallCalc.pressResults.length > 0) {
                    const segTexts = overallCalc.pressResults.map(pr => {
                        const st = pr.status;
                        const desc = st === 0 ? 'All Square' : (st > 0 ? `${overallCalc.p1.name.split(' ')[0]} ${st} UP` : `${overallCalc.p2.name.split(' ')[0]} ${Math.abs(st)} UP`);
                        return `Press ${pr.pressNum} (Hole ${pr.startHole}): ${desc}`;
                    });
                    statusDesc += ` • ${segTexts.join(', ')}`;
                }
            }
            rowsHtml += `
                <div class="breakdown-item">
                    <span>🏆 Overall Bet ($${richConfig.overallStake}, ${overallCalc.mode === 'stroke' ? 'Stroke' : 'Match'}): ${statusDesc}</span>
                    <span><strong>${fmtM(overallCalc.p1Money)}</strong></span>
                </div>
            `;
        }

        if (!p1) return "";

        return `
            <div class="settle-card">
                <div class="settle-header">💵 Hole Bet + Overall Bet Settlement</div>
                <div class="match-breakdown-list" style="margin-bottom: 16px;">
                    <div style="font-weight: bold; margin-bottom: 4px; color: var(--brand-green);">Bet Breakdown:</div>
                    ${rowsHtml}
                </div>
                <div class="ledger-row" style="background:var(--nav-bg);">
                    <span>${p1.name}:</span>
                    <span>${fmtM(p1TotalCombined)}</span>
                </div>
                <div class="ledger-row" style="background:var(--nav-bg);">
                    <span>${p2.name}:</span>
                    <span>${fmtM(-p1TotalCombined)}</span>
                </div>
            </div>
        `;
    }

    function calculateBirdieGameTotalsForSettle(data, courseData, savedScores) {
        if (data.birdieGameEnabled !== true) return {};
        const players = (data.players || []).filter(p => p.playingForMoney !== false);
        const unitVal = data.birdieUnitVal !== undefined ? data.birdieUnitVal : 0;
        const scoringType = data.birdieScoringType || 'gross';
        let totals = {};
        players.forEach(p => totals[p.id] = 0);
        (courseData || []).forEach(h => {
            players.forEach(p => {
                const v = savedScores[`p${p.id}_h${h.hole}`];
                if (!v || v <= 0) return;
                let score = parseInt(v, 10);
                if (scoringType === 'net') score -= getStrokes(h.hcpIndex, parseHcp(p.hcp));
                const under = parseInt(h.par) - score;
                if (under >= 1) totals[p.id] += under * unitVal;
            });
        });
        return totals;
    }

    function calculateKPGameTotalsForSettle(data, courseData) {
        if (data.kpGameEnabled !== true) return { money: {}, wins: {} };
        const players = (data.players || []).filter(p => p.playingForMoney !== false);
        if (players.length < 2 || players.length > 4) return { money: {}, wins: {} };
        const kpHoles = (courseData || []).filter(h => parseInt(h.par) === 3);
        const kpWinners = data.kpWinners || {};
        const buyIn = data.kpBuyIn !== undefined ? data.kpBuyIn : 0;
        let money = {}, wins = {};
        players.forEach(p => { money[p.id] = 0; wins[p.id] = 0; });
        kpHoles.forEach(h => {
            const winnerId = kpWinners[`h${h.hole}`];
            if (!winnerId) return;
            const winnerPlayer = players.find(p => String(p.id) === String(winnerId));
            if (!winnerPlayer) return;
            wins[winnerPlayer.id] = (wins[winnerPlayer.id] || 0) + 1;
            money[winnerPlayer.id] += buyIn * (players.length - 1);
        });
        return { money, wins };
    }

    function buildSideGamesHtml(data, courseData, savedScores) {
        let html = "";

        if (data.birdieGameEnabled === true) {
            const totals = calculateBirdieGameTotalsForSettle(data, courseData, savedScores);
            const players = (data.players || []).filter(p => p.playingForMoney !== false);
            if (players.length > 0) {
                html += `<div class="settle-card"><div class="settle-header">🐦 Birdie Game (amount won)</div>`;
                players.forEach(p => {
                    html += `<div class="ledger-row"><span>${p.name}</span><span>$${(totals[p.id] || 0).toFixed(2)}</span></div>`;
                });
                html += `</div>`;
            }
        }

        if (data.kpGameEnabled === true) {
            const result = calculateKPGameTotalsForSettle(data, courseData);
            const players = (data.players || []).filter(p => p.playingForMoney !== false);
            if (players.length >= 2 && players.length <= 4) {
                html += `<div class="settle-card"><div class="settle-header">📍 Dollar Game / KPs (amount won)</div>`;
                players.forEach(p => {
                    const wins = result.wins[p.id] || 0;
                    html += `<div class="ledger-row"><span>${p.name}${wins > 0 ? ` (${wins} KP${wins > 1 ? 's' : ''})` : ''}</span><span>$${(result.money[p.id] || 0).toFixed(2)}</span></div>`;
                });
                html += `</div>`;
            }
        }

        return html;
    }

    function renderSettlement(data) {
        const container = document.getElementById("settle-content");
        const players = data.players || [];
        const courseData = data.courseData || [];
        const savedScores = data.scores || {};
        const gameFormat = data.gameFormat || "stroke";
        const holeBet = data.holeBetStake || 0;

        // Only players opted in to money betting are included in payout math below -
        // everyone still scores normally regardless of this flag (team formats never show
        // this checkbox, so it's a no-op there and full teams stay intact).
        const moneyPlayers = players.filter(p => p.playingForMoney !== false);

        if (gameFormat === 'wolf') {
            const wolfCalc = calcWolfEngine(data, courseData, savedScores);
            const wolfMoney = calcPointSettlement(moneyPlayers, wolfCalc.totals, data.wolfPointVal || 0);
            let ledgerHtml = "";

            moneyPlayers.forEach(p => {
                let pts = wolfCalc.totals[p.id] || 0;
                let money = wolfMoney[p.id] || 0;
                let moneyClass = money >= 0 ? "val-pos" : "val-neg";
                let moneyText = money >= 0 ? `+$${money.toFixed(2)}` : `-$${Math.abs(money).toFixed(2)}`;

                ledgerHtml += `
                    <div class="ledger-row">
                        <span>${p.name} (${pts} pt${pts === 1 ? '' : 's'}):</span>
                        <span class="${moneyClass}">${moneyText}</span>
                    </div>
                `;
            });

            if (players.length !== 4) {
                ledgerHtml = `<div style="text-align:center; color: var(--text-muted); padding: 10px;">Wolf requires exactly 4 players — check the Home/setup page.</div>`;
            }

            container.innerHTML = `
                <div class="settle-card">
                    <div class="settle-header">🐺 Final Wolf Settlement</div>
                    ${ledgerHtml}
                </div>
                ${buildSideGamesHtml(data, courseData, savedScores)}
                <button class="btn-primary" onclick="window.print()">📄 Save / Share as PDF</button>
            `;
            return;
        }

        if (gameFormat === 'stableford') {
            const sfCalc = calcStablefordEngine(data, courseData, savedScores);
            const sfMoney = calcPointSettlement(moneyPlayers, sfCalc.totals, data.stablefordPointVal || 0);
            let ledgerHtml = "";

            moneyPlayers.forEach(p => {
                let pts = sfCalc.totals[p.id] || 0;
                let money = sfMoney[p.id] || 0;
                let moneyClass = money >= 0 ? "val-pos" : "val-neg";
                let moneyText = money >= 0 ? `+$${money.toFixed(2)}` : `-$${Math.abs(money).toFixed(2)}`;

                ledgerHtml += `
                    <div class="ledger-row">
                        <span>${p.name} (${pts} pt${pts === 1 ? '' : 's'}):</span>
                        <span class="${moneyClass}">${moneyText}</span>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="settle-card">
                    <div class="settle-header">🎯 Final Stableford Settlement</div>
                    ${ledgerHtml}
                </div>
                ${buildSideGamesHtml(data, courseData, savedScores)}
                <button class="btn-primary" onclick="window.print()">📄 Save / Share as PDF</button>
            `;
            return;
        }

        if (gameFormat === 'dots') {
            let playerDots = {};
            moneyPlayers.forEach(p => playerDots[p.id] = 0);
            
            if (data.dots) {
                Object.values(data.dots).forEach(holeDots => {
                    Object.keys(holeDots).forEach(pKey => {
                        let pid = pKey.replace('p', '');
                        if (playerDots[pid] !== undefined) {
                            holeDots[pKey].forEach(dotType => {
                                if (dotType === 'snake') playerDots[pid] -= 1;
                                else playerDots[pid] += 1;
                            });
                        }
                    });
                });
            }

            let dotVal = data.dotPointVal || 0;
            let ledgerHtml = "";
            
            moneyPlayers.forEach(p => {
                let pts = playerDots[p.id];
                let money = pts * dotVal;
                let moneyClass = pts >= 0 ? "val-pos" : "val-neg";
                let moneyText = pts >= 0 ? `+$${money}` : `-$${Math.abs(money)}`;
                
                ledgerHtml += `
                    <div class="ledger-row">
                        <span>${p.name} (${pts} Dots):</span>
                        <span class="${moneyClass}">${moneyText}</span>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="settle-card">
                    <div class="settle-header">🎯 Final Dot Game Settlement</div>
                    ${ledgerHtml}
                </div>
                ${buildSideGamesHtml(data, courseData, savedScores)}
                <button class="btn-primary" onclick="window.print()">📄 Save / Share as PDF</button>
            `;
            return;
        }

        if (gameFormat === 'stroke') {
            const richHtml = renderRichHoleBetSettlement(data, moneyPlayers);
            const sideHtml = buildSideGamesHtml(data, courseData, savedScores);
            if (richHtml || sideHtml) {
                container.innerHTML = richHtml + sideHtml + `<button class="btn-primary" onclick="window.print()">📄 Save / Share as PDF</button>`;
            } else {
                container.innerHTML = `
                    <div class="settle-card">
                        <div class="settle-header">Final Ledger</div>
                        <div style="text-align: center; color: var(--text-muted); padding: 10px;">No money bets were set up for this round.</div>
                    </div>
                `;
            }
            return;
        }

        if (gameFormat !== 'nassau' && !['match', 'bestball', 'scramble', 'ryder'].includes(gameFormat)) {
            const sideHtml = buildSideGamesHtml(data, courseData, savedScores);
            container.innerHTML = `
                <div class="settle-card">
                    <div class="settle-header">Final Ledger</div>
                    <div style="text-align: center; color: #555; padding: 10px;">Settlement calculations are currently built for Match Play, Nassau, Dot, Wolf, and Stableford formats.</div>
                </div>
                ${sideHtml}
                <button class="btn-primary" onclick="window.print()">📄 Save / Share as PDF</button>
            `;
            return;
        }

        let scoringType = data.nassauScoring || data.matchScoring || "net";
        let pressRule = gameFormat === 'nassau' ? (data.nassauPressRule || "none") : (data.matchPressRule || "none");
        let nassauStake = data.nassauStake || 10;
        let matchStake = data.matchStake || 0;
        let stakeToUse = gameFormat === 'nassau' ? nassauStake : matchStake;

        const manualMatchPresses = data.matchPresses ? Object.values(data.matchPresses) : [];
        const matchData = calculateMatchEngine(moneyPlayers, courseData, savedScores, scoringType, gameFormat, pressRule, stakeToUse, holeBet, manualMatchPresses);

        if (!matchData) {
            const sideHtml = buildSideGamesHtml(data, courseData, savedScores);
            container.innerHTML = `
                <div class="settle-card">
                    <div class="settle-header">Final Ledger</div>
                    <div style="text-align: center; color: #555; padding: 10px;">Waiting for players and scores to be entered...</div>
                </div>
                ${sideHtml}
                ${sideHtml ? '<button class="btn-primary" onclick="window.print()">📄 Save / Share as PDF</button>' : ''}
            `;
            return;
        }

        let breakdownHtml = "";
        
        if (gameFormat === 'nassau') {
            ['F9', 'B9', '18'].forEach(bId => {
                let groupMatches = matchData.activeMatches.filter(m => m.baseId === bId);
                if(groupMatches.length > 0) {
                    let groupLabel = bId === 'F9' ? 'Front 9' : (bId === 'B9' ? 'Back 9' : 'Total');

                        else if (m.status < 0) statusDesc = `${matchData.t2Name} +$${stakeToUse}`;

                        breakdownHtml += `<div class="breakdown-item" style="border-bottom:1px solid #eee; padding: 4px 0; ${indent}"><span>${lockIcon}${m.label}:</span> <strong>${statusDesc}</strong></div>`;
                    });

        } else {
            let t18 = matchData.activeMatches.find(m => m.id === '18');

            if (holeBet > 0) {

            breakdownHtml += `
                <div class="breakdown-item">
                    <span>Overall Match:</span>
                    <span><strong>${statusDesc}</strong></span>
                </div>

        }

        let t1Total = matchData.t1TotalMoney;
        function formatMoney(amount) {
            if (amount > 0) return `<span class="val-pos">+$${amount}</span>`;
            if (amount < 0) return `<span class="val-neg">-$${Math.abs(amount)}</span>`;
            return `<span class="val-even">$0</span>`;
        }

        const richHtml = (gameFormat === 'match') ? renderRichHoleBetSettlement(data, moneyPlayers) : "";
        const sideHtml = buildSideGamesHtml(data, courseData, savedScores);

        container.innerHTML = `
            <div class="settle-card">
                <div class="settle-header">💵 Final Payout Settlement (${matchData.t1Name} vs ${matchData.t2Name})</div>
                
                <div class="match-breakdown-list" style="margin-bottom: 16px;">
                    <div style="font-weight: bold; margin-bottom: 4px; color: #0f4c3a;">Bet Breakdown:</div>

            ${richHtml}
            ${sideHtml}

            <button class="btn-primary" onclick="window.print()">📄 Save / Share as PDF</button>
        `;
    }
</script>
