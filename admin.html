    function handleCourseChange() {
        const courseKey = document.getElementById("course-select").value;
        const loopBox = document.getElementById("nine-loop-selector");
        if (nineHoleLoops[courseKey]) {
            const loops = nineHoleLoops[courseKey];
            const frontSelect = document.getElementById("front-nine-select");
            const backSelect = document.getElementById("back-nine-select");
            frontSelect.innerHTML = ""; backSelect.innerHTML = "";
            Object.keys(loops).forEach((key) => {
                frontSelect.innerHTML += `<option value="${key}">${loops[key].name}</option>`;
                backSelect.innerHTML += `<option value="${key}">${loops[key].name}</option>`;
            });
            const loopKeys = Object.keys(loops);
            frontSelect.selectedIndex = 0;
            backSelect.selectedIndex = (loopKeys.length > 1) ? 1 : 0;
            loopBox.style.display = "block";
        } else {
            loopBox.style.display = "none";
        }
    }

    function captureCurrentPlayerInputs() {
        const rows = document.querySelectorAll('.player-row');
        const list = [];
        rows.forEach((row, idx) => {
            const nameVal = row.querySelector('.p-name-input') ? row.querySelector('.p-name-input').value : `Player ${idx + 1}`;
            const hcpVal = row.querySelector('.p-hcp-input') ? row.querySelector('.p-hcp-input').value : "0";
            const teamVal = row.querySelector('.p-team-input') ? row.querySelector('.p-team-input').value : `T-${Math.floor(idx / 2) + 1}`;
            const squadVal = row.querySelector('.p-squad-input') ? row.querySelector('.p-squad-input').value : (idx % 2 === 0 ? "red" : "blue");
            list.push({ id: idx + 101, name: nameVal, hcp: hcpVal, team: teamVal, squad: squadVal });
        });
        return list;
    }

    function renderPlayerList() {
        const format = document.getElementById("game-format-select").value;
        const nassauType = document.getElementById("nassau-type") ? document.getElementById("nassau-type").value : "1v1";
        const headerRow = document.getElementById("player-header-row");
        const listContainer = document.getElementById("player-list");
        
        let existingData = captureCurrentPlayerInputs();
        if (existingData.length === 0) existingData = storedPlayersTemp;

        listContainer.innerHTML = "";

        if (format === 'ryder') {
            headerRow.className = "grid-ryder";
            headerRow.innerHTML = `<span>Name</span><span>HCP</span><span>Team</span><span>Squad</span><span></span>`;
        } else if (['bestball', 'scramble'].includes(format) || (format === 'nassau' && nassauType === 'team')) {
            headerRow.className = "grid-team";
            headerRow.innerHTML = `<span>Name</span><span>HCP</span><span>Team</span><span></span>`;
        } else {
            headerRow.className = "grid-stroke";
            headerRow.innerHTML = `<span>Name</span><span>HCP</span><span></span>`;
        }

        existingData.forEach((p, idx) => {
            addPlayerRow(p.name, p.hcp, p.team, p.squad, false);
        });
    }

    function handleFormatChange() {
        const format = document.getElementById("game-format-select").value;
        document.getElementById("nassau-settings").style.display = (format === "nassau") ? "block" : "none";
        document.getElementById("wolf-settings").style.display = (format === "wolf") ? "block" : "none";
        renderPlayerList();
    }

    function buildMergedCourseData(courseKey) {
        if (nineHoleLoops[courseKey]) {
            const loops = nineHoleLoops[courseKey];
            const frontKey = document.getElementById("front-nine-select").value;
            const backKey = document.getElementById("back-nine-select").value;
            const frontLoop = loops[frontKey];
            const backLoop = loops[backKey];
            const combinedData = [];
            frontLoop.data.forEach((item, idx) => { combinedData.push({ hole: idx + 1, par: item.par, hcpIndex: (idx * 2) + 1 }); });
            backLoop.data.forEach((item, idx) => { combinedData.push({ hole: idx + 10, par: item.par, hcpIndex: (idx + 1) * 2 }); });
            return { name: `Eagle's Pride (${frontLoop.name} / ${backLoop.name})`, data: combinedData };
        } else {
            return coursePresets[courseKey];
        }
    }

    function loadModeData(modeKey) {
        currentMode = modeKey;
        document.getElementById("mode-btn-regular").className = (modeKey === 'regular') ? "mode-btn active-mode" : "mode-btn";
        document.getElementById("mode-btn-trip").className = (modeKey === 'trip') ? "mode-btn active-mode" : "mode-btn";

        db.ref(`events/${modeKey}`).once('value').then((snapshot) => {
            const data = snapshot.val() || {};
            document.getElementById("event-name").value = data.eventName || (modeKey === 'regular' ? 'Weekend Round' : 'Myrtle Beach Trip 2026');
            const defaultCourseKey = (modeKey === 'regular') ? 'greatriver' : 'caledonia';
            document.getElementById("course-select").value = data.activeCourseKey || defaultCourseKey;
            handleCourseChange();

            if (data.gameFormat) document.getElementById("game-format-select").value = data.gameFormat;
            if (data.nassauType) document.getElementById("nassau-type").value = data.nassauType;
            if (data.nassauScoring) document.getElementById("nassau-scoring").value = data.nassauScoring;
            if (data.nassauStake) document.getElementById("nassau-stake").value = data.nassauStake;
            if (data.nassauPressRule) document.getElementById("nassau-press-rule").value = data.nassauPressRule;
            if (data.wolfPointVal) document.getElementById("wolf-point-value").value = data.wolfPointVal;

            storedPlayersTemp = (data.players && data.players.length > 0) ? data.players : [
                { id: 101, name: "Player 1", hcp: "0", team: "T-1", squad: "red" },
                { id: 102, name: "Player 2", hcp: "0", team: "T-1", squad: "blue" },
                { id: 103, name: "Player 3", hcp: "0", team: "T-2", squad: "red" },
                { id: 104, name: "Player 4", hcp: "0", team: "T-2", squad: "blue" }
            ];

            handleFormatChange();
        });
    }

    function switchMode(newMode) {
        db.ref("active_event_mode").set(newMode).then(() => { loadModeData(newMode); });
    }

    db.ref("active_event_mode").once('value').then((snapshot) => {
        const activeMode = snapshot.val() || "regular";
        loadModeData(activeMode);
    });

    function addPlayerRow(name = "", hcp = "0", team = "", squad = "red", isNewBtnClick = true) {
        const listContainer = document.getElementById("player-list");
        const currentCount = document.querySelectorAll('.player-row').length + 1;
        const format = document.getElementById("game-format-select").value;
        const nassauType = document.getElementById("nassau-type") ? document.getElementById("nassau-type").value : "1v1";
        const teamSize = (format === 'scramble') ? 4 : 2;
        const autoTeamIdx = Math.floor((currentCount - 1) / teamSize);
        const defaultTeam = team || teamOptions[autoTeamIdx % teamOptions.length];

        let teamOptionsHtml = "";
        teamOptions.forEach(t => { teamOptionsHtml += `<option value="${t}" ${t === defaultTeam ? 'selected' : ''}>${t}</option>`; });

        let gridClass = "grid-stroke";
        let teamFieldHtml = "";
        let squadFieldHtml = "";

        if (format === 'ryder') {
            gridClass = "grid-ryder";
            teamFieldHtml = `<select class="p-team-input">${teamOptionsHtml}</select>`;
            squadFieldHtml = `
                <select class="p-squad-input">
                    <option value="red" ${squad === 'red' ? 'selected' : ''}>🔴 Red</option>
                    <option value="blue" ${squad === 'blue' ? 'selected' : ''}>🔵 Blue</option>
                </select>`;
        } else if (['bestball', 'scramble'].includes(format) || (format === 'nassau' && nassauType === 'team')) {
            gridClass = "grid-team";
            teamFieldHtml = `<select class="p-team-input">${teamOptionsHtml}</select>`;
        }

        const row = document.createElement("div");
        row.className = `player-row ${gridClass}`;
        row.innerHTML = `
            <input type="text" class="p-name-input" placeholder="Player Name" value="${name || (isNewBtnClick ? 'Player ' + currentCount : '')}">
            <input type="text" class="p-hcp-input" placeholder="HCP" value="${hcp || '0'}">
            ${teamFieldHtml}
            ${squadFieldHtml}
            <button class="btn-del" onclick="this.parentElement.remove(); updateCount();">✕</button>
        `;
        listContainer.appendChild(row);
        updateCount();
    }

    function updateCount() { document.getElementById("player-count").textContent = document.querySelectorAll('.player-row').length; }

    function saveSettings() {
        const gameFormat = document.getElementById("game-format-select").value;
        if (!gameFormat) { alert("⚠️ Please select a Round Game Format before saving!"); return; }

        const rows = document.querySelectorAll('.player-row');
        if (gameFormat === 'wolf' && rows.length !== 4) {
            alert("⚠️ Wolf Game Tracker requires exactly 4 active players!");
            return;
        }

        const courseKey = document.getElementById("course-select").value;
        const baseEventName = document.getElementById("event-name").value;
        const selectedCourse = buildMergedCourseData(courseKey);

        const nassauType = document.getElementById("nassau-type") ? document.getElementById("nassau-type").value : "1v1";
        const nassauScoring = document.getElementById("nassau-scoring") ? document.getElementById("nassau-scoring").value : "net";
        const nassauStake = parseFloat(document.getElementById("nassau-stake").value) || 10;
        const nassauPressRule = document.getElementById("nassau-press-rule").value || "2down";
        const wolfPointVal = parseFloat(document.getElementById("wolf-point-value").value) || 2;

        const playersList = [];
        rows.forEach((row, idx) => {
            const nameVal = row.querySelector('.p-name-input').value.trim() || `Player ${idx + 1}`;
            let hcpVal = row.querySelector('.p-hcp-input') ? row.querySelector('.p-hcp-input').value.trim() : "0";
            
            const teamSelect = row.querySelector('.p-team-input');
            const squadSelect = row.querySelector('.p-squad-input');

            const teamVal = teamSelect ? teamSelect.value : "T-1";
            const squadVal = squadSelect ? squadSelect.value : "red";
            
            if (!hcpVal.startsWith("+")) {
                let numVal = parseFloat(hcpVal);
                if (isNaN(numVal)) numVal = 0;
                if (numVal > 36) numVal = 36;
                hcpVal = String(numVal);
            }

            playersList.push({ id: idx + 101, name: nameVal, hcp: hcpVal, team: teamVal, squad: squadVal });
        });

        db.ref(`events/${currentMode}`).update({
            eventName: baseEventName,
            activeCourseKey: courseKey,
            courseName: selectedCourse.name,
            gameFormat: gameFormat,
            nassauType: nassauType,
            nassauScoring: nassauScoring,
            nassauStake: nassauStake,
            nassauPressRule: nassauPressRule,
            wolfPointVal: wolfPointVal,
            courseData: selectedCourse.data,
            players: playersList
        });

        db.ref("active_event_mode").set(currentMode).then(() => {
            alert(`✅ Saved! ${playersList.length} players activated for ${selectedCourse.name} under [${currentMode === 'regular' ? '🟢 Regular Round' : '⛳ Myrtle Beach Trip'}].`);
        }).catch((err) => { alert(`Save error: ${err.message}`); });
    }

    function resetRoundData() {
        if (confirm(`Are you sure you want to clear all entered scores for the current ${currentMode === 'regular' ? 'Regular Round' : 'Myrtle Beach Trip'}?`)) {
            db.ref(`events/${currentMode}/scores`).remove();
            db.ref(`events/${currentMode}/wolfPicks`).remove();
            alert("Active round scores reset!");
        }
    }

    function generateQRCode() {
        const currentUrl = window.location.href.replace('admin.html', 'index.html');
        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
            text: currentUrl, width: 140, height: 140,
            colorDark : "#0f4c3a", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
        });
    }

    function copyAppUrl() {
        const currentUrl = window.location.href.replace('admin.html', 'index.html');
        navigator.clipboard.writeText(currentUrl).then(() => alert("Copied friend spectator/scorecard link!"));
    }

    generateQRCode();
</script>
